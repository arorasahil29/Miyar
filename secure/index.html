  if (!rows.length) return [{label: 'No rows match the current filters', html: ''}];
  // the figures this page is about (its KPI cards), and the breakdowns it uses
  let heads = [];
  for (const v of p.visuals){
    if (v.type === 'kpi' && v.measures[0] && !missingFields(v).length) heads.push({m: v.measures[0], label: v.title || measureLabel(v.measures[0]), low: !!v.lowerBetter});
    if (v.type === 'multicard' && !missingFields(v).length) v.measures.forEach(m => heads.push({m, label: measureLabel(m), low: false}));
  }
  if (!heads.length){
    const num = FIELDS.find(f => f.role === 'measure' && f.src === 'col');
    heads.push(num ? {m: {f: num.name, agg: 'sum'}, label: num.name, low: false} : {m: {f: RECORDS, agg: 'count'}, label: 'Rows', low: false});
  }
  heads = heads.filter((h, i, a) => h.m.f !== RECORDS && a.findIndex(x => x.m.f === h.m.f) === i).slice(0, 4);
  if (!heads.length) heads = [{m: {f: RECORDS, agg: 'count'}, label: 'Rows', low: false}];
  const dims = [];
  for (const v of p.visuals){
    if (!['bar', 'column', 'stacked', 'stackedbar', 'donut', 'pie', 'treemap', 'funnel', 'waterfall', 'slicer', 'matrix', 'table'].includes(v.type) || missingFields(v).length) continue;
    for (const d of (effective(v).dims || []).slice(0, 1)) if (FMAP.get(d)?.src !== 'part' && FMAP.get(d)?.type !== 'date' && !dims.includes(d)) dims.push(d);
  }
  if (!dims.length){ const d = FIELDS.find(f => f.role === 'dim' && f.src === 'col' && f.type === 'string' && !/(^|\s)(id|code|no)$/i.test(f.name)); if (d) dims.push(d.name); }
  const date = FIELDS.find(f => f.type === 'date' && f.src === 'col')?.name, mf = date && `${date} (Month)`;
  const B = s => `<b>${esc(s)}</b>`, N = s => `<b class="tk-n">${esc(s)}</b>`;
  const lc = s => String(s).replace(/\b([A-Z])([a-z])/g, (_, a, b) => a.toLowerCase() + b);
  const dimName = d => lc(shortName(d)).replace(/ name$/, '');
  const plural = w => /[^aeiou]y$/.test(w) ? w.slice(0, -1) + 'ies' : /(s|x|ch|sh)$/.test(w) ? w + 'es' : w + 's';
  const has = label => /s$/i.test(label) ? 'have' : 'has';
  const isPct = m => fmtKind(m) === 'percent', add = m => additive(m);
  const fv = (v, m) => fmtVal(v, m, Math.abs(v ?? 0) >= 1e5);
  const chg = (a, b, m) => isPct(m) ? {d: b - a, txt: `${(Math.abs(b - a) * 100).toFixed(1)} pts`} : a ? {d: (b - a) / Math.abs(a), txt: `${(Math.abs(b - a) / Math.abs(a) * 100).toFixed(0)}%`} : null;
  const arrow = (d, low) => `<span class="${Math.abs(d) < 1e-9 ? '' : (d > 0) !== low ? 'up' : 'down'}">${d >= 0 ? '▲' : '▼'}</span>`;
  const mon = k => MONTHS[+k.slice(5, 7) - 1];
  const out = [];
  const push = (rank, label, html, sel) => out.push({rank, label, html, sel});
  // monthly series for each headline figure
  const series = h => {
    if (!mf || !FMAP.has(mf)) return null;
    const g = groupRows(rows.filter(r => r[mf]), r => r[mf]), ks = [...g.keys()].sort();
    const lastDay = rows.reduce((a, r) => r[date] && r[date] > a ? r[date] : a, '');
    if (add(h.m) && ks.length > 3 && +lastDay.slice(8, 10) < 25) ks.pop();   // a month with only some of its days would look like a fall
    return {ks, g, vals: ks.map(k => measureVal(h.m, g.get(k)))};
  };

  // 1. how the selection compares with everyone
  const active = Object.entries(S.sel).filter(([, x]) => x.size);

    const who = active.map(([f, x]) => x.size <= 3 ? [...x].join(' & ') : `${x.size} ${plural(dimName(f))}`).join(' · ');
    if (mine != null && all != null){
      if (add(h.m)) push(0, 'Your selection', `${B(who)} accounts for ${N(all ? (mine / all * 100).toFixed(1) + '%' : '–')} of ${esc(lc(h.label))} (${N(fv(mine, h.m))} of ${fv(all, h.m)})`);
      else { const c = chg(all, mine, h.m); push(0, 'Your selection', `${esc(h.label)} for ${B(who)} is ${N(fv(mine, h.m))} against ${fv(all, h.m)} for everyone${c && Math.abs(c.d) > 1e-4 ? ` ${arrow(c.d, h.low)} ${esc(c.txt)}` : ''}`); }
    }
  }
  // 2. the last three months against the three before (or this year against the same months last year)
  for (const {h, s} of S1.slice(0, 2)){
    if (!s || s.ks.length < 4) continue;
    const n = s.ks.length, yoy = s.ks.filter(k => s.ks.includes(monthAdd(k, -12)) && k.slice(0, 4) === s.ks.at(-1).slice(0, 4));
    let a, b, label, note;

      a = measureVal(h.m, prev); b = measureVal(h.m, cur); label = 'Year on year'; note = `${mon(yoy[0])}–${mon(yoy.at(-1))} ${yoy[0].slice(0, 4)} vs a year earlier`;
    } else if (n >= 6){
      const last3 = s.ks.slice(-3), prev3 = s.ks.slice(-6, -3);
      b = measureVal(h.m, last3.flatMap(k => s.g.get(k))); a = measureVal(h.m, prev3.flatMap(k => s.g.get(k)));
      label = 'Last 3 months'; note = `${mon(last3[0])}–${mon(last3[2])} vs ${mon(prev3[0])}–${mon(prev3[2])}`;
    } else continue;
    const c = a != null && b != null && chg(a, b, h.m); if (!c) continue;
    push(2, label, `${esc(h.label)} ${N(fv(b, h.m))} vs ${fv(a, h.m)} ${arrow(c.d, h.low)} ${esc(c.txt)} <span class="n">${esc(note)}</span>`);
  }
  // 3. biggest mover in the last month, by each breakdown
  const movers = [];
  if (mf && FMAP.has(mf)) for (const d of dims.slice(0, 2)){
    let best = null;
    for (const {h, s} of S1){
      if (!s || s.ks.length < 2) continue;
      const [k0, k1] = s.ks.slice(-2), r0 = groupRows(s.g.get(k0), r => keyOf(r[d])), r1 = groupRows(s.g.get(k1), r => keyOf(r[d]));
      if (r1.size < 2 || r1.size > 60) continue;
      for (const [k, rs] of r1){
        const prs = r0.get(k); if (!prs || k === '(Blank)' || rs.length < 5 || prs.length < 5) continue;
        const a = measureVal(h.m, prs), b = measureVal(h.m, rs); if (a == null || b == null) continue;
        const c = chg(a, b, h.m); if (!c) continue;
        if (isPct(h.m) && (rs.length < 12 || prs.length < 12)) continue;
        // a change has to stand out from ordinary month-to-month noise

          : add(h.m) && a >= 0 && b >= 0 ? Math.abs(b - a) / Math.sqrt(Math.max(1, a + b)) : Math.abs(c.d) * 3;

    const small = !isPct(x.h.m) && Math.min(x.a, x.b) < 20, d = x.b - x.a;
    push(1 + i * 3, 'Biggest change', `${B(x.k)} ${esc(lc(x.h.label))} ${N(fv(x.b, x.h.m))} ${arrow(small ? d : x.c.d, x.h.low)} ${esc(small ? `${d >= 0 ? '+' : '−'}${fv(Math.abs(d), x.h.m)}` : x.c.txt)} <span class="n">in ${mon(x.k1)}, from ${esc(fv(x.a, x.h.m))} in ${mon(x.k0)}</span>`, [x.d, x.k]);

    const v = s.vals; let run = 0, dir = 0;
    for (let i = v.length - 1; i > 0; i--){ const d = Math.sign(v[i] - v[i - 1]); if (!d || (dir && d !== dir)) break; dir = d; run++; }
    const last = mon(s.ks.at(-1));
    if (run >= 3) push(4, 'Streak', `${esc(h.label)} ${has(h.label)} ${dir > 0 ? 'risen' : 'fallen'} ${N(run + ' months')} in a row ${arrow(dir, h.low)} <span class="n">to ${esc(fv(v.at(-1), h.m))} in ${last}</span>`);
    else if (v.length >= 6){
      const hi = Math.max(...v), lo = Math.min(...v);
      if (v.at(-1) === hi || v.at(-1) === lo){
        const top = v.at(-1) === hi;
        push(4, 'Record', `${last} had the ${B(top ? 'highest' : 'lowest')} ${esc(lc(h.label))} in ${v.length} months: ${N(fv(v.at(-1), h.m))} ${arrow(top ? 1 : -1, h.low)}`);
      }
    }
  }
  // 5. leaders and laggards against the average
  const h0 = heads[0];
  for (const d of dims.slice(0, 2)){
    const g = groupRows(rows, r => keyOf(r[d])); g.delete('(Blank)');
    if (g.size < 3 || g.size > 200) continue;
    const ranked = [...g].map(([k, rs]) => [k, measureVal(h0.m, rs)]).filter(x => x[1] != null).sort((a, b) => b[1] - a[1]);
    if (ranked.length < 3) continue;
    if (isPct(h0.m) && ranked.length <= 12 && ranked.some(x => x[1] <= 0 || x[1] >= 1)) continue;
    const avg = add(h0.m) ? ranked.reduce((a, x) => a + x[1], 0) / ranked.length : measureVal(h0.m, rows);
    const vs = val => isPct(h0.m) ? `${((val - avg) * 100 >= 0 ? '+' : '−')}${Math.abs((val - avg) * 100).toFixed(1)} pts vs average` : avg ? `${(val / avg).toFixed(1)}× the average` : '';
    const [best, worst] = h0.low ? [ranked.at(-1), ranked[0]] : [ranked[0], ranked.at(-1)];
    const dn = dimName(d);
    push(5, `Best ${dn}`, `${B(best[0])} ${N(fv(best[1], h0.m))} <span class="n">${esc(lc(h0.label))} · ${esc(vs(best[1]))}</span>`, [d, best[0]]);
    push(6, `Needs attention`, `${B(worst[0])} ${N(fv(worst[1], h0.m))} <span class="n">${esc(lc(h0.label))} · ${esc(vs(worst[1]))}</span>`, [d, worst[0]]);
  }
  // 6. concentration: how much the top few hold
  for (const {h} of S1) if (add(h.m)){
    const d = dims.find(x => { const n = new Set(rows.map(r => r[x])).size; return n >= 8 && n <= 500; }); if (!d) break;
    const g = groupRows(rows, r => keyOf(r[d])), vals = [...g].map(([k, rs]) => [k, measureVal(h.m, rs) || 0]).sort((a, b) => b[1] - a[1]);
    const total = vals.reduce((a, x) => a + x[1], 0), top = vals.slice(0, 3).reduce((a, x) => a + x[1], 0);
    const share = total ? top / total : 0;
    if (share > 3 / vals.length * 1.4){ push(7, 'Concentration', `3 ${esc(plural(dimName(d)))} hold ${N((share * 100).toFixed(0) + '%')} of ${esc(lc(h.label))} <span class="n">${esc(vals.slice(0, 3).map(x => x[0]).join(', '))}</span>`); break; }
  }
  // 7. where the headline figure is heading
  if (S1[0].s && S1[0].s.vals.length >= 4){
    const {h, s} = S1[0], res = fcFit({keys: s.ks, ys: s.vals}, 1, fmtKind(h.m));
    if (res){ const f = res.fc[0], cur = s.vals.at(-1), c = chg(cur, f.y, h.m);
      push(8, 'Next month', `${esc(h.label)} forecast ${N(fv(f.y, h.m))}${c && Math.abs(c.d) > 1e-4 ? ` ${arrow(c.d, h.low)} ${esc(c.txt)}` : ''} <span class="n">likely ${esc(fv(f.lo, h.m))}–${esc(fv(f.hi, h.m))}</span>`); }
  }
  try { const ci = changesTickerItem(); if (ci) out.push(ci); } catch (e){ console.error(e); }
  return out.sort((a, b) => a.rank - b.rank).slice(0, 10);
}

function newVisual(type, extra = {}){
  const size = {kpi:[3,2], slicer:[3,4], table:[6,5], matrix:[6,5], text:[4,2], line:[8,4], area:[8,4], calendar:[12,4], gauge:[3,3], multicard:[6,2], sankey:[6,5], sunburst:[4,5], radar:[4,5], boxplot:[6,4], histogram:[6,4], waterfall:[6,4]}[type] || [4,4];
  return {id: uid(), type, title:'', dims:[], legend:null, measures:[], w:size[0], h:size[1], ...extra};
}
const fcBlock = () => { if (page()?.kind !== 'forecast') return false; toast('The Forecast page has its own layout. Switch to another page to add visuals.'); return true; };
function addVisual(type, extra){
  if (fcBlock()) return;
  const v = newVisual(type, extra);
  page().visuals.push(v);
  S.selected = v.id;
  changed();
  openDrawer('buildPane');
  requestAnimationFrame(() => $(`.card[data-id="${v.id}"]`)?.scrollIntoView({block:'nearest', behavior:'smooth'}));
  return v;
}
function addFieldTo(v, fname, wellHint){
  if (!canEdit()) return;
  const fd = FMAP.get(fname); if (!fd) return;
  const t = TYPES[v.type];
  let well = wellHint;
  if (!well){
    if (fd.role === 'measure' && t.wells.measures) well = 'measures';
    else if (fd.role === 'dim' && t.wells.dims) well = (v.dims.length >= (t.drill ? 1 : t.wells.dims[1]) && t.wells.legend && !v.legend) ? 'legend' : 'dims';
    else well = t.wells.measures ? 'measures' : t.wells.dims ? 'dims' : null;
  }
  if (!well || !t.wells[well]){ toast(`${t.label} has no place for that field.`); return; }
  const max = t.wells[well][1];
  if (well === 'dims' && t.drill && fd.type === 'date' && fd.src === 'col' && !v.dims.length){
    v.dims = DATE_HIER.map(p => `${fname} (${p})`); v.level = 0; v.path = [];
    changed(); toast('Added a Year › Quarter › Month › Day hierarchy. Double-click a point, or use the drill buttons on the card.');
    return;
  }
  if (well === 'measures'){
    const m = {f: fname, agg: defaultAgg(fname)};
    if (v.measures.length >= max) v.measures[max - 1] = m; else v.measures.push(m);
  } else if (well === 'legend') v.legend = fname;
  else {
    if (v.dims.includes(fname)) return;
    if (v.dims.length >= max) v.dims[max - 1] = fname; else v.dims.push(fname);
  }
  changed();
}
function quickVisual(f){
  if (!canEdit()) return;
  const fd = FMAP.get(f);
  if (fd.role === 'measure') return addVisual('kpi', {measures:[{f, agg: defaultAgg(f)}]});
  if (fd.type === 'date') return addVisual('column', {dims: DATE_HIER.map(p => `${f} (${p})`), measures:[{f: RECORDS, agg:'count'}], drillMode: true});
  addVisual(fd.src === 'part' ? 'line' : 'column', {dims:[f], measures:[{f: RECORDS, agg:'count'}]});
}
function deletePage(i){

let dragCard = null;
function bindCard(el){
  const id = el.dataset.id;
  el.addEventListener('click', e => {
    const act = e.target.closest('[data-act]')?.dataset.act;
    if (act === 'del') return removeVisual(id);
    if (act === 'dup') return dupVisual(id);
    if (act === 'focus') return toggleFocus(el);
    const dv = findVisual(id);
    if (act === 'up') return drillUp(dv);
    if (act === 'next') return drillNext(dv);

    if (S.selected !== id){ S.selected = id; $$('.card').forEach(c => c.classList.toggle('sel', c.dataset.id === id)); renderBuild(); }
  });
  el.addEventListener('dblclick', e => { const v = findVisual(id); if (v?.type === 'text'){ S.selected = id; renderBuild(); openDrawer('buildPane'); $('#o-text')?.focus(); } });
  const t = $('.card-h .t', el);

  t.addEventListener('dragend', () => { dragCard = null; $$('.card').forEach(c => c.classList.remove('drag-over')); });
  el.addEventListener('dragover', e => {

    if (dragCard && dragCard !== id) el.classList.add('drag-over');
    else if (!dragCard) el.classList.add('field-over');
  });
  el.addEventListener('dragleave', () => el.classList.remove('drag-over', 'field-over'));
  el.addEventListener('drop', e => {
    e.preventDefault(); e.stopPropagation();
    el.classList.remove('drag-over', 'field-over');
    const d = e.dataTransfer.getData('text/plain');
    const p = page();
    if (d.startsWith('card:')){
      const from = p.visuals.findIndex(v => v.id === d.slice(5)), to = p.visuals.findIndex(v => v.id === id);
      if (from < 0 || from === to) return;
      const [mv] = p.visuals.splice(from, 1); p.visuals.splice(p.visuals.findIndex(v => v.id === id), 0, mv); changed();
    } else if (d.startsWith('field:')){

    const v = findVisual(id); const cv = $('#canvas');

    const sx = e.clientX, sy = e.clientY, sw = v.w, sh = v.h;
    rz.setPointerCapture(e.pointerId);
    const move = ev => {

}

function parseCSV(text){
  text = text.replace(/^﻿/, '');
  const first = text.split(/\r?\n/, 1)[0];
  const delim = [',', ';', '\t', '|'].map(d => [d, first.split(d).length]).sort((a, b) => b[1] - a[1])[0][0];
  const rows = []; let row = [], cell = '', q = false;
  for (let i = 0; i < text.length; i++){
    const ch = text[i];
    if (q){ if (ch === '"'){ if (text[i + 1] === '"'){ cell += '"'; i++; } else q = false; } else cell += ch; }
    else if (ch === '"') q = true;
    else if (ch === delim){ row.push(cell); cell = ''; }
    else if (ch === '\n' || ch === '\r'){ if (ch === '\r' && text[i + 1] === '\n') i++; row.push(cell); rows.push(row); row = []; cell = ''; }
    else cell += ch;
  }
  if (cell || row.length){ row.push(cell); rows.push(row); }
  const data = rows.filter(r => r.some(c => c.trim() !== ''));
  if (data.length < 2) throw new Error('The file needs a header row and at least one data row.');
  const header = data[0].map((h, i) => h.trim() || 'Column ' + (i + 1));
  const seen = {}; const names = header.map(h => { seen[h] = (seen[h] || 0) + 1; return seen[h] > 1 ? `${h} ${seen[h]}` : h; });
  return {names, records: data.slice(1).map(r => Object.fromEntries(names.map((n, i) => [n, (r[i] ?? '').trim()])))};
}

}

}

      if (editing >= 0){

        if (old !== name) for (const p of S.pages) for (const v of p.visuals){ v.dims = v.dims.map(f => f === old ? name : f); if (v.legend === old) v.legend = name; v.measures.forEach(m => { if (m.f === old) m.f = name; }); }

/* ---- import readers: each returns a list of {name, get()} tables (sheets) ---- */
function uniqueNames(arr){ const seen = {}; return arr.map((h, i) => { h = String(h ?? '').replace(/\s+/g, ' ').trim() || 'Column ' + (i + 1); seen[h] = (seen[h] || 0) + 1; return seen[h] > 1 ? `${h} ${seen[h]}` : h; }); }
function cellOut(c){
  if (c instanceof Date) return isNaN(c) ? '' : `${c.getFullYear()}-${String(c.getMonth() + 1).padStart(2, '0')}-${String(c.getDate()).padStart(2, '0')}`;
  return c == null ? '' : c;
}
function aoaToTable(aoa){
  const rows = aoa.map(r => (r || []).map(cellOut));
  const filled = r => r.filter(c => c !== '' && c != null).length;
  const widest = Math.max(0, ...rows.map(filled));
  if (widest < 1) throw new Error('No table found.');
  const hi = rows.findIndex(r => filled(r) >= Math.max(1, Math.ceil(widest * 0.6)));
  const width = Math.max(...rows.slice(hi).map(r => r.length));
  let names = uniqueNames(Array.from({length: width}, (_, i) => rows[hi][i]));
  let records = rows.slice(hi + 1).filter(r => filled(r) > 0).map(r => Object.fromEntries(names.map((n, i) => [n, r[i] ?? ''])));
  const keep = names.filter((n, i) => String(rows[hi][i] ?? '').trim() !== '' || records.some(r => r[n] !== '' && r[n] != null));
  if (keep.length < names.length){ names = keep; records = records.map(r => Object.fromEntries(keep.map(n => [n, r[n]]))); }
  if (!records.length) throw new Error('The table has a header row but no data rows.');
  return {names, records};
}
async function readAnyFile(f){
  const ext = (f.name.split('.').pop() || '').toLowerCase();
  if (['xlsx','xls','xlsm','xlsb','ods'].includes(ext)){
    await loadLib('xlsx');
    const wb = XLSX.read(await f.arrayBuffer(), {cellDates: true});
    const sheets = wb.SheetNames.map(n => ({name: n, get: () => aoaToTable(XLSX.utils.sheet_to_json(wb.Sheets[n], {header: 1, defval: '', raw: true, blankrows: false}))}));
    const ok = sheets.filter(sh => { try { sh.get(); return true; } catch { return false; } });
    if (!ok.length) throw new Error('none of the sheets contain a table.');
    return ok;
  }
  if (ext === 'pdf'){ const t = await pdfToTable(await f.arrayBuffer()); return [{name: 'Table from PDF', get: () => t}]; }
  if (ext === 'html' || ext === 'htm') return htmlTables(await f.text());
  const text = await f.text();
  return [{name: f.name, get: () => parseAny(text, f.name)}];
}
function htmlTables(text){
  const doc = new DOMParser().parseFromString(text, 'text/html');
  const tables = [...doc.querySelectorAll('table')].map((t, i) => ({rows: [...t.rows].map(tr => [...tr.cells].map(td => td.textContent.trim())), i}))
    .filter(t => t.rows.length > 1).sort((a, b) => b.rows.length - a.rows.length);
  if (!tables.length) throw new Error('no tables were found in that page.');
  return tables.map(t => ({name: `Table ${t.i + 1} (${t.rows.length - 1} rows)`, get: () => aoaToTable(t.rows)}));
}
/* PDF: rebuild rows from text positions. Works on text-based PDFs with a table; scanned images have no text to read. */
async function pdfToTable(buf){
  await loadLib('pdfjs');
  const lib = window.pdfjsLib || window['pdfjs-dist/build/pdf'];
  lib.GlobalWorkerOptions.workerSrc = LIBS.pdfjs[1];
  const doc = await lib.getDocument({data: new Uint8Array(buf), isEvalSupported: false}).promise;
  // Each text run is split into words with positions estimated from character offsets, because PDF writers
  // often merge several table cells into one run. Words are then placed under the nearest header column.
  const lines = [];
  for (let pg = 1; pg <= Math.min(doc.numPages, 300); pg++){
    const page = await doc.getPage(pg);
    const tc = await page.getTextContent();
    const items = tc.items.filter(it => it.str && it.str.trim()).map(it => ({x: it.transform[4], y: it.transform[5], w: it.width, h: Math.abs(it.transform[3]) || 8, s: it.str}));
    items.sort((a, b) => b.y - a.y || a.x - b.x);
    const pageLines = [];
    for (const it of items){
      const ln = pageLines.find(l => Math.abs(l.y - it.y) <= Math.max(2, it.h * 0.35));
      ln ? ln.items.push(it) : pageLines.push({y: it.y, items: [it]});
    }
    for (const ln of pageLines){
      ln.items.sort((a, b) => a.x - b.x);
      const words = [], cells = [];
      for (const it of ln.items){
        const len = it.s.length || 1;
        for (const mt of it.s.matchAll(/\S+/g)) words.push({s: mt[0], x0: it.x + it.w * mt.index / len, x1: it.x + it.w * (mt.index + mt[0].length) / len});
        const last = cells[cells.length - 1];
        if (last && it.x - last.x1 < Math.max(3, it.h * 0.6)){ last.s += ' ' + it.s; last.x1 = it.x + it.w; }
        else cells.push({x0: it.x, x1: it.x + it.w, s: it.s});
      }
      cells.forEach(c => c.s = c.s.replace(/\s+/g, ' ').trim());
      lines.push({page: pg, words, cells: cells.filter(c => c.s)});
    }
  }
  if (!lines.some(l => l.words.length)) throw new Error('no text found in this PDF. Scanned PDFs need to be converted with OCR first.');
  // header: the line with the most separate cells near the top, preferring text over numbers
  const isNum = t => /^[-+($]*[\d.,]+%?\)?$/.test(t);
  let hIdx = -1, bestScore = 1;
  lines.slice(0, 60).forEach((l, i) => { const n = l.cells.length; const textual = l.cells.filter(c => !isNum(c.s)).length;
    const score = n + textual * 0.01; if (n >= 2 && textual >= n * 0.6 && score > bestScore){ bestScore = score; hIdx = i; } });
  if (hIdx < 0) throw new Error('no table header was found in this PDF.');
  const header = lines[hIdx].cells, ncol = header.length;
  const centers = header.map(c => (c.x0 + c.x1) / 2), headTxt = header.map(c => c.s).join(' ');
  const aoa = [header.map(c => c.s)];
  for (const l of lines.slice(hIdx + 1)){
    if (l.words.map(w => w.s).join(' ') === headTxt) continue;  // header repeated on a later page
    const row = new Array(ncol).fill('');
    for (const w of l.words){
      const mid = (w.x0 + w.x1) / 2; let k = 0, bd = Infinity;
      centers.forEach((x, i) => { const d = Math.abs(x - mid); if (d < bd){ bd = d; k = i; } });
      row[k] = row[k] ? row[k] + ' ' + w.s : w.s;
    }
    if (row.filter(Boolean).length >= Math.max(2, Math.ceil(ncol * 0.4))) aoa.push(row);
  }
  return aoaToTable(aoa);
}

      <div class="form-row"><input type="text" id="pName" value="${esc(dflt)}" aria-label="Dataset name" style="flex:1 1 200px">

      <button class="btn primary" id="pGo" type="button">Load ${cur.records.length.toLocaleString()} rows</button><button class="btn ghost" id="pCancel" type="button">Cancel</button></div>`;
    $('#pSheet')?.addEventListener('change', e => { idx = +e.target.value; draw(); });

        offerMoreSheets(); return;
      }
      const n = loadDataset($('#pName').value || dflt, cur.names, cur.records);
      if (source) S.datasets[n].source = {...source, refreshed: new Date().toISOString()};
      const auto = $('#pAuto').checked, fresh = $('#pNew').checked;
      const prevName = curReport()?.name;
      closeModal();
      if (fresh){
        newReport(n, n, []);
        if (auto){ autoBuild(); S.pages = S.pages.filter(pg => pg.visuals.length); S.pageIdx = 0; renderAll(); }
        else { S.pages = [{id: uid(), name: 'Page 1', visuals: []}]; S.pageIdx = 0; renderAll(); }
        HIST.stack = []; HIST.i = -1; commit();
      } else {
        S.active = n; if (page()) page().ds = n; buildModel(); renderAll();

    };
  };
  draw();
}

async function gw(path, body){
  if (SRV.on) return body ? api('POST', 'gateway' + path, body) : api('GET', 'gateway' + path);
  if (!GW.url) throw new Error('Connect to your gateway first.');
  let r;
  try {
    r = await fetch(GW.url.replace(/\/+$/, '') + path, {method: body ? 'POST' : 'GET',
      headers: {Authorization: 'Bearer ' + GW.key, ...(body ? {'Content-Type': 'application/json'} : {})}, body: body ? JSON.stringify(body) : undefined});
  } catch { throw new Error(IN_CLAUDE ? 'Live connections only work in the self-hosted version of Miyar.' : `Could not reach the gateway at ${GW.url}. Check it is running and that this site is in its ALLOWED_ORIGINS.`); }
  const j = await r.json().catch(() => ({error: `The gateway replied ${r.status}.`}));
  if (!r.ok || j.error) throw new Error(j.error || `The gateway replied ${r.status}.`);
  return j;
}
async function connectGateway(){
  SRC.state = 'busy'; SRC.msg = 'Connecting…'; drawGwState();
  try {
    if (!SRV.on) await gw('/health');
    const j = await gw('/connections');
    SRC.conns = j.connections || []; SRC.tables = {};
    SRC.state = 'ok'; SRC.msg = `Connected · ${SRC.conns.length} connection${SRC.conns.length === 1 ? '' : 's'} available`;
  } catch (e){ SRC.state = 'bad'; SRC.msg = e.message; SRC.conns = []; }
  drawGwState(); drawSrc();
}

async function runSource(m){
  if (m.kind === 'web'){
    let r;
    try { r = await fetch(m.url); } catch { throw new Error(IN_CLAUDE ? 'Inside Claude, pages cannot load data from other sites. Use the self-hosted version.' : 'The site did not allow Miyar to read it (CORS), or it could not be reached.'); }
    if (!r.ok) throw new Error(`The site replied ${r.status} ${r.statusText}.`);
    return parseAny(await r.text(), new URL(m.url).pathname);
  }
  const j = await gw('/query', m.table ? {connection: m.connection, table: m.table, limit: m.limit} : {connection: m.connection, query: m.query, limit: m.limit});
  if (!j.rows.length) throw new Error('The query returned no rows.');
  const names = j.columns;
  return {names, records: j.rows.map(r => Object.fromEntries(names.map(n => [n, r[n] ?? '']))), truncated: j.truncated};
}
async function refreshDataset(name, btn){
  const d = S.datasets[name]; if (!d?.source) return;
  const label = btn?.textContent; if (btn){ btn.disabled = true; btn.textContent = 'Refreshing…'; }
  try {
    const {names, records} = await runSource(d.source);
    const prevType = new Map(d.columns.map(c => [c.name, c.type]));
    const cols = inferColumns(names, records).map(c => prevType.has(c.name) ? {...c, type: prevType.get(c.name)} : c);
    d.columns = cols; d.raw = records; d.rows = coerce(records, cols); d.source.refreshed = new Date().toISOString(); d.dirtyRows = true; d.justRefreshed = true;
    if (name === S.active){ buildModel(); renderAll(); } else save();
    toast(`Refreshed “${name}”: ${records.length.toLocaleString()} rows.`);
  } catch (e){ toast(`Could not refresh “${name}”: ${e.message}`); }
  if (btn){ btn.disabled = false; btn.textContent = label; }
}

async function exportPDF(idxs, light, progress){
  await Promise.all([loadLib('jspdf'), loadLib('h2c')]);
  const {jsPDF} = window.jspdf;
  const pdf = new jsPDF({orientation:'landscape', unit:'pt', format:'a4', compress: true});
  const W = pdf.internal.pageSize.getWidth(), H = pdf.internal.pageSize.getHeight(), M = 28;
  const keep = {page: S.pageIdx, sel: S.selected, scroll: $('#canvasWrap').scrollTop};
  EXPORTING = true; S.selected = null; document.body.classList.add('exporting');
  if (light) document.documentElement.setAttribute('data-theme', 'light');
  let sheet = 0;
  try {
    for (const [n, i] of idxs.entries()){
      progress(`Rendering page ${n + 1} of ${idxs.length}…`);
      await ensurePageData(i); colorCache.clear(); renderTabs(); renderCanvas();
      $('#canvasWrap').scrollTop = 0;
      await frame(); await frame(); await sleep(120);
      charts.forEach(c => c.resize());
      const el = $('#canvas');
      const shot = await html2canvas(el, {backgroundColor: css('--bg'), scale: 2, logging: false, useCORS: true,
        height: el.scrollHeight, windowHeight: Math.max(window.innerHeight, el.scrollHeight + 200)});
      // header + paginate tall pages
      const top = M + 34, availH = H - top - M - 10, contentW = W - 2 * M, scale = contentW / shot.width;
      const sliceH = Math.floor(availH / scale);
      for (let y = 0; y < shot.height; y += sliceH){
        if (sheet++) pdf.addPage();
        const h = Math.min(sliceH, shot.height - y);
        const part = document.createElement('canvas'); part.width = shot.width; part.height = h;
        part.getContext('2d').drawImage(shot, 0, y, shot.width, h, 0, 0, shot.width, h);
        pdf.setFont('helvetica', 'bold'); pdf.setFontSize(14); pdf.setTextColor(22, 27, 38);
        pdf.text(S.pages[i].name + (y ? ' (continued)' : ''), M, M + 8);
        pdf.setFont('helvetica', 'normal'); pdf.setFontSize(8.5); pdf.setTextColor(95, 101, 115);
        pdf.text(pdf.splitTextToSize(`${S.active}  ·  Selections: ${selText()}  ·  Exported ${new Date().toLocaleString()}`, contentW)[0], M, M + 22);
        pdf.addImage(part.toDataURL('image/jpeg', 0.92), 'JPEG', M, top, contentW, h * scale, undefined, 'FAST');
        pdf.setFontSize(8); pdf.text(`Miyar  ·  ${sheet}`, W - M, H - M / 2, {align: 'right'});
      }
    }
  } finally {
    EXPORTING = false; document.body.classList.remove('exporting');
    applyTheme();
    S.pageIdx = keep.page; S.selected = keep.sel; colorCache.clear(); renderAll();
    $('#canvasWrap').scrollTop = keep.scroll;
  }
  return {name: fileBase() + '.pdf', blob: pdf.output('blob')};
}

/* The numbers behind a visual, as a header row plus data rows. */
function visualTable(v){
  const t = v.type;
  if (t === 'text' || missingFields(v).length) return null;
  if (t === 'histogram'){ const h = histBins(v); if (!h || h.msg) return null;
    return {header: ['From', 'To', 'Rows'], rows: h.edges.map((e, i) => [e[0], e[1], h.counts[i]]), fmts: [fmtKind({f: h.f, agg:'sum'}), fmtKind({f: h.f, agg:'sum'}), 'number']}; }
  if (t === 'boxplot'){ const b = boxStats(v); if (!b || b.msg) return null; const k = fmtKind({f: b.f, agg:'sum'});
    return {header: [b.dim, 'Rows', 'Min', 'Q1', 'Median', 'Q3', 'Max'], rows: b.cats.map(c => { const x = b.st.get(c); return [c, x.n, x.min, x.q1, x.med, x.q3, x.max]; }), fmts: [null, 'number', k, k, k, k, k]}; }
  const ev = effective(v), rows = rowsFor(ev);
  const keys = t === 'table' || t === 'sunburst' ? ev.dims : [ev.dims?.[0], ev.legend].filter(Boolean);
  const ms = t === 'slicer' ? [{f: RECORDS, agg: 'count'}] : (ev.measures || []);
  if (!keys.length && !ms.length) return null;
  const g = keys.length ? groupRows(rows, r => keys.map(k => keyOf(r[k])).join('\u0001')) : new Map([['', rows]]);
  const out = [...g].map(([k, rs]) => [...(keys.length ? k.split('\u0001') : []), ...ms.map(m => measureVal(m, rs))]);
  out.sort((a, b) => { for (let i = 0; i < keys.length; i++){ const c = labelCmp(a[i], b[i]); if (c) return c; } return 0; });
  return {header: [...keys, ...ms.map(measureLabel)], rows: out, fmts: [...keys.map(() => null), ...ms.map(fmtKind)]};
}
async function exportXLSX(idxs, includeRows){
  await loadLib('xlsx');
  const wb = XLSX.utils.book_new(), used = new Set();
  const sheetName = n => { let b = String(n).replace(/[\[\]:*?\/\\]/g, ' ').replace(/\s+/g, ' ').trim().slice(0, 28) || 'Sheet', x = b, k = 2; while (used.has(x.toLowerCase())) x = `${b.slice(0, 26)} ${k++}`; used.add(x.toLowerCase()); return x; };
  const Z = {currency: '"$"#,##0.00', percent: '0.0%', decimal: '#,##0.00', number: '#,##0.##########'};
  const sheetFrom = (header, rows, fmts) => {
    const ws = XLSX.utils.aoa_to_sheet([header, ...rows]);
    rows.forEach((r, ri) => r.forEach((val, ci) => { const f = fmts[ci]; const cell = ws[XLSX.utils.encode_cell({r: ri + 1, c: ci})];
      if (cell && typeof val === 'number' && f){ cell.z = f === 'number' ? (Number.isInteger(val) ? '#,##0' : '#,##0.00') : Z[f]; } }));
    ws['!cols'] = header.map((h, ci) => ({wch: clamp(Math.max(String(h).length, ...rows.slice(0, 200).map(r => String(r[ci] ?? '').length)) + 2, 8, 48)}));
    ws['!autofilter'] = {ref: XLSX.utils.encode_range({s: {r: 0, c: 0}, e: {r: rows.length, c: header.length - 1}})};
    return ws;
  };
  const summary = [['Miyar export'], [], ['Dataset', S.active], ['Rows in view', globalRows().length], ['Selections', selText()], ['Exported', new Date().toLocaleString()], [], ['Page', 'Visual', 'Type', 'Sheet']];
  const sheets = [];
  const keepPage = S.pageIdx;
  for (const i of idxs){ await ensurePageData(i);
    if (S.pages[i].kind === 'forecast'){ S.pageIdx = i; syncPageData();
      for (const tb of forecastTables(S.pages[i])){ if (!tb.rows.length) continue; const nm = sheetName(tb.title); summary.push([S.pages[i].name, tb.title, 'Forecast', nm]); sheets.push([nm, sheetFrom(tb.header, tb.rows, tb.fmts)]); }
      continue; }
    for (const v of S.pages[i].visuals){
    const tb = visualTable(v); if (!tb || !tb.rows.length) continue;
    const title = v.title || autoTitle(effective(v));
    const nm = sheetName(title);
    summary.push([S.pages[i].name, title, TYPES[v.type].label, nm]);
    sheets.push([nm, sheetFrom(tb.header, tb.rows, tb.fmts)]);
  } }
  S.pageIdx = keepPage; syncPageData();
  const sws = XLSX.utils.aoa_to_sheet(summary); sws['!cols'] = [{wch: 22}, {wch: 44}, {wch: 20}, {wch: 30}];
  XLSX.utils.book_append_sheet(wb, sws, sheetName('Summary'));
  for (const [nm, ws] of sheets) XLSX.utils.book_append_sheet(wb, ws, nm);
  if (includeRows && ds()){
    const cols = FIELDS.filter(f => f.src === 'col' || (f.src === 'calc' && f.calcKind === 'row'));
    const rows = globalRows().slice(0, 1000000).map(r => cols.map(c => r[c.name] ?? ''));
    XLSX.utils.book_append_sheet(wb, sheetFrom(cols.map(c => c.name), rows, cols.map(c => c.type === 'number' ? fmtKind({f: c.name, agg: 'sum'}) : null)), sheetName('Data'));
  }
  const out = XLSX.write(wb, {bookType: 'xlsx', type: 'array', compression: true});
  return {name: fileBase() + '.xlsx', blob: new Blob([out], {type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'})};
}

/* ============================== auto-build ============================== */
/* Builds a starter dashboard from whatever columns the data has: headline figures, a trend, breakdowns and a detail table. */
function autoBuild(pageName){
  if (!ds()){ openData('import'); return; }
  const cols = ds().columns;
  const card = new Map(cols.map(c => [c.name, new Set(ROWS.map(r => r[c.name])).size]));
  const rank = n => /revenue|sales|turnover|amount|value|total|income/i.test(n) ? 0 : /profit|margin/i.test(n) ? 1 : /cost|expense|spend|cogs|price/i.test(n) ? 2 : /qty|quantity|units|volume/i.test(n) ? 3 : 4;
  const idLike = n => /(^|[\s_-])(id|code|no|number|zip|postal|phone|year|month|day)$/i.test(n);
  const nums = cols.filter(c => c.type === 'number' && card.get(c.name) > 1 && !idLike(c.name)).sort((a, b) => rank(a.name) - rank(b.name));
  // Revenue and cost columns get an automatic Profit and Margin %
  const rev = nums.find(c => rank(c.name) === 0), cost = nums.find(c => /cost|expense|cogs/i.test(c.name));
  if (rev && cost && !FMAP.has('Profit') && !FMAP.has('Margin %')){
    calcs().push({name: 'Profit', expr: `[${rev.name}] - [${cost.name}]`}, {name: 'Margin %', expr: `SUM([Profit]) / SUM([${rev.name}])`, fmt: 'percent'});
    buildModel();
  }
  const profit = FMAP.get('Profit')?.src === 'calc' && !calcs().find(c => c.name === 'Profit')?.error;
  const dims = cols.filter(c => c.type === 'string' && card.get(c.name) >= 2 && card.get(c.name) <= 40 && !idLike(c.name))
    .sort((a, b) => card.get(a.name) - card.get(b.name)).map(c => c.name);
  const date = cols.find(c => c.type === 'date');
  const main = nums[0] ? {f: nums[0].name, agg: 'sum'} : {f: RECORDS, agg: 'count'};
  const L = m => m.f === RECORDS ? 'Rows' : m.f;
  const kpis = [main];
  if (profit) kpis.push({f: 'Profit', agg: 'sum'}, {f: 'Margin %', agg: 'sum'});
  for (const c of nums.slice(1)) if (kpis.length < 3 && c.name !== cost?.name) kpis.push({f: c.name, agg: 'sum'});
  if (kpis.length < 4) kpis.push({f: RECORDS, agg: 'count'});
  const years = date ? new Set(ROWS.map(r => r[`${date.name} (Year)`]).filter(Boolean)).size : 0;
  const hier = date ? ['Year', 'Quarter', 'Month'].map(p => `${date.name} (${p})`) : null;
  const vis = [];
  const w = Math.floor(12 / kpis.length);
  kpis.forEach((m, i) => vis.push(newVisual('kpi', {title: i === 0 ? `Total ${L(m)}` : m.f === RECORDS ? 'Number of rows' : L(m), measures: [m], dims: date ? [`${date.name} (Month)`] : [], w, h: 2})));
  if (date) vis.push(newVisual('area', {title: `${L(main)} over time`, dims: hier, level: 2, path: [null, null], measures: [main], w: dims[0] ? 8 : 12, h: 4}));
  if (dims[0]) vis.push(date ? newVisual('slicer', {dims: [dims[0]], w: 4, h: 4}) : newVisual('column', {title: `${L(main)} by ${dims[0]}`, dims: [dims[0]], measures: [main], w: 8, h: 4}));
  if (!date && dims[0]) vis.push(newVisual('donut', {title: `Share of ${L(main)} by ${dims[0]}`, dims: [dims[0]], measures: [main], w: 4, h: 4}));
  if (dims[1]) vis.push(newVisual('bar', {title: `${L(main)} by ${dims[1]}`, dims: [dims[1]], measures: [main], w: 4, h: 5}));
  if (dims[2] || (date && dims[0])) vis.push(newVisual('donut', {title: `Share of ${L(main)} by ${dims[2] || dims[0]}`, dims: [dims[2] || dims[0]], measures: [main], w: 4, h: 5}));
  if (profit && dims[1]) vis.push(newVisual('bar', {title: `Margin by ${dims[1]}`, dims: [dims[1]], measures: [{f: 'Margin %', agg: 'sum'}], w: 4, h: 5}));
  else if (dims[0] && (dims[1] || date)) vis.push(newVisual('matrix', {title: `${L(main)} by ${dims[1] || dims[0]} and ${years > 1 ? 'year' : 'quarter'}`,
    dims: [dims[1] || dims[0]], legend: date ? `${date.name} (${years > 1 ? 'Year' : 'Quarter'})` : dims[0], measures: [main], heat: true, w: 4, h: 5}));
  const tdims = dims.slice(-2).reverse().length ? [dims[1] || dims[0], dims[2] || dims[0]].filter((x, i, a) => x && a.indexOf(x) === i) : [];
  const tms = [main, ...(profit ? [{f: 'Profit', agg: 'sum'}, {f: 'Margin %', agg: 'sum'}] : []), ...nums.slice(1).filter(c => c.name !== cost?.name || !profit).slice(0, 2).map(c => ({f: c.name, agg: 'sum'}))]
    .filter((m, i, a) => a.findIndex(x => x.f === m.f) === i).slice(0, 5);
  if (tdims.length || nums.length) vis.push(newVisual('table', {title: tdims.length ? `${tdims.join(' and ')} detail` : 'Totals', dims: tdims, measures: tms, bars: true, w: 12, h: 6}));
  S.pages.push({id: uid(), name: pageName || ('Overview · ' + S.active.slice(0, 24)), ds: S.active, visuals: vis});
  S.pageIdx = S.pages.length - 1; S.selected = null;
  renderAll();
}

/* ============================== forecast & what-if ==============================
   A report section (a page with kind 'forecast') that looks ahead from the report's data.
   Trend forecast: any measure by month, projected with damped trend smoothing, or trend × seasonality once there are
   two years of history, with an 80% likely range.
   What-if: for attendance data (one row per person per working day, with days present and leave), extra leave for chosen
   people and a change in unplanned absences, showing days and hours lost, team and department availability against a
   coverage line, and each person's annual leave allowance. For other data, a percentage change to the forecast. */
const FC_DEF = {measure: null, horizon: 6, people: null, extra: 2, absChg: 0, allowance: 21, threshold: 85, cost: '', pct: 10, from: 0};
function fcOf(pg){ pg.fc ||= {}; for (const [k, v] of Object.entries(FC_DEF)) if (!(k in pg.fc)) pg.fc[k] = v; return pg.fc; }
const monthAdd = (ym, k) => { const [y, m] = ym.split('-').map(Number); return new Date(Date.UTC(y, m - 1 + k, 1)).toISOString().slice(0, 7); };
const monthLabel = ym => MONTHS[+ym.slice(5, 7) - 1] + ' ' + ym.slice(0, 4);
const fcDate = () => FIELDS.find(f => f.type === 'date' && f.src === 'col')?.name || null;
const pct1 = x => x == null || isNaN(x) ? '–' : (x * 100).toFixed(1) + '%';
const num0 = x => Math.round(x).toLocaleString('en-US');
const num1 = x => (Math.round(x * 10) / 10).toLocaleString('en-US');

function fcMeasures(){
  return FIELDS.filter(f => f.role === 'measure').map(f => ({f: f.name, agg: f.src === 'records' ? 'count' : 'sum', label: f.src === 'records' ? 'Number of rows' : f.name}));
}
function fcDefaultMeasure(){
  for (const pg of S.pages) if (!pg.kind && (!pg.ds || pg.ds === S.active)) for (const v of pg.visuals) if (['kpi', 'multicard'].includes(v.type) && v.measures[0] && FMAP.has(v.measures[0].f)) return v.measures[0].f;
  return FIELDS.find(f => f.role === 'measure' && f.src === 'col')?.name || RECORDS;
}
/* the measure by calendar month; a last month with only part of its days is kept out of the fit */
function fcSeries(m, rows, date){
  const mk = `${date} (Month)`;
  const g = groupRows(rows.filter(r => r[mk]), r => r[mk]);
  if (!g.size) return null;
  const keys = [...g.keys()].sort(), all = [];
  for (let k = keys[0]; k <= keys.at(-1); k = monthAdd(k, 1)) all.push(k);
  const add = additive(m);
  let last = null;
  const ys = all.map(k => { const v = g.has(k) ? measureVal(m, g.get(k)) : (add ? 0 : null); if (v != null) last = v; return v ?? last; });
  const lastDay = rows.reduce((a, r) => r[date] && r[date] > a ? r[date] : a, '');
  let partial = null;
  if (add && all.length > 5 && +lastDay.slice(8, 10) < 25){ partial = {k: all.pop(), y: ys.pop()}; }
  return {keys: all, ys, partial, lastDay};
}
const linreg = y => { const n = y.length, mx = (n - 1) / 2, my = y.reduce((a, b) => a + b, 0) / n; let sxy = 0, sxx = 0; y.forEach((v, i) => { sxy += (i - mx) * (v - my); sxx += (i - mx) ** 2; }); const b = sxx ? sxy / sxx : 0; return {a: my - b * mx, b}; };
function fcFit(ser, h, kind){
  const {keys, ys} = ser, n = ys.length;
  if (n < 4) return null;
  const fkeys = Array.from({length: h}, (_, j) => monthAdd(keys.at(-1), j + 1));
  let fit, fc, sd, method;
  if (n >= 24){
    const pos = ys.every(v => v > 0), t1 = linreg(ys), idx = Array.from({length: 12}, () => []);
    ys.forEach((v, i) => { const tr = t1.a + t1.b * i; idx[+keys[i].slice(5) - 1].push(pos ? v / tr : v - tr); });
    let s = idx.map(a => a.length ? a.reduce((x, y) => x + y, 0) / a.length : (pos ? 1 : 0));
    const mean = s.reduce((a, b) => a + b, 0) / 12; s = s.map(x => pos ? x / mean : x - mean);
    const t2 = linreg(ys.map((v, i) => { const si = s[+keys[i].slice(5) - 1]; return pos ? v / si : v - si; }));
    const at = (i, k) => { const tr = t2.a + t2.b * i, si = s[+k.slice(5) - 1]; return pos ? tr * si : tr + si; };
    fit = keys.map((k, i) => at(i, k));
    sd = Math.sqrt(ys.reduce((a, v, i) => a + (v - fit[i]) ** 2, 0) / Math.max(1, n - 3));
    fc = fkeys.map((k, j) => ({y: at(n + j, k), w: sd * (1 + 0.06 * (j + 1))}));
    method = 'trend plus the usual pattern of each calendar month';
  } else {
    const phi = 0.9; let best = null;
    for (const al of [0.2, 0.35, 0.5, 0.7, 0.9]) for (const be of [0.05, 0.1, 0.2, 0.35]){
      let l = ys[0], b = (ys[Math.min(3, n - 1)] - ys[0]) / Math.min(3, n - 1), sse = 0; const f = [ys[0]];
      for (let i = 1; i < n; i++){ const p = l + phi * b; f.push(p); sse += (ys[i] - p) ** 2; const l2 = al * ys[i] + (1 - al) * p; b = be * (l2 - l) + (1 - be) * phi * b; l = l2; }
      if (!best || sse < best.sse) best = {sse, l, b, f, al};
    }
    fit = best.f; sd = Math.sqrt(best.sse / Math.max(1, n - 2));
    let damp = 0;
    fc = fkeys.map((_, j) => { damp += phi ** (j + 1); return {y: best.l + best.b * damp, w: sd * Math.sqrt(1 + j * best.al * best.al)}; });

  }

  const lim = v => cap1 ? clamp(v, 0, 1) : floor0 ? Math.max(0, v) : v;
  return {keys, ys, fit, fkeys, method, fc: fc.map(x => ({y: lim(x.y), lo: lim(x.y - 1.28 * x.w), hi: lim(x.y + 1.28 * x.w)}))};
}

/* ---------- attendance what-if ---------- */
function attFields(){
  const M = re => FIELDS.find(f => f.src === 'col' && f.role === 'measure' && re.test(f.name))?.name;
  const D = re => FIELDS.find(f => f.src === 'col' && f.role === 'dim' && f.type === 'string' && re.test(f.name))?.name;
  const date = fcDate(), person = D(/employee name|staff name|^employee$|^name$/i) || D(/employee|staff|person|worker/i);
  const present = M(/present|attended/i), leave = M(/leave/i);
  if (!date || !person || !present || !leave) return null;
  return {date, person, present, leave, absent: M(/absen/i), late: M(/late arrival|^late$/i), hours: M(/hours/i), dept: D(/department|dept|team|division/i), status: D(/status/i)};
}
function attPlan(fc, A, rows, H){
  const by = new Map(), dates = new Set(), wdays = new Set(), hist = new Map();
  const annual = A.status ? new Set([...new Set(rows.map(r => r[A.status]))].filter(v => /annual|vacation|paid leave/i.test(v || ''))) : new Set();
  for (const r of rows){
    const d = r[A.date]; if (!d) continue;
    if (!dates.has(d)){ dates.add(d); wdays.add(new Date(d + 'T00:00:00Z').getUTCDay()); }
    const p = keyOf(r[A.person]);
    let st = by.get(p); if (!st) by.set(p, st = {name: p, dept: A.dept ? keyOf(r[A.dept]) : '', n: 0, pres: 0, abs: 0, lv: 0, an: 0, hrs: 0, hrsN: 0, anYear: {}});
    const pr = +r[A.present] || 0, ab = A.absent ? +r[A.absent] || 0 : 0, lv = +r[A.leave] || 0, an = annual.size ? (annual.has(r[A.status]) ? 1 : 0) : lv;
    st.n++; st.pres += pr; st.abs += ab; st.lv += lv; st.an += an;
    if (A.hours && pr && r[A.hours] != null){ st.hrs += +r[A.hours]; st.hrsN++; }
    st.anYear[d.slice(0, 4)] = (st.anYear[d.slice(0, 4)] || 0) + an;
    const mk = d.slice(0, 7); let hm = hist.get(mk); if (!hm) hist.set(mk, hm = {n: 0, pres: 0, dept: new Map()});
    hm.n++; hm.pres += pr;
    if (A.dept){ const x = hm.dept.get(st.dept) || {n: 0, pres: 0}; x.n++; x.pres += pr; hm.dept.set(st.dept, x); }
  }
  if (!by.size || dates.size < 20 || rows.length > dates.size * by.size * 1.05) return null;   // needs one row per person per working day
  const lastM = [...dates].sort().at(-1).slice(0, 7);
  const wdOf = k => { const [y, m] = k.split('-').map(Number), dim = new Date(Date.UTC(y, m, 0)).getUTCDate(); let c = 0; for (let d = 1; d <= dim; d++) if (wdays.has(new Date(Date.UTC(y, m - 1, d)).getUTCDay())) c++; return c; };
  const months = Array.from({length: H}, (_, j) => { const k = monthAdd(lastM, j + 1); return {k, wd: wdOf(k), n: 0, b: 0, s: 0, bAbs: 0, sAbs: 0, dept: new Map()}; });
  const sel = new Set(fc.people || []), absF = 1 + (+fc.absChg || 0) / 100, extra = Math.max(0, +fc.extra || 0);
  const people = [...by.values()].sort((a, b) => a.name.localeCompare(b.name));
  for (const st of people){
    const pr = st.pres / st.n, ab = st.abs / st.n, lv = st.lv / st.n, an = st.an / st.n, den = pr + ab || 1;
    Object.assign(st, {hpd: st.hrsN ? st.hrs / st.hrsN : 8, affected: sel.has(st.name), bPres: 0, sPres: 0, plan: {}, extraTotal: 0});
    for (const M of months){
      const P = M.wd * pr, Ab = M.wd * ab, AN = M.wd * an;
      const x = st.affected ? Math.min(extra, P + Ab) : 0;
      let P2 = P - x * pr / den, A2 = Ab - x * ab / den;
      const dA = Math.min(P2, A2 * (absF - 1)); P2 -= dA; A2 += dA;
      M.n += M.wd; M.b += P; M.s += P2; M.bAbs += Ab; M.sAbs += A2;
      const dd = M.dept.get(st.dept) || {n: 0, b: 0, s: 0}; dd.n += M.wd; dd.b += P; dd.s += P2; M.dept.set(st.dept, dd);
      st.bPres += P; st.sPres += P2; st.extraTotal += x;
      const y = M.k.slice(0, 4); st.plan[y] ||= {b: 0, s: 0}; st.plan[y].b += AN; st.plan[y].s += AN + x;
    }
    st.years = Object.keys(st.plan).map(y => { const used = st.anYear[y] || 0; return {y, used, b: used + st.plan[y].b, s: used + st.plan[y].s}; });
    st.over = st.years.map(x => ({y: x.y, over: x.s - fc.allowance})).filter(x => x.over > 0.05);
  }
  const sum = (a, f) => a.reduce((t, x) => t + f(x), 0);
  const tot = {n: sum(months, m => m.n), b: sum(months, m => m.b), s: sum(months, m => m.s), bAbs: sum(months, m => m.bAbs), sAbs: sum(months, m => m.sAbs)};
  const histKeys = [...hist.keys()].sort();
  const depts = A.dept ? [...new Set(people.map(p => p.dept))].sort().map(d => {
    const ms = months.map(m => ({k: m.k, ...(m.dept.get(d) || {n: 0, b: 0, s: 0})}));
    const recent = histKeys.slice(-3).map(k => hist.get(k).dept.get(d) || {n: 0, pres: 0});
    const low = ms.reduce((a, m) => m.n && (!a || m.s / m.n < a.s / a.n) ? m : a, null);
    return {d, head: people.filter(p => p.dept === d).length, aff: people.filter(p => p.dept === d && p.affected).length,
      now: sum(recent, x => x.pres) / (sum(recent, x => x.n) || 1), b: sum(ms, m => m.b) / (sum(ms, m => m.n) || 1), s: sum(ms, m => m.s) / (sum(ms, m => m.n) || 1), low, ms};
  }) : [];
  return {people, months, tot, depts, hist: histKeys.map(k => ({k, v: hist.get(k).pres / hist.get(k).n})), lastM, wdays,
    daysLost: tot.b - tot.s, hoursLost: sum(people, p => (p.bPres - p.sPres) * p.hpd), affected: people.filter(p => p.affected)};
}

/* ---------- the page ---------- */
const fcRO = new ResizeObserver(es => { for (const e of es) charts.get(e.target.dataset.fc)?.resize(); });

  if (plan && fc.people == null) fc.people = [...(S.sel[A.person] || [])];
  const range = (() => { const ks = ROWS.map(r => r[date]).filter(Boolean).sort(); return ks.length ? `${monthLabel(ks[0].slice(0, 7))} to ${monthLabel(ks.at(-1).slice(0, 7))}` : ''; })();

  cv.innerHTML = `<div class="fc">

      <label class="fc-inline">Months ahead <select id="fcH">${[3, 6, 12].map(h => opt(h, fc.horizon, h + ' months')).join('')}</select></label></div>
    <section class="fc-card">

      <div class="fc-chart" data-fc="fc:trend"></div>
      <div id="fcTrendNote" class="fc-note"></div>
    </section>
    ${plan ? `<section class="fc-card">
      <div class="fc-row"><h3>What if people take more leave?</h3><span class="hint" style="font-size:12px">Based on each person's own record, ${esc(range)}</span></div>
      <div class="fc-what">
        <div class="fc-ctl">
          <div class="fc-lbl fc-lbl-row">Who takes more leave <span id="fcWho" class="tag"></span></div>

/* what a snapshot tracks for one dataset: the figures and breakdowns its pages use */
function snapPlan(dn){

  const heads = [], dims = [];

    if (missingFields(v).length) continue;

    if (v.type === 'multicard') v.measures.forEach(m => heads.push({f: m.f, agg: m.agg, label: measureLabel(m), low: false}));

  const byM = mf ? groupRows(rows.filter(r => r[mf]), r => r[mf]) : null;

    for (const n of names){ if (n !== S.active){ S.active = n; buildModel(); } sets[n] = snapSet(n, keep); }

function saveSnapshot(label, auto, at = Date.now(), keep = null){

      if (shown.length === 1 || Q.n === 1) text = L(`**${shown[0].k}** has the ${I.bottom ? 'lowest' : 'highest'} ${ML}${fText}: **${fmt(shown[0].v)}**${share(shown[0].v)}.`,
        `**${shown[0].k}** لديه ${I.bottom ? 'أقل' : 'أعلى'} ${ML}${fText}: **${fmt(shown[0].v)}**${share(shown[0].v)}.`);
      else if (list.length > shown.length) text += L(`\n\nOut of ${list.length} ${F(dim)} in total.`, `\n\nمن أصل ${list.length} ${F(dim)}.`);
    } else {

        (list.length > 2 ? L(`, and **${low.k}** is lowest at ${fmt(low.v)}${share(low.v)}.`, `، والأقل **${low.k}** بقيمة ${fmt(low.v)}${share(low.v)}.`) : '.') +

        shown.map(x => `| ${x.k} | ${fmt(x.v, true)} |${canShare ? ` ${(x.v / total * 100).toFixed(1)}% |` : ''}`).join('\n') +
        (list.length > shown.length ? L(`\n\nShowing the top ${shown.length} of ${list.length}.`, `\n\nعرض أعلى ${shown.length} من ${list.length}.`) : '');
    }
    const keys = shown.map(x => x.k);
    const type = I.share ? 'donut' : FMAP.get(dim)?.src === 'part' ? 'column' : 'bar';
    return {text: text + selNote, chartNow: I.chart,
      chart: {type, dims: [dim], measures: [m], vfilters: [...filters, ...(list.length > shown.length ? [[dim, keys]] : [])], sort: I.bottom ? 'asc' : 'desc',
        title: L(`${ML} by ${F(dim)}`, `${ML} حسب ${F(dim)}`)}};
  }
  // single figures: count, average, total
  const val = measureVal(m, rows);

  if (m.f === RECORDS) return {text: L(`There are **${val.toLocaleString()}** rows${fText}.`, `يوجد **${val.toLocaleString()}** صف${fText}.`) + selNote};
  const word = m.agg === 'avg' ? '' : isCalcMeasure(m.f) || fmtKind(m) === 'percent' ? '' : L('Total ', 'إجمالي ');
  return {text: L(`**${word}${ML}${fText}** is **${fmt(val)}**`, `**${word}${ML}${fText}** هو **${fmt(val)}**`) +
    L(` across ${rows.length.toLocaleString()} rows.`, ` عبر ${rows.length.toLocaleString()} صف.`) + selNote};
}

/* ---------- light Markdown for answers (input is escaped first) ---------- */
function mdLite(src){
  const L = esc(src).split('\n'), out = [];
  const inl = t => t.replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/(^|[^*])\*([^*\s][^*]*?)\*(?!\*)/g, '$1<i>$2</i>').replace(/`([^`]+)`/g, '<code>$1</code>');
  let i = 0;
  while (i < L.length){
    const l = L[i];
    if (/^\s*\|.*\|\s*$/.test(l)){
      const rows = []; while (i < L.length && /^\s*\|.*\|\s*$/.test(L[i])) rows.push(L[i++]);
      const cells = r => r.trim().replace(/^\||\|$/g, '').split('|').map(c => c.trim());
      const body = rows.filter(r => !/^\s*\|?[\s:|-]+\|?\s*$/.test(r));
      const [h, ...rest] = body.map(cells);
      const isNum = c => /^[-+]?[$€£]?[\d.,]+[%KMB]?$/.test(c.replace(/\s/g, ''));
      out.push(`<div class="tw"><table class="grid"><thead><tr>${(h || []).map(c => `<th dir="auto">${inl(c)}</th>`).join('')}</tr></thead><tbody>${rest.map(r => `<tr>${r.map(c => `<td dir="auto" class="${isNum(c) ? 'num' : ''}">${inl(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`);
      continue;
    }
    if (/^\s*([-*•])\s+/.test(l)){ const it = []; while (i < L.length && /^\s*([-*•])\s+/.test(L[i])) it.push(L[i++].replace(/^\s*[-*•]\s+/, '')); out.push(`<ul>${it.map(x => `<li dir="auto">${inl(x)}</li>`).join('')}</ul>`); continue; }
    if (/^\s*\d+[.)]\s+/.test(l)){ const it = []; while (i < L.length && /^\s*\d+[.)]\s+/.test(L[i])) it.push(L[i++].replace(/^\s*\d+[.)]\s+/, '')); out.push(`<ol>${it.map(x => `<li dir="auto">${inl(x)}</li>`).join('')}</ol>`); continue; }
    if (/^#{1,6}\s/.test(l)){ out.push(`<h4 dir="auto">${inl(l.replace(/^#+\s*/, ''))}</h4>`); i++; continue; }
    if (!l.trim()){ i++; continue; }
    const para = []; while (i < L.length && L[i].trim() && !/^\s*(\||[-*•]\s|\d+[.)]\s|#)/.test(L[i])) para.push(L[i++]);
    if (!para.length){ para.push(L[i++]); }
    out.push(`<p dir="auto">${para.map(inl).join('<br>')}</p>`);
  }
  return out.join('');
}

/* ============================== reports ==============================
   Each report has its own dataset, pages, filters and undo history. Importing a file opens a new report,
   so the report you were working in stays exactly as it was. */
let REPORTS = [];   // [{id, name, active, pages, pageIdx, sel (arrays), dt, hist}]
S.reportId = null;
const curReport = () => REPORTS.find(r => r.id === S.reportId);
/* ============================== playgrounds ==============================
   Two folders of saved work. "My playground" is private to each person; "Shared playground" is open to everyone
   who uses this Miyar, and only the person who saved an item (or the owner) can change or delete it.
   Where they live:
     - inside Claude: the artifact's own store (db capability). Private items under data/users/<id>/, which no one
       else can read; shared items under shared/<id>/items/, readable by all, writable only by their author.
     - with Miyar server: the server's playground API (PostgreSQL plus file storage).
     - opened as a plain file: My playground in this browser only; no shared folder, because nobody is signed in.
   An item is a snapshot of one report: its pages and the data behind them, split into chunks for the store. */
const PG = {ready: null, prov: 'none', uid: null, why: '', canWrite: true, folder: 'mine', items: {mine: null, shared: null}, busy: false};
const PG_CHUNK = 80000;   // characters per stored chunk (stays under the store's 256 KiB document limit even for Arabic text)
const PG_LOCAL = 'miyar-playground';
function pgInit(){
  return PG.ready ||= (async () => {
    if (SRV.on){ Object.assign(PG, {prov: 'server', uid: SRV.me.id}); return PG; }
    if (window.claude?.use){
      const [db, user] = await Promise.all([window.claude.use('db').catch(() => null), window.claude.use('user').catch(() => null)]);
      const id = user ? await user.id() : null;
      if (db && id){
        const w = await user.can('data.write');
        Object.assign(PG, {prov: 'claude', db, user, uid: id, canWrite: w !== false});
        if (w === false) PG.why = 'You can open saved work but not save it here. Ask the person who shared Miyar with you for Contributor access.';
        return PG;
      }
      PG.prov = 'none'; PG.why = db ? 'Sign in to claude.ai to use the playgrounds.' : 'The playgrounds are not available in this view.';
      return PG;
    }
    Object.assign(PG, {prov: 'local', uid: 'me'});
    return PG;
  })();
}
const pgShared = () => PG.prov === 'claude' || PG.prov === 'server';
async function retryDb(fn){
  for (let i = 0; ; i++){
    try { return await fn(); }
    catch (e){ if (i < 3 && (e?.code === 'unavailable' || e?.code === 'resource_exhausted')){ await sleep(400 * (i + 1) + Math.random() * 300); continue; } throw e; }
  }
}
function pgErr(e){
  if (e?.code === 'quota_exceeded') return 'The playground storage is full. Delete some saved items and try again.';
  if (e?.code === 'invalid_argument') return 'You do not have permission to save here.';
  return e?.message || 'Something went wrong.';
}
/* the current report and every dataset its pages use */
function packCurrent(){
  stashReport();
  const r = curReport();
  const used = [...new Set([r.active, ...(r.pages || []).map(pg => pg.ds)].filter(n => n && S.datasets[n]))];
  return {v: 1, name: r.name, report: {active: r.active, pages: repContent(r).pages},
    datasets: used.map(n => { const d = S.datasets[n]; return {name: n, sample: !!d.sample, columns: d.columns, rows: d.sample ? null : d.rows, source: d.source || null, calcs: calcsOut(n), fmt: S.fmt[n] || {}}; })};
}
const pgMeta = payload => ({name: payload.name, savedAt: new Date().toISOString(), pages: payload.report.pages.length,
  datasets: payload.datasets.map(d => d.name), rows: payload.datasets.reduce((a, d) => a + (d.rows ? d.rows.length : 4200), 0)});
function pgLocalRead(){ try { return JSON.parse(localStorage.getItem(PG_LOCAL) || '[]'); } catch { return []; } }
function pgLocalWrite(list){ try { localStorage.setItem(PG_LOCAL, JSON.stringify(list)); } catch { throw new Error('This browser has no room left for more saved work. Delete some items first.'); } }

async function pgList(folder){
  if (PG.prov === 'claude'){
    if (folder === 'mine'){
      const q = await retryDb(() => PG.db.collection('data/users/' + PG.uid).get());
      return q.docs.map(d => ({id: d.id, owner: PG.uid, ...d.data()}));
    }
    const users = (await retryDb(() => PG.db.collection('shared').get())).docs;
    const lists = await Promise.all(users.map(u => retryDb(() => PG.db.collection('shared/' + u.id + '/items').get()).then(q => q.docs.map(d => ({id: d.id, owner: u.id, ...d.data()})))));
    const all = lists.flat();
    const ps = all.length ? await PG.user.profiles([...new Set(all.map(x => x.owner))]) : {};
    all.forEach(x => { x.byName = x.owner === PG.uid ? 'you' : (ps[x.owner]?.name || 'a colleague'); });
    return all;
  }
  if (PG.prov === 'server'){
    const j = await api('GET', 'playground?folder=' + folder);
    return j.items.map(x => ({id: x.id, owner: x.owner_id, name: x.name, savedAt: x.updated_at, pages: x.pages, rows: x.rows, byName: x.mine ? 'you' : (x.owner_name || 'a colleague'), canEdit: x.can_edit}));
  }
  if (PG.prov === 'local') return folder === 'mine' ? pgLocalRead().map(({payload, ...m}) => ({...m, owner: 'me'})) : [];
  return [];
}
async function pgSave(folder, payload, existingId){
  const text = JSON.stringify(payload), meta = pgMeta(payload);
  if (PG.prov === 'claude'){
    const n = Math.ceil(text.length / PG_CHUNK);
    if (n > 150) throw new Error('This report is too large for the playground (over about 12 MB of data). Save fewer pages or smaller data.');
    const id = existingId || (uid() + uid());
    const ref = (folder === 'mine' ? PG.db.collection('data/users/' + PG.uid) : PG.db.collection('shared/' + PG.uid + '/items')).doc(id);
    let old = 0;
    if (existingId){ const snap = await retryDb(() => ref.get()); old = snap.exists ? (snap.data().chunks || 0) : 0; }
    for (let i = 0; i < n; i++) await retryDb(() => ref.collection('chunks').doc('c' + i).set({i, s: text.slice(i * PG_CHUNK, (i + 1) * PG_CHUNK)}));
    if (folder === 'shared') await retryDb(() => PG.db.doc('shared/' + PG.uid).set({updatedAt: meta.savedAt}));
    await retryDb(() => ref.set({...meta, by: PG.uid, chunks: n, size: text.length}));
    for (let i = n; i < old; i++) await ref.collection('chunks').doc('c' + i).delete().catch(() => {});
    return id;
  }
  if (PG.prov === 'server'){
    const id = existingId || crypto.randomUUID();
    await apiBig('PUT', 'playground/' + id, {folder, name: payload.name, pages: meta.pages, rows: meta.rows, payload});
    return id;
  }
  if (PG.prov === 'local'){
    const list = pgLocalRead().filter(x => x.id !== existingId);
    const id = existingId || uid();
    list.push({id, ...meta, payload}); pgLocalWrite(list);
    return id;
  }
  throw new Error(PG.why || 'The playgrounds are not available here.');
}
async function pgLoad(folder, item){
  if (PG.prov === 'claude'){
    const ref = (folder === 'mine' ? PG.db.collection('data/users/' + PG.uid) : PG.db.collection('shared/' + item.owner + '/items')).doc(item.id);
    const parts = await Promise.all(Array.from({length: item.chunks || 0}, (_, i) => retryDb(() => ref.collection('chunks').doc('c' + i).get())));
    if (!parts.length || parts.some(x => !x.exists)) throw new Error('Part of this saved report is missing. It may still be saving; try again in a moment.');
    return JSON.parse(parts.map(x => x.data().s).join(''));
  }
  if (PG.prov === 'server'){
    const r = await fetch('api/playground/' + encodeURIComponent(item.id), {credentials: 'same-origin'});
    if (!r.ok) throw new Error('Could not open this saved report.');
    return r.json();
  }
  if (PG.prov === 'local') return pgLocalRead().find(x => x.id === item.id)?.payload;
  throw new Error(PG.why);
}
async function pgDelete(folder, item){
  if (PG.prov === 'claude'){
    const ref = (folder === 'mine' ? PG.db.collection('data/users/' + PG.uid) : PG.db.collection('shared/' + PG.uid + '/items')).doc(item.id);
    await retryDb(() => ref.delete());
    for (let i = 0; i < (item.chunks || 0); i++) await ref.collection('chunks').doc('c' + i).delete().catch(() => {});
    return;
  }
  if (PG.prov === 'server') return api('DELETE', 'playground/' + encodeURIComponent(item.id));
  if (PG.prov === 'local') return pgLocalWrite(pgLocalRead().filter(x => x.id !== item.id));
}
/* open a saved item as a report of its own */
function openPayload(payload, link){
  const rename = {};
  for (const d of payload.datasets){
    if (d.sample){
      S.calcs[d.name] ||= d.calcs || []; S.fmt[d.name] ||= d.fmt || {};
      ensureSample(d.name);
      continue;
    }
    let name = d.name;
    const ex = S.datasets[name];
    if (ex && !(ex.rows && ex.rows.length === d.rows.length && JSON.stringify(ex.columns) === JSON.stringify(d.columns))){
      let k = 2; while (S.datasets[`${d.name} (${k})`]) k++; name = `${d.name} (${k})`;
    }
    if (!ex || name !== d.name){ S.datasets[name] = {name, columns: d.columns, rows: d.rows, raw: d.rows, source: d.source || undefined}; S.calcs[name] = d.calcs || []; S.fmt[name] = d.fmt || {}; }
    rename[d.name] = name;
  }
  const R = n => rename[n] || n;
  const pages = payload.report.pages.map(pg => ({...pg, ds: pg.ds ? R(pg.ds) : pg.ds}));
  const cur = curReport();
  const blank = cur && !ds() && !S.pages.some(pg => pg.visuals.length);
  const r = newReport(payload.name, R(payload.report.active), pages);
  r.link = link;
  if (blank){ REPORTS = REPORTS.filter(x => x !== cur); renderReportBtn(); }
  save();
  return r;
}

function ago(iso){
  const sec = Math.max(1, (Date.now() - new Date(iso)) / 1000);
  if (sec < 60) return 'just now';
  const u = [[86400 * 30, 'month'], [86400 * 7, 'week'], [86400, 'day'], [3600, 'hour'], [60, 'minute']].find(([n]) => sec >= n);
  const n = Math.floor(sec / u[0]); return `${n} ${u[1]}${n === 1 ? '' : 's'} ago`;
}

let saveTimer, lastSaveOk = true;
/* History: every change is recorded as a snapshot of the report (pages, visuals, calculated fields, formats, filters). */
const HIST = {stack: [], i: -1};
function snapshot(){
  return JSON.stringify({active: S.active, pages: reportJSON().pages,
    calcs: Object.fromEntries(Object.entries(S.calcs).map(([k, a]) => [k, a.map(({name, expr, fmt}) => ({name, expr, fmt}))])),
    fmt: S.fmt, sel: Object.fromEntries(Object.entries(S.sel).filter(([, x]) => x.size).map(([k, x]) => [k, [...x]])), dt: S.dt || null});
}
function commit(){
  const snap = snapshot();
  if (HIST.stack[HIST.i] === snap) return;
  HIST.stack = HIST.stack.slice(0, HIST.i + 1); HIST.stack.push(snap);
  if (HIST.stack.length > 200) HIST.stack.splice(1, 1);   // keep the session's starting point for Reset
  HIST.i = HIST.stack.length - 1; histButtons();
}
function restore(snap){
  const o = JSON.parse(snap), before = S.pages.map(pg => JSON.stringify(pg));
  if (S.datasets[o.active]) S.active = o.active;
  S.pages = o.pages; S.calcs = o.calcs; S.fmt = o.fmt; S.dt = o.dt;
  S.sel = Object.fromEntries(Object.entries(o.sel).map(([k, a]) => [k, new Set(a)]));
  // show the page that changed
  const cur = page()?.id, changedIdx = S.pages.findIndex((pg, i) => JSON.stringify(pg) !== before[i]);
  const keep = S.pages.findIndex(pg => pg.id === cur);
  S.pageIdx = changedIdx >= 0 ? changedIdx : keep >= 0 ? keep : clamp(S.pageIdx, 0, S.pages.length - 1);
  if (S.selected && !S.pages.some(pg => pg.visuals.some(v => v.id === S.selected))) S.selected = null;
  closeModal(); buildModel(); renderAll(); histButtons();
}
function undo(){ commit(); if (HIST.i > 0){ HIST.i--; restore(HIST.stack[HIST.i]); } }
function redo(){ commit(); if (HIST.i < HIST.stack.length - 1){ HIST.i++; restore(HIST.stack[HIST.i]); } }
function histButtons(){
  const u = $('#btnUndo'), r = $('#btnRedo'), x = $('#btnReset'); if (!u) return;
  u.disabled = HIST.i <= 0; r.disabled = HIST.i >= HIST.stack.length - 1;
  const mu = $('#mUndo'); if (mu) mu.disabled = u.disabled;
  x.disabled = !HIST.stack.length || HIST.stack[HIST.i] === HIST.stack[0];
}

/* ============================== Miyar server ==============================
   When the app is served by Miyar server (server/ in the repository), people sign in with their company
   account and reports and datasets are shared through the server. Anywhere else (a plain file, GitHub Pages,
   inside Claude) the app keeps everything in the browser as before. */
const SRV = {on: false, cfg: null, me: null, saved: {}, dsMeta: {}, dsIds: new Set(), repIds: new Set(), timer: null, busy: false, again: false, conflict: null};
const canEdit = () => !SRV.on || SRV.me?.role === 'admin' || SRV.me?.role === 'editor';
async function api(method, p, body, opt = {}){
  let r;
  try {
    r = await fetch('api/' + p, {method, credentials: 'same-origin',
      headers: {'X-Miyar': '1', ...(body !== undefined ? {'Content-Type': 'application/json'} : {}), ...(opt.headers || {})},
      body: opt.raw !== undefined ? opt.raw : body !== undefined ? JSON.stringify(body) : undefined});
  } catch { const e = new Error('The Miyar server could not be reached. Check your connection.'); e.status = 0; throw e; }
  let j = null; try { j = await r.json(); } catch {}
  if (!r.ok){ const e = new Error(j?.error || `The server replied ${r.status}.`); e.status = r.status; e.data = j; throw e; }
  return j;
}
async function apiBig(method, p, obj){   // large uploads are gzip-compressed in the browser when it can
  const text = JSON.stringify(obj);
  if (!window.CompressionStream || text.length < 256e3) return api(method, p, undefined, {raw: text, headers: {'Content-Type': 'application/json'}});
  const blob = await new Response(new Blob([text]).stream().pipeThrough(new CompressionStream('gzip'))).blob();
  return api(method, p, undefined, {raw: blob, headers: {'Content-Type': 'application/json', 'Content-Encoding': 'gzip'}});
}
async function fetchRows(name){
  const d = S.datasets[name]; if (!d || d.rows) return;
  d._loading ||= (async () => {
    const r = await fetch('api/datasets/' + encodeURIComponent(d.serverId) + '/rows', {credentials: 'same-origin'});
    if (r.status === 401){ showSignIn('expired'); throw new Error('Your session has ended. Sign in again.'); }
    if (!r.ok) throw new Error(`Could not load “${name}” from the server.`);
    d.rows = await r.json(); d.raw = d.rows;
  })().finally(() => { d._loading = null; });
  return d._loading;
}
const calcsOut = name => (S.calcs[name] || []).map(({name, expr, fmt}) => ({name, expr, fmt}));
const dsKey = d => JSON.stringify({c: calcsOut(d.name), f: S.fmt[d.name] || {}, k: d.columns});
const repContent = r => ({active: r.active, pages: (r.pages || []).map(pg => ({...pg, visuals: pg.visuals.map(({_q, ...v}) => v)}))});
const repKey = r => JSON.stringify({n: r.name, c: repContent(r)});

function setSync(state, msg){

  el.hidden = !SRV.on;
  el.className = 'sync';
  if (!canEdit()){ el.classList.add('ro'); el.textContent = 'View only'; el.title = 'You can explore and filter reports but not change them. Ask an administrator for editor access.'; return; }
  const T = {pending: ['Unsaved changes', ''], saving: ['Saving…', ''], saved: ['All changes saved', ''], error: ['Not saved · retry', 'err'], conflict: ['Changed by someone else', 'conflict']}[state] || ['', ''];
  el.textContent = T[0]; if (T[1]) el.classList.add(T[1]);
  el.title = msg || (state === 'saved' ? 'Saved to the Miyar server' : '');

function srvSave(){

async function srvFlush(){
