        const m = await apiBig('POST', 'datasets', {name: d.name, columns: d.columns, rows: d.rows, source: d.source || null, calcs: calcsOut(d.name), fmt: S.fmt[d.name] || {}});
        Object.assign(d, {serverId: m.id, version: m.version, dirtyRows: false});
        SRV.dsIds.add(m.id); SRV.dsMeta[d.name] = dsKey(d);
        continue;
      }
      if (d.dirtyRows){
        d.dirtyRows = false;
        try { const m = await apiBig('PUT', `datasets/${d.serverId}/rows`, {columns: d.columns, rows: d.rows, source: d.source || null, refreshed: !!d.justRefreshed}); d.version = m.version; d.justRefreshed = false; }
        catch (e){ d.dirtyRows = true; throw e; }
      }
      const k = dsKey(d);
      if (SRV.dsMeta[d.name] !== k){ await api('PATCH', `datasets/${d.serverId}`, {calcs: calcsOut(d.name), fmt: S.fmt[d.name] || {}, columns: d.columns}); SRV.dsMeta[d.name] = k; }
    }
    const liveDs = new Set(Object.values(S.datasets).map(d => d.serverId).filter(Boolean));
    for (const id of [...SRV.dsIds]) if (!liveDs.has(id)){ await api('DELETE', `datasets/${id}`).catch(e => { if (e.status !== 404) throw e; }); SRV.dsIds.delete(id); }
    for (const r of REPORTS){
      if (SRV.conflict?.r === r) continue;
      if (!r.active && !(r.pages || []).some(pg => pg.visuals.length)) continue;
      const key = repKey(r);
      if (SRV.saved[r.id] === key) continue;
      try {
        const out = await api('PUT', `reports/${encodeURIComponent(r.id)}`, {name: r.name, content: repContent(r), version: r.version || 0});
        r.version = out.version; SRV.saved[r.id] = key; SRV.repIds.add(r.id);
      } catch (e){
        if (e.status === 409 && e.data?.report){ SRV.conflict = {r, latest: e.data.report, msg: e.message}; continue; }
        throw e;
      }
    }
    const live = new Set(REPORTS.map(r => r.id));
    for (const id of [...SRV.repIds]) if (!live.has(id)){ await api('DELETE', `reports/${encodeURIComponent(id)}`).catch(e => { if (e.status !== 404) throw e; }); SRV.repIds.delete(id); delete SRV.saved[id]; }
    setSync(SRV.conflict ? 'conflict' : 'saved', SRV.conflict?.msg);
    if (SRV.conflict) showConflict();
  } catch (e){
    setSync('error', e.message);
    if (e.status === 401) showSignIn('expired');
    else if (!SRV.errShown){ SRV.errShown = true; toast(`Changes not saved: ${e.message}`, 'Retry', () => { SRV.errShown = false; srvSave(); }); }
  } finally {
    SRV.busy = false;
    if (SRV.again){ SRV.again = false; srvSave(); }
  }
}
function showConflict(){
  const c = SRV.conflict; if (!c) return;
  const dlg = modal(`<div class="dlg-h"><h3>This report changed</h3></div>
    <div class="dlg-b"><p>${esc(c.msg)} Your recent changes to “${esc(c.r.name)}” have not been saved.</p>
    <div class="form-row"><button class="btn primary" id="cfTheirs" type="button">Load the newer version</button><button class="btn" id="cfMine" type="button">Keep my version and overwrite</button></div></div>`, 'small');
  $('#cfTheirs').onclick = () => {
    Object.assign(c.r, c.latest.content, {name: c.latest.name, version: c.latest.version, hist: null});
    SRV.saved[c.r.id] = repKey(c.r); SRV.conflict = null; closeModal();
    if (c.r.id === S.reportId) loadReport(c.r); else renderReportBtn();
    setSync('saved'); toast('Loaded the newer version.');
  };
  $('#cfMine').onclick = () => { c.r.version = c.latest.version; SRV.conflict = null; closeModal(); srvSave(); };
}
$('#syncState').onclick = () => { if (SRV.conflict) showConflict(); else if ($('#syncState').classList.contains('err')){ SRV.errShown = false; srvSave(); } };

function showSignIn(reason){
  if ($('#signin')) return;
  const next = location.pathname + location.search;
  document.body.insertAdjacentHTML('beforeend', `<div class="signin" id="signin" role="dialog" aria-label="Sign in"><div class="signin-card">
    <svg width="40" height="40" viewBox="0 0 24 24" aria-hidden="true"><rect x="2" y="12" width="5" height="10" rx="1.5" fill="var(--s1)"/><rect x="9.5" y="6" width="5" height="16" rx="1.5" fill="var(--accent)"/><rect x="17" y="2" width="5" height="20" rx="1.5" fill="var(--s3)"/></svg>
    <h1>Miyar</h1>
    <p class="tagline" lang="ar" dir="rtl">معيار</p>
    <p><b>${esc(SRV.cfg?.org || '')}</b></p>
    ${reason === 'expired' ? '<p class="err">Your session has ended. Sign in again to keep working; changes from the last few seconds may not have been saved.</p>' : ''}
    <a class="btn primary" href="auth/login?next=${encodeURIComponent(next)}">Sign in with ${esc(SRV.cfg?.provider || 'your company account')}</a>
    ${SRV.cfg?.authMode === 'dev' ? '<p class="hint" style="font-size:12px;margin-top:14px">Trial mode: this server signs everyone in as an administrator.</p>' : ''}
  </div></div>`);
}
function renderUser(){
  const b = $('#btnUser'); if (!SRV.on){ b.hidden = true; return; }
  const n = SRV.me.name || SRV.me.email || '?';
  const ini = n.split(/[\s@.]+/).filter(Boolean).slice(0, 2).map(x => x[0].toUpperCase()).join('');
  b.hidden = false; b.title = `${n} · ${SRV.me.role}`;
  b.innerHTML = `<span class="avatar">${esc(ini)}</span><span class="lbl-txt">${esc(n.split(' ')[0])}</span>`;
}
$('#btnUser').onclick = e => {
  e.stopPropagation();
  if ($('.ctx')) return closeMenu();
  const r = $('#btnUser').getBoundingClientRect(), m = document.createElement('div');
  m.className = 'ctx'; m.setAttribute('role', 'menu');
  m.innerHTML = `<div style="padding:8px 10px"><b>${esc(SRV.me.name || '')}</b><br><span class="hint" style="font-size:12px">${esc(SRV.me.email || '')}</span><br><span class="role">${esc(SRV.me.role)}</span> <span class="hint" style="font-size:12px">${esc(SRV.cfg.org)}</span></div><hr>
    ${SRV.me.role === 'admin' ? '<button type="button" role="menuitem" data-u="users">Users and roles</button><button type="button" role="menuitem" data-u="audit">Activity log</button><hr>' : ''}
    <button type="button" role="menuitem" data-u="out">Sign out</button>`;
  document.body.append(m);
  m.style.left = clamp(r.right - m.offsetWidth, 8, innerWidth - m.offsetWidth - 8) + 'px'; m.style.top = (r.bottom + 6) + 'px';
  m.addEventListener('click', ev => { const k = ev.target.closest('[data-u]')?.dataset.u; if (!k) return; closeMenu(); if (k === 'users') openUsers(); if (k === 'audit') openAudit(); if (k === 'out') signOut(); });
};
document.addEventListener('pointerdown', e => { if (e.target.closest('#btnUser')) e.stopPropagation(); }, true);
async function signOut(){
  try { await srvFlush(); } catch {}
  try {
    const r = await fetch('auth/logout', {method: 'POST', credentials: 'same-origin', headers: {'X-Miyar': '1'}});
    const j = await r.json(); location.href = j.redirect || './';
  } catch { location.reload(); }
}
async function openUsers(){
  const dlg = modal(`<div class="dlg-h"><h3>Users and roles</h3><button class="btn ghost" data-x type="button">Close</button></div><div class="dlg-b" id="usrB"><p class="busy">Loading…</p></div>`);
  dlg.querySelector('[data-x]').onclick = closeModal;
  try {
    const j = await api('GET', 'users');
    const roles = ['viewer', 'editor', 'admin'];
    $('#usrB').innerHTML = `<p><b>Viewers</b> can open, filter and export reports. <b>Editors</b> can also build reports and import or connect data. <b>Admins</b> can also manage users and see the activity log. People appear here after they first sign in.</p>
      ${j.managedByGroups ? '<p class="hint">Roles come from groups in your identity provider (ADMIN_GROUPS / EDITOR_GROUPS), so they are updated at each sign-in.</p>' : ''}
      <div style="overflow:auto"><table class="grid"><thead><tr><th>Name</th><th>Email</th><th>Role</th><th>Last sign-in</th></tr></thead><tbody>${j.users.map(u => `<tr>
        <td>${esc(u.name || '')}${u.id === SRV.me.id ? ' <span class="role">you</span>' : ''}</td><td>${esc(u.email || '')}</td>
        <td><select data-uid="${esc(u.id)}" aria-label="Role for ${esc(u.name || u.email || '')}">${roles.map(r => `<option ${u.role === r ? 'selected' : ''}>${r}</option>`).join('')}</select></td>
        <td>${u.last_login_at ? esc(new Date(u.last_login_at).toLocaleString()) : '–'}</td></tr>`).join('')}</tbody></table></div><p id="usrMsg"></p>`;
    $$('#usrB select').forEach(sel => sel.onchange = async () => {
      const msg = $('#usrMsg');
      try { await api('PATCH', `users/${sel.dataset.uid}`, {role: sel.value}); msg.className = 'ok'; msg.textContent = 'Role updated. It applies the next time they sign in.'; }
      catch (e){ msg.className = 'err'; msg.textContent = e.message; openUsers(); }
    });
  } catch (e){ $('#usrB').innerHTML = `<p class="err">${esc(e.message)}</p>`; }
}
const AUDIT_LABEL = {'user.sign_in': 'Signed in', 'user.sign_out': 'Signed out', 'user.role': 'Changed role', 'report.create': 'Created report', 'report.update': 'Edited report',
  'report.delete': 'Deleted report', 'dataset.create': 'Added dataset', 'dataset.refresh': 'Refreshed dataset', 'dataset.replace': 'Replaced dataset rows',
  'dataset.update': 'Edited dataset settings', 'dataset.delete': 'Deleted dataset', 'source.query': 'Queried data source',
  'playground.save': 'Saved to a playground', 'playground.update': 'Updated a playground item', 'playground.delete': 'Deleted a playground item'};
async function openAudit(){
  const dlg = modal(`<div class="dlg-h"><h3>Activity log</h3><button class="btn ghost" data-x type="button">Close</button></div><div class="dlg-b" id="audB"><p class="busy">Loading…</p></div>`);
  dlg.querySelector('[data-x]').onclick = closeModal;
  try {
    const j = await api('GET', 'audit?limit=300');
    const det = a => { const d = a.detail || {}; if (a.action === 'user.role') return `${d.from} → ${d.to}`; if (d.rows != null) return `${Number(d.rows).toLocaleString()} rows`; return ''; };
    $('#audB').innerHTML = `<p>The latest ${j.entries.length} actions. Repeated edits to the same report within 10 minutes are grouped.</p>
      <div style="overflow:auto"><table class="grid"><thead><tr><th>When</th><th>Who</th><th>What</th><th>Item</th><th>Details</th></tr></thead><tbody>${j.entries.map(a => `<tr>
      <td>${esc(new Date(a.at).toLocaleString())}</td><td>${esc(a.user_name || '–')}</td><td>${esc(AUDIT_LABEL[a.action] || a.action)}${a.count > 1 ? ` <span class="hint">×${a.count}</span>` : ''}</td>
      <td>${esc(a.target_name || '')}</td><td title="${esc(a.detail?.query || '')}">${esc(det(a))}</td></tr>`).join('')}</tbody></table></div>`;
  } catch (e){ $('#audB').innerHTML = `<p class="err">${esc(e.message)}</p>`; }
}

async function detectServer(){
  if (window.claude || location.protocol === 'file:') return null;
  try {
    const r = await fetch('api/config', {credentials: 'same-origin', headers: {'X-Miyar': '1'}});
    if (!r.ok) return null;
    const j = await r.json();
    return j?.app === 'miyar-server' ? j : null;
  } catch { return null; }
}
async function initServer(){
  const [dl, rl] = await Promise.all([api('GET', 'datasets'), api('GET', 'reports?full=1')]);
  for (const m of dl.datasets){
    S.datasets[m.name] = {name: m.name, columns: m.columns, rows: null, raw: null, source: m.source || undefined, serverId: m.id, version: m.version, rowCount: m.row_count};
    S.calcs[m.name] = m.calcs || []; S.fmt[m.name] = m.fmt || {};
    SRV.dsIds.add(m.id); SRV.dsMeta[m.name] = dsKey(S.datasets[m.name]);
  }
  REPORTS = rl.reports.map(r => ({id: r.id, name: r.name, active: r.content.active, pages: r.content.pages, version: r.version}));
  for (const n of Object.keys(SAMPLES)) if (REPORTS.some(r => r.active === n || (r.pages || []).some(pg => pg.ds === n))) ensureSample(n, false);
  for (const r of REPORTS){ SRV.saved[r.id] = repKey(r); SRV.repIds.add(r.id); }
  document.body.classList.toggle('readonly', !canEdit());
  renderUser(); setSync('saved');
  if (!REPORTS.length){ blankStart(); return; }
  else {
    let last = null; try { last = localStorage.getItem('miyar-last-report'); } catch {}
    loadReport(REPORTS.find(r => r.id === last) || REPORTS[0]);
  }
  commit(); histButtons();
}
async function boot(){
  const cfg = await detectServer();
  if (!cfg){ init(); commit(); histButtons(); return; }
  SRV.cfg = cfg;
  try {
    const me = await api('GET', 'me');
    SRV.me = me.user; SRV.on = true;
    await initServer();
  } catch (e){
    if (e.status === 401) return showSignIn();
    document.body.insertAdjacentHTML('beforeend', `<div class="signin"><div class="signin-card"><h1>Miyar</h1><p class="err">${esc(e.message)}</p><a class="btn" href="./">Try again</a></div></div>`);
  }
}
window.addEventListener('beforeunload', e => { if (SRV.on && canEdit() && ($('#syncState')?.textContent || '').match(/Unsaved|Saving|Not saved/)){ e.preventDefault(); e.returnValue = ''; } });

$('#brand').title = `${BUILD_LABEL} · معيار`;
applyTheme();
boot();
</script>
