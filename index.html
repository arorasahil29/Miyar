<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Basira: a self-service business intelligence app that runs entirely in the browser.">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,-apple-system,"Segoe UI",sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Basira</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Space+Grotesk:wght@500;600&display=swap">
<style>
/* Layout: three-pane workbench (fields | report canvas on a 12-column grid | build pane), panes become drawers on narrow screens */
:root{
  --bg:#eef1f5; --panel:#ffffff; --surface:#ffffff; --raise:#f6f8fb;
  --ink:#161b26; --ink2:#586072; --ink3:#868d9c;
  --line:#e2e6ec; --line2:#ccd2dc;
  --accent:#3346d3; --accent-ink:#ffffff; --accent-soft:#e7eafc;
  --grid:#e7e9ee; --axis:#c2c7d0; --other:#a3a9b4;
  --good:#006c10; --bad:#c22f30;
  --s1:#257de0; --s2:#f47230; --s3:#00b894; --s4:#f2a600; --s5:#ee7fac; --s6:#008a17; --s7:#6a4ce2; --s8:#ec4647;
  --seq0:#cce3fd; --seq1:#84b9f3; --seq2:#338ced; --seq3:#1b64be; --seq4:#0e3d7e;
  --shadow:0 1px 2px rgba(20,28,45,.06),0 2px 8px rgba(20,28,45,.05);
  --st-good:#0aac23; --st-bad:#dc3c3d;
  --f-ui:"IBM Plex Sans","IBM Plex Sans Arabic",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-head:"Space Grotesk","IBM Plex Sans",system-ui,sans-serif;
  --f-data:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0c0f14; --panel:#141821; --surface:#151922; --raise:#1b202b;
  --ink:#e8ebf1; --ink2:#a0a7b5; --ink3:#727a8a;
  --line:#252b37; --line2:#343b49;
  --accent:#8292ff; --accent-ink:#0c0f14; --accent-soft:#1e2552;
  --grid:#272d39; --axis:#465061; --other:#5d6475;
  --good:#53c556; --bad:#eb6263;
  --s1:#338ced; --s2:#e76624; --s3:#00a888; --s4:#d28e05; --s5:#e24d8b; --s6:#0aac23; --s7:#9887ef; --s8:#eb6263;
  --seq0:#1a2840; --seq1:#1757ac; --seq2:#257de0; --seq3:#6aabf1; --seq4:#cce3fd;
  --shadow:0 1px 2px rgba(0,0,0,.4); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0c0f14; --panel:#141821; --surface:#151922; --raise:#1b202b;
  --ink:#e8ebf1; --ink2:#a0a7b5; --ink3:#727a8a;
  --line:#252b37; --line2:#343b49;
  --accent:#8292ff; --accent-ink:#0c0f14; --accent-soft:#1e2552;
  --grid:#272d39; --axis:#465061; --other:#5d6475;
  --good:#53c556; --bad:#eb6263;
  --s1:#338ced; --s2:#e76624; --s3:#00a888; --s4:#d28e05; --s5:#e24d8b; --s6:#0aac23; --s7:#9887ef; --s8:#eb6263;
  --seq0:#1a2840; --seq1:#1757ac; --seq2:#257de0; --seq3:#6aabf1; --seq4:#cce3fd;
  --shadow:0 1px 2px rgba(0,0,0,.4); color-scheme:dark}

[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:13px;overflow:hidden}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
#app{height:100%;display:grid;grid-template-rows:auto auto 1fr;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px;gap:8px}

/* top bar */
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;min-width:0}
.brand{display:flex;align-items:center;gap:8px;font-family:var(--f-head);font-weight:600;font-size:16px;letter-spacing:-.01em;white-space:nowrap}
.brand svg{flex:none}
.brand small{font-family:var(--f-ui);font-weight:500;font-size:11px;color:var(--ink3);letter-spacing:.04em;text-transform:uppercase}
.tabs{display:flex;gap:2px;align-items:center;flex:1 1 300px;min-width:0;overflow-x:auto;scrollbar-width:thin}
.tab{border:1px solid transparent;background:none;padding:6px 12px;border-radius:6px;color:var(--ink2);white-space:nowrap;font-weight:500}
.tab:hover{background:var(--raise)}
.tab.on{background:var(--panel);border-color:var(--line);color:var(--ink);box-shadow:var(--shadow)}
.tab[contenteditable="true"]{outline:2px solid var(--accent);cursor:text}
.tab-add{color:var(--ink3);padding:6px 9px}
.actions{display:flex;gap:6px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line2);background:var(--panel);padding:6px 11px;border-radius:6px;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--ink3)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{border-color:transparent;background:none}
.btn.ghost:hover{background:var(--raise)}
.btn.sm{padding:4px 8px;font-size:12px}
.btn.danger{color:var(--bad)}
.btn svg{width:14px;height:14px;flex:none}
.only-narrow{display:none!important}

/* selection bar */
.selbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;min-height:30px;padding:4px 8px;border-radius:8px;background:var(--panel);border:1px solid var(--line)}
.selbar .lbl{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink3);font-weight:600}
.selbar .none{color:var(--ink3)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 4px 3px 9px;border-radius:999px;background:var(--accent-soft);color:var(--ink);font-size:12px;max-width:100%}
.chip b{font-weight:600}
.chip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip button{border:0;background:none;width:18px;height:18px;border-radius:50%;display:grid;place-items:center;color:var(--ink2);padding:0}
.chip button:hover{background:var(--panel)}
.selbar .rowcount{margin-left:auto;color:var(--ink2);font-family:var(--f-data);font-size:12px}

/* workbench */
.work{display:grid;grid-template-columns:220px minmax(0,1fr) 280px;gap:8px;min-height:0}
.pane{background:var(--panel);border:1px solid var(--line);border-radius:10px;display:flex;flex-direction:column;min-height:0;overflow:hidden}
.pane-h{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line);font-family:var(--f-head);font-weight:600;font-size:13px}
.pane-b{overflow:auto;padding:10px 12px;flex:1;min-height:0}
.ds-pick{width:100%;margin-bottom:8px;padding:5px 8px;border:1px solid var(--line2);border-radius:6px;background:var(--raise)}
.search{width:100%;padding:5px 8px;border:1px solid var(--line2);border-radius:6px;background:var(--panel);margin-bottom:8px}
.fgroup{margin-bottom:12px}
.fgroup h4{margin:0 0 4px;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink3);font-weight:600}
.field{display:flex;align-items:center;gap:7px;padding:4px 6px;border-radius:5px;cursor:grab;user-select:none;min-width:0}
.field:hover{background:var(--raise)}
.field .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.field.child{padding-left:22px;color:var(--ink2)}
.ficon{width:16px;height:16px;flex:none;border-radius:3px;display:grid;place-items:center;font-family:var(--f-data);font-size:10px;font-weight:500}
.ficon{background:var(--raise);border:1px solid var(--line)}
.ficon.m{color:var(--s1)} .ficon.d{color:var(--ink2)} .ficon.t{color:var(--s3)} .ficon.c{color:var(--s7)}

/* canvas */
.canvas-wrap{overflow:auto;min-height:0;border-radius:10px}
.canvas{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));grid-auto-rows:72px;gap:8px;padding-bottom:40px;min-height:100%;align-content:start}
.canvas.drop-on{outline:2px dashed var(--accent);outline-offset:-2px;border-radius:10px}
.card{position:relative;z-index:0;background:var(--surface);border:1px solid var(--line);border-radius:10px;display:flex;flex-direction:column;min-width:0;min-height:0;box-shadow:var(--shadow)}
.card.sel{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.card.drag-over{box-shadow:-3px 0 0 0 var(--accent)}
.card.field-over{outline:2px dashed var(--accent);outline-offset:-4px}
.card-h{display:flex;align-items:center;gap:6px;padding:8px 8px 0 12px;min-height:30px}
.card-h .t{flex:1;font-weight:600;font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:grab}
.card-h .ib{opacity:0;border:0;background:none;width:24px;height:24px;border-radius:5px;display:grid;place-items:center;color:var(--ink2)}
.card:hover .ib,.card.sel .ib,.card-h .ib:focus-visible{opacity:1}
.card-h .ib:hover{background:var(--raise)}
.card-b{flex:1;min-height:0;position:relative;padding:4px 8px 8px}
.chart{position:absolute;inset:4px 8px 8px}
.resize{position:absolute;right:2px;bottom:2px;width:14px;height:14px;cursor:nwse-resize;opacity:0;touch-action:none}
.card:hover .resize,.card.sel .resize{opacity:.7}
.resize::before{content:"";position:absolute;right:3px;bottom:3px;width:7px;height:7px;border-right:2px solid var(--ink3);border-bottom:2px solid var(--ink3);border-bottom-right-radius:2px}
.card.focus{position:fixed;inset:max(24px,env(safe-area-inset-top,0px)) max(24px,env(safe-area-inset-right,0px)) max(24px,env(safe-area-inset-bottom,0px)) max(24px,env(safe-area-inset-left,0px));z-index:40}
.scrim{position:fixed;inset:0;background:rgba(8,12,20,.45);z-index:35}
.empty-v{height:100%;display:grid;place-items:center;text-align:center;color:var(--ink3);font-size:12px;padding:8px}
.empty-canvas{grid-column:1/-1;grid-row:span 4;display:grid;place-items:center;text-align:center;color:var(--ink2);border:1.5px dashed var(--line2);border-radius:10px;padding:20px}

/* KPI */
.kpi{height:100%;display:flex;flex-direction:column;justify-content:center;gap:2px;padding:0 6px;min-width:0}
.kpi .v{font-family:var(--f-head);font-weight:600;font-size:clamp(20px,2.4vw,32px);letter-spacing:-.02em;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .d{font-size:12px;color:var(--ink2);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.kpi .up{color:var(--good);font-weight:600}.kpi .down{color:var(--bad);font-weight:600}
.kpi .spark{height:34px;margin-top:4px;position:relative}

/* tables */
.tbl-wrap{position:absolute;inset:4px 8px 8px;overflow:auto}
table.grid{border-collapse:collapse;width:100%;font-size:12px}
table.grid th,table.grid td{padding:5px 8px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
table.grid th{position:sticky;top:0;background:var(--surface);font-weight:600;color:var(--ink2);cursor:pointer;z-index:1}
table.grid th.num,table.grid td.num{text-align:right;font-family:var(--f-data);font-variant-numeric:tabular-nums}
table.grid tbody tr{cursor:pointer}
table.grid tbody tr:hover td{background:var(--raise)}
table.grid tr.dim td{opacity:.35}
table.grid tr.on td{background:var(--accent-soft)}
table.grid tfoot td{font-weight:600;border-top:1.5px solid var(--line2);position:sticky;bottom:0;background:var(--surface)}
table.grid .bar{display:inline-block;height:6px;border-radius:0 3px 3px 0;background:var(--s1);opacity:.55;vertical-align:middle;margin-right:6px}
/* slicer */
.slicer{position:absolute;inset:4px 8px 8px;display:flex;flex-direction:column;gap:6px}
.slicer input[type=search]{padding:4px 8px;border:1px solid var(--line2);border-radius:6px;background:var(--panel)}
.slicer ul{list-style:none;margin:0;padding:0;overflow:auto;flex:1}
.slicer li{display:flex;align-items:center;gap:8px;padding:4px 4px;border-radius:5px;cursor:pointer}
.slicer li:hover{background:var(--raise)}
.slicer li .box{width:14px;height:14px;border:1.5px solid var(--line2);border-radius:3px;flex:none;display:grid;place-items:center}
.slicer li.on .box{background:var(--accent);border-color:var(--accent)}
.slicer li.on .box::after{content:"";width:6px;height:3px;border-left:2px solid var(--accent-ink);border-bottom:2px solid var(--accent-ink);transform:rotate(-45deg) translate(1px,-1px)}
.slicer li .n{margin-left:auto;color:var(--ink3);font-family:var(--f-data);font-size:11px}
.slicer li.excluded{color:var(--ink3)}

/* build pane */
.types{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;margin-bottom:14px}
.type{aspect-ratio:1;border:1px solid var(--line);background:var(--panel);border-radius:6px;display:grid;place-items:center;color:var(--ink2);padding:0;max-width:100%}
.type:hover{border-color:var(--ink3);color:var(--ink)}
.type.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.type svg{width:20px;height:20px}
.sect{margin-bottom:14px}
.sect h5{margin:0 0 6px;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink3);font-weight:600;display:flex;justify-content:space-between}
.sect h5 em{font-style:normal;text-transform:none;letter-spacing:0;font-weight:400}
.well{border:1px solid var(--line);border-radius:7px;padding:5px;min-height:34px;display:flex;flex-direction:column;gap:4px;background:var(--raise)}
.well.over{border-color:var(--accent);background:var(--accent-soft)}
.well .ph{color:var(--ink3);font-size:12px;padding:3px 4px}
.wchip{display:flex;align-items:center;gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:5px;padding:3px 4px 3px 7px;min-width:0}
.wchip .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wchip select{border:0;background:var(--raise);border-radius:4px;padding:1px 2px;font-size:11.5px;color:var(--ink2);max-width:92px}
.wchip button{border:0;background:none;color:var(--ink3);padding:0 3px;font-size:15px;line-height:1}
.wchip button:hover{color:var(--ink)}
.opt{display:grid;grid-template-columns:90px 1fr;gap:6px 8px;align-items:center}
.opt label{color:var(--ink2)}
.opt input[type=text],.opt input[type=number],.opt select{width:100%;padding:4px 7px;border:1px solid var(--line2);border-radius:5px;background:var(--panel);min-width:0}
.opt input[type=checkbox]{justify-self:start}
.hint{color:var(--ink2);line-height:1.5}
.hint kbd{font-family:var(--f-data);font-size:11px;background:var(--raise);border:1px solid var(--line);border-radius:3px;padding:0 4px}

/* modal */
.modal{position:fixed;inset:0;z-index:60;display:grid;place-items:center;background:rgba(8,12,20,.5);padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.dialog{background:var(--panel);border:1px solid var(--line);border-radius:12px;width:min(1040px,100%);height:min(720px,100%);display:flex;flex-direction:column;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.dialog.small{height:auto;max-height:100%;width:min(560px,100%)}
.dlg-h{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.dlg-h h3{margin:0;font-family:var(--f-head);font-size:16px;font-weight:600;flex:1}
.dtabs{display:flex;gap:2px;flex-wrap:wrap}
.dlg-b{flex:1;overflow:auto;padding:16px;min-height:0}
.dlg-b p{margin:0 0 10px;line-height:1.55;color:var(--ink2);max-width:65ch}
.form-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.form-row input[type=text],.form-row select{padding:6px 9px;border:1px solid var(--line2);border-radius:6px;background:var(--panel);min-width:0}
textarea.code{width:100%;min-height:160px;font-family:var(--f-data);font-size:12px;padding:10px;border:1px solid var(--line2);border-radius:8px;background:var(--raise);resize:vertical}
.err{color:var(--bad);font-size:12px;margin-top:6px}
.ok{color:var(--good);font-size:12px;margin-top:6px}
.dropzone{display:block;cursor:pointer;border:1.5px dashed var(--line2);border-radius:10px;padding:22px;text-align:center;color:var(--ink2);margin-bottom:14px}
.dropzone.over{border-color:var(--accent);background:var(--accent-soft)}
.calc-list{display:flex;flex-direction:column;gap:6px;margin-top:16px}
.calc-item{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;border:1px solid var(--line);border-radius:8px;padding:8px 10px;align-items:center}
.calc-item code{font-family:var(--f-data);font-size:12px;color:var(--ink2);overflow-wrap:anywhere}
.tag{font-size:10.5px;letter-spacing:.04em;text-transform:uppercase;border-radius:4px;padding:1px 5px;background:var(--raise);color:var(--ink2);font-weight:600}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:8px;z-index:80;display:flex;gap:12px;align-items:center;max-width:calc(100% - 32px)}
.toast button{background:none;border:0;color:var(--bg);font-weight:600;text-decoration:underline;padding:0}

.tab-x{border:0;background:none;color:var(--ink3);width:22px;height:22px;border-radius:5px;display:grid;place-items:center;margin-left:-4px;font-size:15px;line-height:1;padding:0}
.tab-x:hover{background:var(--raise);color:var(--bad)}
.btn:disabled{opacity:.4;cursor:default}
.btn.confirm{border-color:var(--bad);color:var(--bad)}
.hist{display:flex;gap:4px}
.rep-btn{max-width:240px;background:var(--raise)}
.rep-btn #repName{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.ctx .rep{display:flex;justify-content:space-between;gap:10px}
.ctx .rep small{color:var(--ink3);font-size:11px;flex:none}
.ctx .rep.on{font-weight:600}
.ctx .rep span{flex:1;text-align:left}
.ctx .rep.on::before{content:"✓";margin-right:2px;color:var(--accent)}
.ctx .danger{color:var(--bad)}
.hist .btn{padding:6px 8px}
.chip.dt{background:var(--raise);border:1px solid var(--line2)}
.ctx{position:fixed;z-index:70;background:var(--panel);border:1px solid var(--line2);border-radius:9px;box-shadow:0 10px 30px rgba(0,0,0,.2);padding:4px;min-width:210px;max-width:300px}
.ctx button{display:block;width:100%;text-align:left;border:0;background:none;padding:7px 10px;border-radius:5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ctx button:hover,.ctx button:focus-visible{background:var(--raise)}
.ctx hr{border:0;border-top:1px solid var(--line);margin:4px 0}
.ctx .h{padding:5px 10px 3px;font-size:11px;color:var(--ink3);text-transform:uppercase;letter-spacing:.06em;font-weight:600}
.crumbs .go{color:var(--accent)}
/* data sources */
.gw{border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:16px;background:var(--raise)}
.gw h4,.src h4{margin:0 0 8px;font-family:var(--f-head);font-size:14px}
.gw .form-row input{flex:1 1 200px}
.state{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--ink2)}
.state::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--ink3)}
.state.ok::before{background:var(--st-good)} .state.bad::before{background:var(--st-bad)}
.conn-g{margin:0 0 6px;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink3);font-weight:600}
.conn-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px;margin-bottom:16px}
.conn{display:flex;gap:10px;align-items:center;text-align:start;border:1px solid var(--line2);background:var(--panel);border-radius:9px;padding:10px;min-width:0}
.conn:hover{border-color:var(--accent);background:var(--accent-soft)}
.conn b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.conn small{display:block;color:var(--ink3);font-size:11.5px}
.conn small.on{color:var(--good)}
.mono{width:34px;height:34px;border-radius:8px;display:grid;place-items:center;font-family:var(--f-head);font-weight:600;font-size:12.5px;background:var(--raise);border:1px solid var(--line);flex:none}

/* Files: the viewer's sandbox only lets a page hand over files through the downloads capability. */
async function saveFile(filename, blob){
  let dl = null;
  try { dl = window.claude?.use ? await window.claude.use('downloads') : null; } catch { dl = null; }
  if (dl){
    try { await dl.save({filename, data: blob}); toast(`Saved ${filename}.`); }
    catch (e){
      const c = e?.code;
      toast(c === 'declined' ? 'Download cancelled.' : c === 'rate_limited' ? 'Another download is waiting for confirmation. Try again in a moment.'
        : c === 'host_unavailable' ? 'This app cannot save files. Open the report in a browser to export.' : `Could not save the file (${c || e?.message || 'unknown error'}).`);
    }
    return;
  }
  if (window.claude){ toast('Saving files is not available in this view.'); return; }
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = filename; document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 5000);
}

/* ============================== sample data ============================== */
function makeSample(){
  const rng = mulberry32(20240101);
  const pick = arr => { const t = rng() * arr.reduce((s, x) => s + x[1], 0); let acc = 0; for (const x of arr){ acc += x[1]; if (t <= acc) return x[0]; } return arr[0][0]; };
  const regions = [['West',1.3],['East',1.2],['Central',0.95],['South',0.85],['North',0.6]];
  const segments = [['Consumer',0.5],['Corporate',0.3],['Small Business',0.2]];
  const channels = [['Online',0.55],['Retail',0.3],['Partner',0.15]];
  const cats = {
    'Technology': {w:0.3, cost:0.74, subs:[['Phones',420],['Laptops',1150],['Accessories',65],['Monitors',290]]},
    'Furniture': {w:0.25, cost:0.68, subs:[['Chairs',185],['Desks',430],['Bookcases',260],['Tables',340]]},
    'Office Supplies': {w:0.45, cost:0.52, subs:[['Paper',18],['Binders',12],['Storage',46],['Art',9],['Appliances',125]]},
  };
  const catList = Object.entries(cats).map(([k, v]) => [k, v.w]);
  const season = [0.8,0.74,0.9,0.92,0.95,0.94,0.9,0.96,1.05,1.1,1.32,1.45];
  const start = Date.UTC(2024, 0, 1), days = 731;
  const rows = [];
  let id = 10001;
  while (rows.length < 4200){
    const d = Math.floor(rng() * days);
    const date = new Date(start + d * 864e5);
    const growth = 0.72 + 0.28 * (d / days);
    if (rng() > season[date.getUTCMonth()] / 1.45 * growth) continue;
    const cat = pick(catList), c = cats[cat];
    const sub = c.subs[Math.floor(rng() * c.subs.length)];
    const units = 1 + Math.floor(Math.pow(rng(), 1.8) * 9);
    const price = +(sub[1] * (0.85 + rng() * 0.3)).toFixed(2);
    const disc = pick([[0,0.48],[0.05,0.2],[0.1,0.17],[0.2,0.1],[0.3,0.05]]);
    const region = pick(regions);
    const gross = units * price;
    rows.push({
      'Order ID': 'SO-' + (id++),
      'Order Date': date.toISOString().slice(0, 10),
      'Region': region, 'Segment': pick(segments), 'Channel': pick(channels),
      'Category': cat, 'Sub-Category': sub[0],
      'Units': units, 'Unit Price': price, 'Discount': disc,
      'Revenue': +(gross * (1 - disc)).toFixed(2),
      'Cost': +(gross * c.cost * (0.95 + rng() * 0.1)).toFixed(2),
    });
  }
  rows.sort((a, b) => a['Order Date'] < b['Order Date'] ? -1 : 1);
  return {
    name: 'Sample: Retail Orders', sample: true, rows,
    columns: [
      {name:'Order ID', type:'string'}, {name:'Order Date', type:'date'}, {name:'Region', type:'string'},
      {name:'Segment', type:'string'}, {name:'Channel', type:'string'}, {name:'Category', type:'string'},
      {name:'Sub-Category', type:'string'}, {name:'Units', type:'number'}, {name:'Unit Price', type:'number'},
      {name:'Discount', type:'number'}, {name:'Revenue', type:'number'}, {name:'Cost', type:'number'},
    ]
  };
}

const ds = () => S.datasets[S.active];
const calcs = () => (S.calcs[S.active] ||= []);

const HELPERS = {
  IF: (c, a, b) => c ? a : b,
  ROUND: (x, n = 0) => { const p = 10 ** n; return Math.round(x * p) / p; },
  ABS: Math.abs, FLOOR: Math.floor, CEIL: Math.ceil, SQRT: Math.sqrt, LOG: Math.log10,
  UPPER: s => String(s).toUpperCase(), LOWER: s => String(s).toLowerCase(),
  LEFT: (s, n) => String(s).slice(0, n), CONCAT: (...a) => a.join(''),
  YEAR: s => new Date(s).getUTCFullYear(), MONTH: s => new Date(s).getUTCMonth() + 1,
  COALESCE: (...a) => a.find(x => x != null && x !== ''),
  DIVIDE: (a, b, alt = null) => b ? a / b : alt,
};
const HK = Object.keys(HELPERS), HV = Object.values(HELPERS);
const MEASURE_RE = /\b(SUM|AVG|MIN|MAX|COUNT|DCOUNT|MEDIAN)\s*\(\s*\[([^\]]+)\]\s*\)/gi;

function toJs(expr){
  return expr
    .replace(/<>/g, '!=')
    .replace(/(^|[^<>!=])=(?!=)/g, '$1==')
    .replace(/\bAND\b/gi, '&&').replace(/\bOR\b/gi, '||').replace(/\bNOT\b/gi, '!');
}
/* Formulas are compiled to JavaScript, so they are checked first: only [fields], numbers, quoted text, operators
   and the listed function names may appear. No property access, brackets, braces or other names, so a formula
   shared in a report cannot run arbitrary code in someone else's browser. */
const CALC_NAMES = new Set([...HK, 'SUM', 'AVG', 'MIN', 'MAX', 'COUNT', 'DCOUNT', 'MEDIAN']);
function checkExpr(expr){
  // A [field] is always rewritten to r["field"], so it can never become property access on what precedes it.
  let t = String(expr).replace(/\[[^\]]*\]/g, ' 0 ').replace(/"(?:[^"\\\n]|\\.)*"|'(?:[^'\\\n]|\\.)*'/g, ' 0 ');
  if (/[`{};\[\]\\#@$]/.test(t)) throw new Error('Use only field names in [brackets], numbers, text in quotes, operators and the listed functions.');
  t = t.replace(/\b\d+(?:\.\d+)?(?:e[-+]?\d+)?\b|\B\.\d+\b/gi, ' 0 ');
  if (t.includes('.')) throw new Error('Formulas cannot contain dots outside numbers, field names or quoted text.');
  for (const w of t.match(/[A-Za-z_]\w*/g) || []){
    if (CALC_NAMES.has(w) || /^(and|or|not)$/i.test(w) || /^(true|false|null)$/.test(w)) continue;
    throw new Error(`“${w}” is not a field or function. Put field names in [square brackets].`);
  }
  if (/=\s*>/.test(t)) throw new Error('That operator is not allowed in formulas.');
}
function compileCalc(c){
  checkExpr(c.expr);
  const isMeasure = new RegExp(MEASURE_RE.source, 'i').test(c.expr);
  if (isMeasure){
    let js = c.expr.replace(MEASURE_RE, (_, fn, f) => `__A(${JSON.stringify(fn.toLowerCase())},${JSON.stringify(f)},rows)`);
    if (/\[[^\]]+\]/.test(js)) throw new Error('Inside a measure, wrap every field in an aggregation such as SUM([Field]).');
    const fn = new Function('rows', '__A', ...HK, 'return (' + toJs(js) + ');');
    return {kind:'measure', fn: rows => fn(rows, aggField, ...HV)};
  }
  const js = c.expr.replace(/\[([^\]]+)\]/g, (_, f) => `r[${JSON.stringify(f)}]`);
  const fn = new Function('r', ...HK, 'return (' + toJs(js) + ');');
  return {kind:'row', fn: r => { try { const v = fn(r, ...HV); return (typeof v === 'number' && !isFinite(v)) ? null : v; } catch { return null; } }};
}

function buildModel(){
  const d = ds();
  FIELDS = []; colorCache.clear();
  if (!d || !d.rows){ ROWS = []; FMAP = new Map(); return; }
  const dateCols = d.columns.filter(c => c.type === 'date');
  for (const c of d.columns){
    FIELDS.push({name:c.name, type:c.type, role: c.type === 'number' ? 'measure' : 'dim', src:'col'});
    if (c.type === 'date') for (const p of Object.keys(DATE_PARTS)) FIELDS.push({name:`${c.name} (${p})`, type:'string', role:'dim', src:'part', base:c.name, part:p});
  }
  FIELDS.push({name:RECORDS, type:'number', role:'measure', src:'records'});
  // materialize rows
  ROWS = d.rows.map(r => {
    const o = {...r};
    for (const c of dateCols){
      const v = r[c.name]; const dt = v ? new Date(v + (String(v).length <= 10 ? 'T00:00:00Z' : '')) : null;
      for (const [p, f] of Object.entries(DATE_PARTS)) o[`${c.name} (${p})`] = dt && !isNaN(dt) ? f(dt) : null;
    }
    return o;
  });
  FMAP = new Map(FIELDS.map(f => [f.name, f]));
  for (const c of calcs()){
    c.error = null;
    try {
      const comp = compileCalc(c);
      if (comp.kind === 'row'){
        for (const r of ROWS) r[c.name] = comp.fn(r);
        const sample = ROWS.find(r => r[c.name] != null);
        const type = sample && typeof sample[c.name] === 'number' ? 'number' : 'string';
        FIELDS.push({name:c.name, type, role: type === 'number' ? 'measure' : 'dim', src:'calc', calcKind:'row'});
      } else {
        const test = comp.fn(ROWS.slice(0, 50));
        if (test !== null && typeof test !== 'number' && !isNaN(test)) throw new Error('A measure must return a number.');
        FIELDS.push({name:c.name, type:'number', role:'measure', src:'calc', calcKind:'measure', fn: comp.fn});
      }
    } catch (e){ c.error = e.message; }
    FMAP = new Map(FIELDS.map(f => [f.name, f]));
  }
}

function aggField(agg, f, rows){
  if (f === RECORDS) return rows.length;
  const fd = FMAP.get(f);
  if (fd && fd.calcKind === 'measure') return fd.fn(rows);
  if (agg === 'count'){ let n = 0; for (const r of rows) if (r[f] != null && r[f] !== '') n++; return n; }
  if (agg === 'dcount'){ const s = new Set(); for (const r of rows) if (r[f] != null && r[f] !== '') s.add(r[f]); return s.size; }
  const vals = []; for (const r of rows){ const v = r[f]; if (typeof v === 'number' && !isNaN(v)) vals.push(v); }
  if (!vals.length) return null;
  switch (agg){
    case 'avg': return vals.reduce((a, b) => a + b, 0) / vals.length;
    case 'min': return Math.min(...vals);
    case 'max': return Math.max(...vals);
    case 'median': { vals.sort((a, b) => a - b); const m = vals.length >> 1; return vals.length % 2 ? vals[m] : (vals[m - 1] + vals[m]) / 2; }
    default: return vals.reduce((a, b) => a + b, 0);
  }
}
const measureVal = (m, rows) => { try { const v = aggField(m.agg, m.f, rows); return (typeof v === 'number' && isFinite(v)) ? v : null; } catch { return null; } };
const isCalcMeasure = f => FMAP.get(f)?.calcKind === 'measure' || f === RECORDS;
function measureLabel(m){
  if (m.label) return m.label;
  if (isCalcMeasure(m.f)) return m.f;
  return `${AGGS[m.agg] || 'Sum'} of ${m.f}`;
}
function defaultAgg(f){ const fd = FMAP.get(f); return fd && fd.type === 'number' ? 'sum' : 'dcount'; }

/* formatting */
function fmtKind(m){
  if (!m) return 'number';
  if (m._pct) return 'percent';
  if (m.agg === 'count' || m.agg === 'dcount' || m.f === RECORDS) return 'number';
  const calc = calcs().find(c => c.name === m.f);
  const k = (calc && calc.fmt) || fmts()[m.f] || 'auto';
  if (k !== 'auto') return k;
  return /revenue|sales|cost|profit|price|amount|income|spend|value|\$/i.test(m.f) ? 'currency' : 'number';
}
function compact(v){
  const a = Math.abs(v);
  if (a >= 1e9) return (v / 1e9).toFixed(a >= 1e10 ? 0 : 1).replace(/\.0$/, '') + 'B';
  if (a >= 1e6) return (v / 1e6).toFixed(a >= 1e7 ? 0 : 1).replace(/\.0$/, '') + 'M';
  if (a >= 1e3) return (v / 1e3).toFixed(a >= 1e4 ? 0 : 1).replace(/\.0$/, '') + 'K';
  return a >= 100 || Number.isInteger(v) ? String(Math.round(v)) : String(+v.toFixed(2));
}
function fmtVal(v, m, isCompact){
  if (v == null || isNaN(v)) return '–';
  const k = fmtKind(m);
  if (k === 'percent') return (v * 100).toFixed(isCompact ? 0 : 1) + '%';
  const a = Math.abs(v);
  let s = isCompact ? compact(a) : (a >= 100 ? Math.round(a).toLocaleString('en-US') : (+a.toFixed(2)).toLocaleString('en-US'));
  if (k === 'decimal' && !isCompact) s = a.toLocaleString('en-US', {minimumFractionDigits:2, maximumFractionDigits:2});
  return (v < 0 ? '-' : '') + (k === 'currency' ? '$' : '') + s;
}

/* ordering & colors */
function isOrdinal(f){ const fd = FMAP.get(f); return fd && (fd.src === 'part' || fd.type === 'date' || fd.type === 'number'); }
function labelCmp(a, b){
  if (ORDER.has(a) && ORDER.has(b)) return ORDER.get(a) - ORDER.get(b);
  const na = parseFloat(a), nb = parseFloat(b);
  if (!isNaN(na) && !isNaN(nb) && String(na) === a && String(nb) === b) return na - nb;
  return String(a).localeCompare(String(b), undefined, {numeric:true});
}
function seriesColors(){ return [1,2,3,4,5,6,7,8].map(i => css('--s' + i)); }
function colorMap(field){
  // Stable: color follows the entity (ranked by row count over the full dataset), never its rank in a filtered view.
  if (colorCache.has(field)) return colorCache.get(field);
  const counts = new Map();
  for (const r of ROWS){ const k = keyOf(r[field]); counts.set(k, (counts.get(k) || 0) + 1); }
  const keys = [...counts.keys()].sort((a, b) => counts.get(b) - counts.get(a) || labelCmp(a, b));
  const fold = keys.length > 8;
  const top = fold ? keys.slice(0, 7) : keys;
  const m = {keys: top, fold, index: new Map(top.map((k, i) => [k, i]))};
  colorCache.set(field, m);
  return m;
}
const colorFor = (field, key) => { const m = colorMap(field); const i = m.index.get(key); return i == null ? css('--other') : seriesColors()[i]; };
const keyOf = v => v == null || v === '' ? '(Blank)' : String(v);
const foldKey = (field, v) => { const m = colorMap(field); const k = keyOf(v); return !m.fold || m.index.has(k) ? k : 'Other'; };

/* ============================== selections / filtering ============================== */
function ownFields(v){
  const t = TYPES[v.type];
  if (!t || t.noSelect) return [];
  return v.dims && v.dims[0] ? [v.dims[0]] : [];
}
function rowsFor(v){
  const own = new Set(ownFields(v));
  const active = Object.entries(S.sel).filter(([f, s]) => s.size && !own.has(f) && FMAP.has(f));
  const drill = [...(v._drill || []), ...(S.dt && S.pages[S.pageIdx]?.id === S.dt.pageId ? S.dt.filters.filter(f => FMAP.has(f[0])) : [])];
  const vf = (v.vfilters || []).filter(([f]) => FMAP.has(f)).map(([f, vals]) => [f, new Set(vals.map(String))]);
  if (!active.length && !drill.length && !vf.length) return ROWS;
  return ROWS.filter(r => active.every(([f, s]) => s.has(keyOf(r[f]))) && drill.every(([f, val]) => keyOf(r[f]) === val) && vf.every(([f, s]) => s.has(keyOf(r[f]))));
}
/* ---- drill-down: the Axis well holds a hierarchy; v.level is the shown level, v.path the values drilled through ---- */
function canDrill(v){ return !!TYPES[v.type]?.drill && (v.dims || []).length > 1; }
function level(v){ return canDrill(v) ? clamp(v.level || 0, 0, v.dims.length - 1) : 0; }
function effective(v){
  if (!canDrill(v)) return v;
  const L = level(v), path = (v.path || []).slice(0, L);
  return {...v, dims: [v.dims[L]], _drill: path.map((val, i) => [v.dims[i], val]).filter(p => p[1] != null)};
}
function drillDown(v, val){
  const L = level(v);
  if (!canDrill(v) || L >= v.dims.length - 1 || val == null || val === 'Other' || val === 'Total') return;
  v.path = [...(v.path || []).slice(0, L), String(val)]; v.level = L + 1; changed();
}
function drillUp(v){ const L = level(v); if (!L) return; v.level = L - 1; v.path = (v.path || []).slice(0, L - 1); changed(); }
function drillNext(v){ const L = level(v); if (!canDrill(v) || L >= v.dims.length - 1) return; v.path = [...(v.path || []).slice(0, L), null]; v.level = L + 1; changed(); }
const shortName = f => { const fd = FMAP.get(f); return fd?.src === 'part' ? fd.part : f; };
function globalRows(){ return rowsFor({type:'kpi'}); }
function toggleSel(field, key, multi){
  if (key === 'Other') { toast('“Other” groups several values; select them from a slicer instead.'); return; }
  const s = S.sel[field] ||= new Set();
  if (multi){ s.has(key) ? s.delete(key) : s.add(key); }
  else if (s.size === 1 && s.has(key)) s.clear();
  else { s.clear(); s.add(key); }
  if (!s.size) delete S.sel[field];
  setTimeout(renderAll, 0);
}
const isDimmed = (field, key) => { const s = S.sel[field]; return !!(s && s.size && !s.has(key)); };

/* ============================== query ============================== */
function groupRows(rows, fn){ const m = new Map(); for (const r of rows){ const k = fn(r); let a = m.get(k); if (!a) m.set(k, a = []); a.push(r); } return m; }
function orderCats(keys, v, valueOf, forceLabel){
  const dim = v.dims[0];
  let sort = v.sort || 'auto';
  if (sort === 'auto') sort = (forceLabel || isOrdinal(dim)) ? 'label' : 'desc';
  let ks = [...keys];
  if (v.top > 0 && ks.length > v.top){
    const keep = new Set([...ks].sort((a, b) => (valueOf(b) ?? -Infinity) - (valueOf(a) ?? -Infinity)).slice(0, v.top));
    ks = ks.filter(k => keep.has(k));
  }
  if (sort === 'label') ks.sort(labelCmp);
  else if (sort === 'label-desc') ks.sort((a, b) => labelCmp(b, a));
  else if (sort === 'asc') ks.sort((a, b) => (valueOf(a) ?? 0) - (valueOf(b) ?? 0));
  else ks.sort((a, b) => (valueOf(b) ?? 0) - (valueOf(a) ?? 0));
  return ks;
}
/* category × series matrix used by column/bar/line/area */
function catQuery(v, forceLabel){
  const rows = rowsFor(v), dim = v.dims[0];
  const groups = groupRows(rows, r => keyOf(r[dim]));
  const ms = v.measures;
  const m0 = ms[0];
  const totals = new Map([...groups].map(([k, rs]) => [k, measureVal(m0, rs)]));
  const cats = orderCats(groups.keys(), v, k => totals.get(k), forceLabel);
  let series;
  if (v.legend){
    const lg = v.legend;
    const present = new Set(rows.map(r => foldKey(lg, r[lg])));
    const cm = colorMap(lg);
    const order = [...cm.keys.filter(k => present.has(k)), ...(present.has('Other') ? ['Other'] : [])];
    const extra = [...present].filter(k => !order.includes(k)).sort(labelCmp);
    series = [...order, ...extra].map(lk => ({
      name: lk, color: colorFor(lg, lk), m: m0,
      data: cats.map(c => { const rs = (groups.get(c) || []).filter(r => foldKey(lg, r[lg]) === lk); return rs.length ? measureVal(m0, rs) : null; })
    }));
  } else {
    const col = seriesColors();
    series = ms.map((m, i) => ({name: measureLabel(m), color: col[i % 8], m, data: cats.map(c => measureVal(m, groups.get(c)))}));
  }
  return {cats, series, dim};
}

function baseOpt(){
  const ink = css('--ink'), ink2 = css('--ink2');
  return {
    animation: !EXPORTING, animationDuration: 280, animationDurationUpdate: 280,
    textStyle: {fontFamily: css('--f-ui'), color: ink2},

      textStyle: {color: ink, fontSize: 12, fontFamily: css('--f-ui')}, extraCssText: 'box-shadow:0 4px 16px rgba(0,0,0,.12);border-radius:8px'},
    legend: {show: false, top: 0, left: 0, type: 'scroll', icon: 'roundRect', itemWidth: 10, itemHeight: 10, itemGap: 12,
      textStyle: {color: ink2, fontSize: 11.5}, pageTextStyle: {color: ink2}, pageIconColor: ink2},
  };
}
const catAxis = (cats, extra = {}) => ({type:'category', data: cats, axisTick:{show:false}, axisLine:{lineStyle:{color:css('--axis')}},
  axisLabel:{color:css('--ink2'), fontSize:11, hideOverlap:true, width:110, overflow:'truncate'}, ...extra});
const valAxis = (m, extra = {}) => ({type:'value', splitLine:{lineStyle:{color:css('--grid')}}, axisLabel:{color:css('--ink2'), fontSize:11, formatter: x => fmtVal(x, m, true)}, ...extra});

const PCT = {f: '', agg: 'sum', _pct: true};
function cartesian(v){
  const t = v.type, horizontal = t === 'bar' || t === 'stackedbar', isLine = t === 'line' || t === 'area', pct = t === 'stacked100';
  const q = catQuery(v, isLine && (v.sort || 'auto') === 'auto');
  if (!q.cats.length) return null;
  const stacked = ['stacked', 'stacked100', 'stackedbar'].includes(t) || (t === 'area' && !!v.legend);
  if (pct){
    const tot = q.cats.map((_, i) => q.series.reduce((a, se) => a + Math.max(0, se.data[i] ?? 0), 0));
    q.series.forEach(se => { se.data = se.data.map((x, i) => x == null || !tot[i] ? null : Math.max(0, x) / tot[i]); });
  }
  const multi = q.series.length > 1;
  const surf = css('--surface');
  const n = q.series.length;
  const opt = baseOpt();
  opt.legend.show = multi;
  opt.legend.data = q.series.map(s => s.name);
  opt.grid.top = multi ? 30 : 10;
  opt.tooltip.trigger = 'axis';
  opt.tooltip.axisPointer = isLine ? {type:'line', lineStyle:{color:css('--axis')}} : {type:'shadow', shadowStyle:{color: 'rgba(127,127,127,.08)'}};
  const m0 = q.series[0].m;
  const ca = catAxis(q.cats, horizontal ? {inverse: true} : {boundaryGap: !isLine});
  const va = valAxis(pct ? PCT : m0, pct ? {max: 1} : {});
  opt.xAxis = horizontal ? va : ca;
  opt.yAxis = horizontal ? ca : va;
  opt.series = q.series.map((s, si) => {
    const top = si === n - 1;
    const radius = horizontal ? (stacked && !top ? 0 : [0, 4, 4, 0]) : (stacked && !top ? 0 : [4, 4, 0, 0]);
    const data = s.data.map((val, i) => {
      const dim = isDimmed(q.dim, q.cats[i]);
      return isLine ? {value: val, symbolSize: !isDimmed(q.dim, q.cats[i]) && S.sel[q.dim] ? 10 : 6}
                    : {value: val, itemStyle: {opacity: dim ? 0.25 : 1}};
    });
    const showLabels = v.labels && !stacked;
    const ser = {
      name: s.name, type: isLine ? 'line' : 'bar', data, color: s.color,
      tooltip: {valueFormatter: x => fmtVal(x, pct ? PCT : s.m)},
      emphasis: {focus: multi ? 'series' : 'none'},
    };
    if (isLine){
      Object.assign(ser, {lineStyle:{width:2}, showSymbol: q.cats.length <= 24, symbol:'circle', connectNulls: true,
        itemStyle:{borderColor: surf, borderWidth: 1.5}, stack: stacked ? 'a' : undefined,
        areaStyle: t === 'area' ? {opacity: stacked ? 0.55 : 0.16} : undefined});
    } else {
      Object.assign(ser, {barMaxWidth: horizontal ? 22 : 40, barGap: '12%', barCategoryGap: multi && !stacked ? '28%' : '34%',
        stack: stacked ? 'a' : undefined,
        itemStyle:{borderRadius: radius, borderColor: stacked ? surf : 'transparent', borderWidth: stacked ? 1 : 0}});
    }
    if (showLabels) ser.label = {show:true, position: stacked ? 'inside' : (horizontal ? 'right' : 'top'), color: stacked ? '#fff' : css('--ink2'), fontSize: 11,
      formatter: p => p.value == null ? '' : fmtVal(p.value, pct ? PCT : s.m, true)};
    return ser;
  });
  return {opt, pick: p => p.name == null ? null : [[q.dim, p.name], ...(v.legend && p.seriesName && p.seriesName !== 'Other' ? [[v.legend, p.seriesName]] : [])], onClick: p => p.name != null && toggleSel(q.dim, p.name, p.multi)};
}

function categorical(v){
  const rows = rowsFor(v), dim = v.dims[0], m = v.measures[0];
  const noFold = !['donut', 'pie'].includes(v.type);
  const groups = groupRows(rows, r => noFold ? keyOf(r[dim]) : foldKey(dim, r[dim]));
  let items = [...groups].map(([k, rs]) => ({name: k, value: measureVal(m, rs)})).filter(d => d.value != null && (v.type === 'funnel' || d.value > 0));
  items.sort((a, b) => a.name === 'Other' ? 1 : b.name === 'Other' ? -1 : b.value - a.value);
  if (v.top > 0) items = items.slice(0, v.top);
  if (!items.length) return null;
  const surf = css('--surface');
  const opt = baseOpt();
  opt.tooltip.trigger = 'item';
  opt.tooltip.formatter = p => `${esc(p.name)}<br><b>${esc(fmtVal(p.value, m))}</b>${p.percent != null ? ' · ' + p.percent.toFixed(1) + '%' : ''}`;
  const dimOp = n => isDimmed(dim, n) ? 0.25 : 1;
  if (v.type === 'donut' || v.type === 'pie'){
    opt.legend.show = true; opt.legend.top = null; opt.legend.bottom = 0; opt.legend.left = 'center';
    opt.legend.formatter = n => n.length > 18 ? n.slice(0, 17) + '…' : n;
    opt.series = [{type:'pie', radius: v.type === 'pie' ? [0, '72%'] : ['46%','72%'], center:['50%','46%'], avoidLabelOverlap:true,
      itemStyle:{borderColor: surf, borderWidth: 2, borderRadius: 4},
      label:{show: v.labels !== false, color: css('--ink2'), fontSize: 11, formatter: p => p.percent >= 6 ? p.percent.toFixed(0) + '%' : ''},
      labelLine:{show:false}, labelLayout:{hideOverlap:true},
      data: items.map(d => ({...d, itemStyle:{color: colorFor(dim, d.name), opacity: dimOp(d.name)}}))}];
    const total = items.reduce((s, d) => s + d.value, 0);
    if (v.type === 'donut') opt.title = {text: fmtVal(total, m, true), subtext: 'Total', left: '50%', top: '46%', textAlign: 'center', textVerticalAlign: 'middle', itemGap: 2,
      textStyle: {color: css('--ink'), fontFamily: css('--f-head'), fontWeight: 600, fontSize: 15}, subtextStyle: {color: css('--ink3'), fontSize: 11}};
    opt.series[0].label.position = 'inside';
    opt.series[0].label.color = '#fff';
  } else if (v.type === 'treemap'){
    opt.series = [{type:'treemap', roam:false, nodeClick:false, breadcrumb:{show:false}, width:'100%', height:'100%', top:0, left:0,
      itemStyle:{borderColor: surf, borderWidth: 2, gapWidth: 2, borderRadius: 4},
      label:{show:true, formatter: p => `${p.name}\n${fmtVal(p.value, m, true)}`, fontSize: 11.5, color:'#fff', lineHeight: 15},
      upperLabel:{show:false},
      data: items.map((d, i) => ({...d, itemStyle:{color: colorMap(dim).fold ? css('--s1') : colorFor(dim, d.name), opacity: dimOp(d.name)}}))}];
  } else { // funnel
    const ramp = ['--seq4','--seq3','--seq2','--seq1'].map(css);
    opt.series = [{type:'funnel', sort:'descending', left:'6%', right:'6%', top:8, bottom:8, gap:2, minSize:'12%',
      label:{show:true, position:'inside', color:'#fff', fontSize:11.5, formatter: p => `${p.name}  ${fmtVal(p.value, m, true)}`},
      itemStyle:{borderWidth:0},
      data: items.map((d, i) => ({...d, itemStyle:{color: ramp[Math.min(ramp.length - 1, Math.floor(i / Math.max(1, items.length) * ramp.length))], opacity: dimOp(d.name)}}))}];
  }
  return {opt, pick: p => p.name == null || p.name === 'Other' ? null : [[dim, p.name]], onClick: p => p.name != null && toggleSel(dim, p.name, p.multi)};
}
function seqColor(t){ // 0..1 over the sequential ramp
  const stops = ['--seq0','--seq1','--seq2','--seq3','--seq4'].map(css);
  return stops[Math.round(clamp(t, 0, 1) * (stops.length - 1))];
}

function scatter(v){
  const rows = rowsFor(v), dim = v.dims[0], [mx, my, ms] = v.measures;
  if (!mx || !my) return {msg:'Add at least two values: the first is X, the second is Y, a third sets bubble size.'};
  const groups = groupRows(rows, r => keyOf(r[dim]));
  const lg = v.legend;
  const pts = [...groups].map(([k, rs]) => ({name: k, x: measureVal(mx, rs), y: measureVal(my, rs), s: ms ? measureVal(ms, rs) : null,
    lg: lg ? foldKeyCap(lg, rs[0][lg]) : null})).filter(p => p.x != null && p.y != null);
  if (!pts.length) return null;
  const smax = ms ? Math.max(...pts.map(p => Math.abs(p.s || 0))) || 1 : 1;
  const size = p => ms ? 8 + 30 * Math.sqrt(Math.abs(p.s || 0) / smax) : 10;
  const surf = css('--surface');
  const groupsL = lg ? [...new Set(pts.map(p => p.lg))].sort((a, b) => a === 'Other' ? 1 : b === 'Other' ? -1 : (colorMap(lg).index.get(a) ?? 99) - (colorMap(lg).index.get(b) ?? 99)) : [null];
  const opt = baseOpt();
  opt.grid.top = lg ? 30 : 12; opt.grid.bottom = 22; opt.grid.left = 10;
  opt.legend.show = !!lg;
  opt.tooltip.trigger = 'item';
  opt.tooltip.formatter = p => { const d = p.data; return `<b>${esc(d.name)}</b><br>${esc(measureLabel(mx))}: ${esc(fmtVal(d.value[0], mx))}<br>${esc(measureLabel(my))}: ${esc(fmtVal(d.value[1], my))}${ms ? `<br>${esc(measureLabel(ms))}: ${esc(fmtVal(d.value[2], ms))}` : ''}`; };
  opt.xAxis = valAxis(mx, {name: measureLabel(mx), nameLocation:'middle', nameGap: 24, nameTextStyle:{color: css('--ink2'), fontSize: 11}, scale: true, boundaryGap:['8%','8%']});
  opt.yAxis = valAxis(my, {scale: true, boundaryGap:['12%','12%']});
  const capColors = seriesColors().slice(0, 3);
  opt.series = groupsL.map(g => ({
    type:'scatter', name: g ?? measureLabel(my),
    color: g == null ? css('--s1') : g === 'Other' ? css('--other') : capColors[scatterIdx(lg, g)],
    itemStyle:{opacity: 0.8, borderColor: surf, borderWidth: 1.5},
    emphasis:{focus:'series'},
    data: pts.filter(p => p.lg === g).map(p => ({name: p.name, value:[p.x, p.y, p.s], symbolSize: size(p), itemStyle: isDimmed(dim, p.name) ? {opacity: .15} : undefined})),
  }));
  return {opt, pick: p => p.name == null || p.name === 'Other' ? null : [[dim, p.name]], onClick: p => p.name != null && toggleSel(dim, p.name, p.multi)};
}
// scatter legends: 3 hues max (all-pairs safe), rest fold to Other
function scatterIdx(lg, g){ return colorMap(lg).keys.slice(0, 3).indexOf(g); }
function foldKeyCap(lg, v){ const k = keyOf(v); return colorMap(lg).keys.slice(0, 3).includes(k) ? k : 'Other'; }

function heatmap(v){
  const rows = rowsFor(v), dx = v.dims[0], dy = v.legend, m = v.measures[0];
  if (!dy) return {msg:'Add a field to the Y axis well.'};
  const xs = [...new Set(rows.map(r => keyOf(r[dx])))].sort(labelCmp);
  const ys = [...new Set(rows.map(r => keyOf(r[dy])))].sort(labelCmp);
  if (xs.length > 60 || ys.length > 60) return {msg:'Too many distinct values for a heatmap (max 60 per axis). Try a coarser field.'};
  const g = groupRows(rows, r => keyOf(r[dx]) + '\u0001' + keyOf(r[dy]));
  const data = [];
  let lo = Infinity, hi = -Infinity;
  xs.forEach((x, i) => ys.forEach((y, j) => { const rs = g.get(x + '\u0001' + y); const val = rs ? measureVal(m, rs) : null; if (val != null){ lo = Math.min(lo, val); hi = Math.max(hi, val); }
    data.push({value:[i, j, val], itemStyle: isDimmed(dx, x) ? {opacity:.25} : undefined}); }));
  if (!isFinite(lo)) return null;
  const opt = baseOpt();
  opt.grid = {left: 4, right: 10, top: 8, bottom: 34, containLabel: true};
  opt.tooltip.trigger = 'item';
  opt.tooltip.formatter = p => `${esc(xs[p.value[0]])} · ${esc(ys[p.value[1]])}<br><b>${esc(fmtVal(p.value[2], m))}</b>`;
  opt.xAxis = catAxis(xs, {splitArea:{show:false}});
  opt.yAxis = catAxis(ys);
  opt.visualMap = {min: lo, max: hi, calculable: false, orient:'horizontal', left:'center', bottom: 0, itemHeight: 140, itemWidth: 10,
    inRange:{color: ['--seq0','--seq1','--seq2','--seq3','--seq4'].map(css)}, textStyle:{color: css('--ink2'), fontSize: 11},
    formatter: x => fmtVal(x, m, true)};
  opt.series = [{type:'heatmap', data, itemStyle:{borderColor: css('--surface'), borderWidth: 2, borderRadius: 3},
    label:{show: v.labels && xs.length * ys.length <= 80, fontSize: 10.5, formatter: p => fmtVal(p.value[2], m, true)}}];
  return {opt, pick: p => [[dx, xs[p.value[0]]], [dy, ys[p.value[1]]]], onClick: p => toggleSel(dx, xs[p.value[0]], p.multi)};
}

function waterfall(v){
  const rows = rowsFor(v), dim = v.dims[0], m = v.measures[0];
  const g = groupRows(rows, r => keyOf(r[dim]));
  const vals = new Map([...g].map(([k, rs]) => [k, measureVal(m, rs)]));
  const cats = orderCats(g.keys(), v, k => vals.get(k), false);
  if (!cats.length) return null;
  let run = 0; const base = [], up = [], down = [];
  for (const c of cats){
    const x = vals.get(c) ?? 0, start = run; run += x;
    base.push(Math.min(start, run)); up.push(x >= 0 ? x : null); down.push(x < 0 ? -x : null);
  }
  const all = [...cats, 'Total'];
  base.push(0); up.push(null); down.push(null);
  const total = all.map((_, i) => i === cats.length ? run : null);
  const op = i => ({opacity: i < cats.length && isDimmed(dim, cats[i]) ? 0.25 : 1});
  const opt = baseOpt();
  opt.legend.show = true; opt.legend.data = ['Increase', 'Decrease', 'Total'];
  opt.tooltip.trigger = 'axis'; opt.tooltip.axisPointer = {type:'shadow', shadowStyle:{color:'rgba(127,127,127,.08)'}};
  opt.tooltip.formatter = ps => { const i = ps[0].dataIndex; const delta = i < cats.length ? vals.get(cats[i]) : run;
    return `${esc(all[i])}<br><b>${esc(fmtVal(delta, m))}</b>${i < cats.length ? `<br><span style="color:${css('--ink2')}">Running total ${esc(fmtVal(base[i] + Math.abs(delta ?? 0) * (delta >= 0 ? 1 : 0), m))}</span>` : ''}`; };
  opt.xAxis = catAxis(all); opt.yAxis = valAxis(m);
  const lbl = pos => v.labels ? {show:true, position: pos, fontSize: 11, color: css('--ink2'), formatter: p => p.value == null ? '' : fmtVal(p.value, m, true)} : undefined;
  const bar = (name, data, color, extra = {}) => ({name, type:'bar', stack:'w', data: data.map((x, i) => ({value: x, itemStyle: op(i)})), color, barMaxWidth: 40, barCategoryGap: '30%', itemStyle:{borderRadius: 3}, ...extra});
  opt.series = [
    {name:'__base', type:'bar', stack:'w', data: base, itemStyle:{color:'transparent'}, emphasis:{disabled:true}, silent:true, tooltip:{show:false}},
    bar('Increase', up, css('--st-good'), {label: lbl('top')}),
    bar('Decrease', down, css('--st-bad'), {label: lbl('bottom')}),
    bar('Total', total, css('--s1'), {label: lbl('top')}),
  ];
  return {opt, pick: p => p.name == null || p.name === 'Total' ? null : [[dim, p.name]], onClick: p => p.name != null && p.name !== 'Total' && toggleSel(dim, p.name, p.multi)};
}

function sunburst(v){
  const rows = rowsFor(v), dims = v.dims, m = v.measures[0];
  const build = (rs, depth) => {
    const g = groupRows(rs, r => keyOf(r[dims[depth]]));
    return [...g].map(([k, grp]) => {
      const node = {name: k, value: measureVal(m, grp) ?? 0};
      if (depth === 0) node.itemStyle = {color: colorFor(dims[0], k), opacity: isDimmed(dims[0], k) ? 0.25 : 1};
      if (depth < dims.length - 1) node.children = build(grp, depth + 1);
      return node;
    }).filter(n => n.value > 0).sort((a, b) => b.value - a.value).slice(0, 20);
  };
  const data = build(rows, 0);
  if (!data.length) return null;
  const opt = baseOpt();
  opt.tooltip.trigger = 'item';
  opt.tooltip.formatter = p => `${(p.treePathInfo || []).slice(1).map(x => esc(x.name)).join(' › ')}<br><b>${esc(fmtVal(p.value, m))}</b>`;
  opt.series = [{type:'sunburst', data, radius:['14%','94%'], nodeClick:false, sort:null,
    itemStyle:{borderColor: css('--surface'), borderWidth: 2, borderRadius: 3},
    label:{rotate:'radial', color:'#fff', fontSize: 10.5, minAngle: 14, overflow:'truncate', width: 70},
    levels:[{}, {}, {itemStyle:{opacity:.78}}, {itemStyle:{opacity:.62}}, {itemStyle:{opacity:.5}}]}];
  return {opt, pick: p => (p.treePathInfo || []).slice(1).map((n, i) => [dims[i], n.name]), onClick: p => { const top = p.treePathInfo?.[1]?.name; if (top != null) toggleSel(dims[0], top, p.multi); }};
}

function rawNumeric(m){
  const fd = FMAP.get(m.f);
  if (!fd || fd.calcKind === 'measure' || m.f === RECORDS || fd.type !== 'number') return null;
  return m.f;
}
function histBins(v){
  const f = rawNumeric(v.measures[0]); if (!f) return {msg:'A histogram needs a numeric column or row formula, such as Revenue or Profit. Measures that aggregate cannot be binned.'};
  const vals = []; for (const r of rowsFor(v)){ const x = r[f]; if (typeof x === 'number' && isFinite(x)) vals.push(x); }
  if (!vals.length) return null;
  let lo = Infinity, hi = -Infinity; for (const x of vals){ if (x < lo) lo = x; if (x > hi) hi = x; }
  const n = clamp(v.bins || 20, 2, 100); if (hi === lo) hi = lo + 1;
  const w = (hi - lo) / n, counts = new Array(n).fill(0);
  for (const x of vals) counts[Math.min(n - 1, Math.floor((x - lo) / w))]++;
  const mm = {f, agg:'sum'};
  return {f, counts, edges: counts.map((_, i) => [lo + i * w, lo + (i + 1) * w]), labels: counts.map((_, i) => `${fmtVal(lo + i * w, mm, true)}–${fmtVal(lo + (i + 1) * w, mm, true)}`), total: vals.length};
}
function histogram(v){
  const h = histBins(v); if (!h || h.msg) return h;
  const opt = baseOpt();
  opt.grid.top = 12;
  opt.tooltip.trigger = 'axis'; opt.tooltip.axisPointer = {type:'shadow', shadowStyle:{color:'rgba(127,127,127,.08)'}};
  opt.tooltip.formatter = ps => `${esc(v.measures[0].f)} ${esc(h.labels[ps[0].dataIndex])}<br><b>${ps[0].value.toLocaleString()} rows</b> · ${(ps[0].value / h.total * 100).toFixed(1)}%`;
  opt.xAxis = catAxis(h.labels, {axisLabel:{color: css('--ink2'), fontSize: 10.5, hideOverlap: true, formatter: x => x.split('–')[0]}});
  opt.yAxis = valAxis({f:'', agg:'count'}, {name:'Rows', nameTextStyle:{color: css('--ink3'), fontSize: 11, align:'left'}});
  opt.series = [{type:'bar', data: h.counts, color: css('--s1'), barCategoryGap:'6%', itemStyle:{borderRadius:[3,3,0,0]}}];
  return {opt};
}

function quantile(sorted, q){ const pos = (sorted.length - 1) * q, b = Math.floor(pos), rest = pos - b; return sorted[b + 1] !== undefined ? sorted[b] + rest * (sorted[b + 1] - sorted[b]) : sorted[b]; }
function boxStats(v){
  const f = rawNumeric(v.measures[0]); if (!f) return {msg:'A box plot needs a numeric column or row formula, such as Revenue or Unit Price.'};
  const dim = v.dims[0];
  const g = groupRows(rowsFor(v), r => keyOf(r[dim]));
  let cats = [...g.keys()].sort((a, b) => g.get(b).length - g.get(a).length).slice(0, 15);
  const st = new Map();
  for (const c of cats){
    const xs = g.get(c).map(r => r[f]).filter(x => typeof x === 'number' && isFinite(x)).sort((a, b) => a - b);
    if (!xs.length) continue;
    const q1 = quantile(xs, .25), med = quantile(xs, .5), q3 = quantile(xs, .75), iqr = q3 - q1;
    const lo = xs.find(x => x >= q1 - 1.5 * iqr), hi = [...xs].reverse().find(x => x <= q3 + 1.5 * iqr);
    const out = xs.filter(x => x < lo || x > hi);
    st.set(c, {min: lo, q1, med, q3, max: hi, out: out.length > 150 ? out.filter((_, i) => i % Math.ceil(out.length / 150) === 0) : out, n: xs.length});
  }
  cats = cats.filter(c => st.has(c));
  if (isOrdinal(dim)) cats.sort(labelCmp); else cats.sort((a, b) => st.get(b).med - st.get(a).med);
  return {f, dim, cats, st};
}
function boxplot(v){
  const b = boxStats(v); if (!b || b.msg) return b;
  if (!b.cats.length) return null;
  const m = {f: b.f, agg:'sum'}, s1 = css('--s1');
  const opt = baseOpt();
  opt.grid.top = 12;
  opt.tooltip.trigger = 'item';
  opt.tooltip.formatter = p => { if (p.seriesType === 'scatter') return `${esc(b.cats[p.value[0]])}<br>Outlier: <b>${esc(fmtVal(p.value[1], m))}</b>`;
    const x = b.st.get(b.cats[p.dataIndex]);
    return `<b>${esc(b.cats[p.dataIndex])}</b> · ${x.n.toLocaleString()} rows<br>Max ${esc(fmtVal(x.max, m))}<br>Q3 ${esc(fmtVal(x.q3, m))}<br>Median <b>${esc(fmtVal(x.med, m))}</b><br>Q1 ${esc(fmtVal(x.q1, m))}<br>Min ${esc(fmtVal(x.min, m))}`; };
  opt.xAxis = catAxis(b.cats); opt.yAxis = valAxis(m);
  opt.series = [
    {type:'boxplot', boxWidth:['30%','55%'], data: b.cats.map(c => { const x = b.st.get(c); return {value:[x.min, x.q1, x.med, x.q3, x.max], itemStyle:{color: rgba(s1, .18), borderColor: s1, borderWidth: 1.5, opacity: isDimmed(b.dim, c) ? .3 : 1}}; })},
    {type:'scatter', symbolSize: 5, itemStyle:{color: css('--ink3'), opacity: .55}, data: b.cats.flatMap((c, i) => b.st.get(c).out.map(y => [i, y]))},
  ];
  return {opt, pick: p => p.seriesType === 'boxplot' ? [[b.dim, b.cats[p.dataIndex]]] : null, onClick: p => p.seriesType === 'boxplot' && toggleSel(b.dim, b.cats[p.dataIndex], p.multi)};
}

function radar(v){
  const rows = rowsFor(v), dim = v.dims[0], lg = v.legend, m = v.measures[0];
  const g = groupRows(rows, r => keyOf(r[dim]));
  let axes = [...g].map(([k, rs]) => [k, measureVal(m, rs) ?? 0]).sort((a, b) => b[1] - a[1]).slice(0, 12).map(a => a[0]);
  if (isOrdinal(dim)) axes.sort(labelCmp);
  if (axes.length < 3) return {msg:'A radar chart needs at least three values on Axes.'};
  let series;
  if (lg){
    const keys = colorMap(lg).keys.slice(0, 3).filter(k => rows.some(r => keyOf(r[lg]) === k));
    series = keys.map((k, i) => ({name: k, color: seriesColors()[i], value: axes.map(a => measureVal(m, g.get(a).filter(r => keyOf(r[lg]) === k)) ?? 0)}));
  } else series = [{name: measureLabel(m), color: css('--s1'), value: axes.map(a => measureVal(m, g.get(a)) ?? 0)}];
  const max = Math.max(...series.flatMap(s => s.value)) * 1.1 || 1;
  const opt = baseOpt();
  opt.legend.show = !!lg;
  opt.tooltip.trigger = 'item';
  opt.tooltip.formatter = p => `<b>${esc(p.name)}</b><br>` + axes.map((a, i) => `${esc(a)}: ${esc(fmtVal(p.value[i], m))}`).join('<br>');
  opt.radar = {indicator: axes.map(a => ({name: a, max})), radius:'64%', center:['50%', lg ? '56%' : '52%'],
    axisName:{color: css('--ink2'), fontSize: 11}, splitLine:{lineStyle:{color: css('--grid')}}, splitArea:{show:false}, axisLine:{lineStyle:{color: css('--grid')}}};
  opt.series = [{type:'radar', symbolSize: 5, data: series.map(s => ({name: s.name, value: s.value, itemStyle:{color: s.color}, lineStyle:{width: 2, color: s.color}, areaStyle:{color: s.color, opacity: .12}}))}];
  return {opt, pick: p => lg && p.name ? [[lg, p.name]] : null, onClick: p => lg && p.name && toggleSel(lg, p.name, p.multi)};
}

function sankey(v){
  const rows = rowsFor(v), s = v.dims[0], t = v.legend, m = v.measures[0];
  if (!t) return {msg:'Add a field to Target.'};
  if (s === t) return {msg:'Source and Target must be different fields.'};
  const top = f => { const gg = groupRows(rows, r => keyOf(r[f])); return new Set([...gg].map(([k, rs]) => [k, measureVal(m, rs) ?? 0]).sort((a, b) => b[1] - a[1]).slice(0, 12).map(x => x[0])); };
  const TS = top(s), TT = top(t);
  const sk = r => { const k = keyOf(r[s]); return TS.has(k) ? k : 'Other'; }, tk = r => { const k = keyOf(r[t]); return TT.has(k) ? k : 'Other'; };
  const Z = '​';  // targets get an invisible suffix so a value on both sides stays two nodes
  const g = groupRows(rows, r => sk(r) + '\u0001' + tk(r));
  const links = [...g].map(([k, rs]) => { const [a, b] = k.split('\u0001'); return {source: a, target: b + Z, value: measureVal(m, rs)}; }).filter(l => l.value > 0);
  if (!links.length) return null;
  const srcs = [...new Set(links.map(l => l.source))], tgts = [...new Set(links.map(l => l.target))];
  const data = [...srcs.map(n => ({name: n, itemStyle:{color: colorFor(s, n), opacity: isDimmed(s, n) ? .3 : 1}})), ...tgts.map(n => ({name: n, itemStyle:{color: colorFor(t, n.slice(0, -1))}}))];
  const opt = baseOpt();
  opt.tooltip.trigger = 'item';
  opt.tooltip.formatter = p => p.dataType === 'edge' ? `${esc(p.data.source)} → ${esc(p.data.target)}<br><b>${esc(fmtVal(p.value, m))}</b>` : `${esc(p.name)}<br><b>${esc(fmtVal(p.value, m))}</b>`;
  opt.series = [{type:'sankey', left: 4, right: 110, top: 8, bottom: 8, nodeWidth: 12, nodeGap: 8, draggable: false, layoutIterations: 32,
    emphasis:{focus:'adjacency'}, label:{color: css('--ink'), fontSize: 11}, lineStyle:{color:'source', opacity:.28, curveness:.5},
    itemStyle:{borderWidth: 0}, data, links}];
  return {opt, pick: p => p.dataType === 'node' ? (String(p.name).endsWith(Z) ? [[t, String(p.name).slice(0, -1)]] : [[s, String(p.name)]]) : p.dataType === 'edge' ? [[s, p.data.source], [t, String(p.data.target).slice(0, -1)]] : null, onClick: p => { if (p.dataType !== 'node') return; const n = String(p.name); n.endsWith(Z) ? toggleSel(t, n.slice(0, -1), p.multi) : toggleSel(s, n, p.multi); }};
}

function calendar(v){
  const dim = v.dims[0], fd = FMAP.get(dim), m = v.measures[0];
  if (!(fd.type === 'date' || fd.part === 'Day')) return {msg:'A calendar heatmap needs a date field, such as Order Date or its Day level.'};
  const g = groupRows(rowsFor(v), r => keyOf(r[dim]));
  const data = [...g].filter(([k]) => /^\d{4}-\d{2}-\d{2}$/.test(k)).map(([k, rs]) => [k, measureVal(m, rs)]).filter(d => d[1] != null);
  if (!data.length) return null;
  const years = [...new Set(data.map(d => d[0].slice(0, 4)))].sort().slice(-3);
  let lo = Infinity, hi = -Infinity; for (const d of data){ lo = Math.min(lo, d[1]); hi = Math.max(hi, d[1]); }
  const n = years.length, band = 84 / n;
  const opt = baseOpt();
  opt.tooltip.trigger = 'item';
  opt.tooltip.formatter = p => `${esc(new Date(p.value[0] + 'T00:00:00Z').toLocaleDateString('en-US', {weekday:'short', month:'short', day:'numeric', year:'numeric', timeZone:'UTC'}))}<br><b>${esc(fmtVal(p.value[1], m))}</b>`;
  opt.calendar = years.map((y, i) => ({range: y, top: `${4 + i * band + 3}%`, height: `${band - 8}%`, left: 44, right: 8, cellSize: ['auto', 'auto'],
    itemStyle:{color: css('--raise'), borderColor: css('--surface'), borderWidth: 2}, splitLine:{show:false},
    dayLabel:{firstDay: 1, nameMap:['S','M','T','W','T','F','S'], color: css('--ink3'), fontSize: 9},
    monthLabel:{color: css('--ink2'), fontSize: 10}, yearLabel:{color: css('--ink2'), fontSize: 11, margin: 26}}));
  opt.visualMap = {min: lo, max: hi, calculable:false, orient:'horizontal', left:'center', bottom: 0, itemHeight: 140, itemWidth: 10,
    inRange:{color: ['--seq0','--seq1','--seq2','--seq3','--seq4'].map(css)}, textStyle:{color: css('--ink2'), fontSize: 11}, formatter: x => fmtVal(x, m, true)};
  opt.series = years.map((y, i) => ({type:'heatmap', coordinateSystem:'calendar', calendarIndex: i, data: data.filter(d => d[0].startsWith(y))}));
  return {opt, pick: p => [[dim, p.value[0]]], onClick: p => toggleSel(dim, p.value[0], p.multi)};
}

function gauge(v){

  const max = v.gmax > 0 ? v.gmax : niceMax(Math.max(val, target || 0));
  const ink = css('--ink'), geo = {min: 0, max, startAngle: 210, endAngle: -30, radius: '88%', center: ['50%', '60%']};
  const opt = baseOpt();
  opt.series = [{type:'gauge', ...geo, splitNumber: 4,
    progress:{show:true, width: 14, roundCap: true, itemStyle:{color: css('--s1')}},
    axisLine:{roundCap: true, lineStyle:{width: 14, color: [[1, css('--grid')]]}},
    pointer:{show:false}, axisTick:{show:false}, splitLine:{show:false},
    axisLabel:{show:false},
    anchor:{show:false},
    detail:{valueAnimation: !EXPORTING, offsetCenter:[0, '-4%'], color: ink, fontSize: 22, fontWeight: 600, fontFamily: css('--f-head'), formatter: x => fmtVal(x, m, Math.abs(x) >= 1e5)},
    title:{offsetCenter:[0, '24%'], color: css('--ink2'), fontSize: 11.5, lineHeight: 16},
    data:[{value: val, name: (target != null ? `${target ? (val / target * 100).toFixed(0) + '%' : '–'} of ${fmtVal(target, tm, true)} target` : measureLabel(m)) + `\nScale 0 to ${fmtVal(max, m, true)}`}]}];
  if (target != null) opt.series.push({type:'gauge', ...geo, axisLine:{show:false}, progress:{show:false}, axisTick:{show:false}, splitLine:{show:false}, axisLabel:{show:false}, detail:{show:false}, title:{show:false}, anchor:{show:false},
    pointer:{show:true, icon:'rect', width: 3, length: 22, offsetCenter:[0, '-72%'], itemStyle:{color: ink}}, data:[{value: Math.min(target, max)}]});
  return {opt};
}

function renderMulticard(v, body){

/* ============================== HTML visuals ============================== */
function renderKpi(v, body){
  const m = v.measures[0];
  const rows = rowsFor(v);
  const val = measureVal(m, rows);
  let html = `<div class="kpi"><div class="v" title="${esc(fmtVal(val, m))}">${esc(fmtVal(val, m, Math.abs(val) >= 1e5))}</div><div class="d"><span>${esc(measureLabel(m))}</span>`;
  let trend = null;
  if (v.dims[0] && FMAP.has(v.dims[0])){
    const g = groupRows(rows, r => keyOf(r[v.dims[0]]));
    const keys = [...g.keys()].filter(k => k !== '(Blank)').sort(labelCmp);
    trend = keys.map(k => [k, measureVal(m, g.get(k))]);
    if (trend.length >= 2){
      const last = trend[trend.length - 1][1], prev = trend[trend.length - 2][1];
      const pct = fmtKind(m) === 'percent';
      if (prev || (pct && prev != null && last != null)){
        const ch = pct ? last - prev : (last - prev) / Math.abs(prev);
        html += `<span class="${ch >= 0 ? 'up' : 'down'}">${ch >= 0 ? '▲' : '▼'} ${(Math.abs(ch) * 100).toFixed(1)}${pct ? ' pts' : '%'}</span><span>${esc(trend[trend.length - 1][0])} vs prior</span>`;
      }
    }
  }
  html += `</div>${trend && trend.length > 1 ? '<div class="spark"></div>' : ''}</div>`;
  body.innerHTML = html;
  if (trend && trend.length > 1){
    const el = $('.spark', body);
    const c = echarts.init(el, null, {renderer:'canvas'});
    charts.set(v.id, c);
    const s1 = css('--s1');
    c.setOption({animation:false, grid:{left:0,right:4,top:4,bottom:2}, xAxis:{type:'category', show:false, data: trend.map(t => t[0]), boundaryGap:false},
      yAxis:{type:'value', show:false, scale:true},
      tooltip:{trigger:'axis', confine:true, backgroundColor: css('--surface'), borderColor: css('--line2'), textStyle:{color: css('--ink'), fontSize: 11}, valueFormatter: x => fmtVal(x, m)},
      series:[{type:'line', data: trend.map(t => t[1]), showSymbol:false, lineStyle:{width:2, color:s1}, color: s1, areaStyle:{color: s1, opacity:.12},
        markPoint:{symbol:'circle', symbolSize: 7, itemStyle:{color: s1, borderColor: css('--surface'), borderWidth: 2}, label:{show:false}, data:[{coord:[trend.length - 1, trend[trend.length - 1][1]]}]}}]});
  }
}

function renderTable(v, body){
  const rows = rowsFor(v);
  const dims = v.dims, ms = v.measures;
  let data;
  if (dims.length){
    const g = groupRows(rows, r => dims.map(d => keyOf(r[d])).join('\u0001'));
    data = [...g].map(([k, rs]) => ({keys: k.split('\u0001'), vals: ms.map(m => measureVal(m, rs))}));
  } else {
    data = [{keys: [], vals: ms.map(m => measureVal(m, rows))}];
  }
  const sc = v.tsort ?? (ms.length ? dims.length : 0), dir = v.tdir ?? -1;
  data.sort((a, b) => {
    const A = sc < dims.length ? a.keys[sc] : a.vals[sc - dims.length], B = sc < dims.length ? b.keys[sc] : b.vals[sc - dims.length];
    return (sc < dims.length ? labelCmp(A, B) : (A ?? -Infinity) - (B ?? -Infinity)) * dir;
  });
  const limit = 500, shown = data.slice(0, limit);
  const maxes = ms.map((m, i) => Math.max(...data.map(d => Math.abs(d.vals[i] ?? 0))) || 1);
  const totals = ms.map(m => measureVal(m, rows));
  const arrow = i => i === sc ? (dir > 0 ? ' ↑' : ' ↓') : '';
  const own = dims[0];
  let h = `<div class="tbl-wrap"><table class="grid"><thead><tr>${dims.map((d, i) => `<th data-c="${i}">${esc(d)}${arrow(i)}</th>`).join('')}${ms.map((m, i) => `<th class="num" data-c="${i + dims.length}">${esc(measureLabel(m))}${arrow(i + dims.length)}</th>`).join('')}</tr></thead><tbody>`;
  for (const d of shown){
    const k0 = d.keys[0];
    const cls = own && S.sel[own]?.size ? (S.sel[own].has(k0) ? 'on' : 'dim') : '';
    h += `<tr class="${cls}" data-k="${esc(k0 ?? '')}">${d.keys.map(k => `<td>${esc(k)}</td>`).join('')}${d.vals.map((x, i) => `<td class="num">${v.bars && x != null ? `<span class="bar" style="width:${Math.round(40 * Math.abs(x) / maxes[i])}px"></span>` : ''}${esc(fmtVal(x, ms[i]))}</td>`).join('')}</tr>`;
  }
  h += `</tbody>${dims.length && ms.length ? `<tfoot><tr><td colspan="${dims.length}">Total${data.length > limit ? ` · first ${limit} of ${data.length.toLocaleString()} rows shown` : ''}</td>${totals.map((t, i) => `<td class="num">${esc(fmtVal(t, ms[i]))}</td>`).join('')}</tr></tfoot>` : ''}</table></div>`;
  body.innerHTML = h;
  $$('th', body).forEach(th => th.onclick = e => { e.stopPropagation(); const c = +th.dataset.c; if (v.tsort === c) v.tdir = -(v.tdir ?? -1); else { v.tsort = c; v.tdir = c < dims.length ? 1 : -1; } changed(); });
  if (own) $$('tbody tr', body).forEach(tr => {
    tr.onclick = e => { e.stopPropagation(); const multi = e.ctrlKey || e.metaKey || e.shiftKey, tg = clickTarget(v);
      if (tg && !multi) return goDetail(tg.id, [[own, tr.dataset.k]]); toggleSel(own, tr.dataset.k, multi); };
    tr.oncontextmenu = e => { e.preventDefault(); e.stopPropagation(); openMenu(e.clientX, e.clientY, v, v, [[own, tr.dataset.k]]); };
    longPress(tr, (x, y) => openMenu(x, y, v, v, [[own, tr.dataset.k]]));
  });
}

function renderMatrix(v, body, orig = v){
  const rows = rowsFor(v), rd = v.dims[0], cd = v.legend, m = v.measures[0];
  const rks = [...new Set(rows.map(r => keyOf(r[rd])))].sort(labelCmp);
  const cks = cd ? [...new Set(rows.map(r => keyOf(r[cd])))].sort(labelCmp).slice(0, 40) : [];
  const g = groupRows(rows, r => keyOf(r[rd]) + '\u0001' + (cd ? keyOf(r[cd]) : ''));
  const byRow = groupRows(rows, r => keyOf(r[rd]));
  const byCol = cd ? groupRows(rows, r => keyOf(r[cd])) : new Map();
  const cell = (rk, ck) => { const rs = g.get(rk + '\u0001' + ck); return rs ? measureVal(m, rs) : null; };
  let lo = Infinity, hi = -Infinity;
  if (cd) for (const rk of rks) for (const ck of cks){ const x = cell(rk, ck); if (x != null){ lo = Math.min(lo, x); hi = Math.max(hi, x); } }
  const shade = x => { if (x == null || !v.heat || !(hi > lo)) return ''; const t = (x - lo) / (hi - lo); return `background:${rgba(css('--s1'), (0.08 + t * 0.5).toFixed(3))}`; };
  const sel = S.sel[rd];
  let h = `<div class="tbl-wrap"><table class="grid"><thead><tr><th>${esc(rd)}${cd ? ' / ' + esc(cd) : ''}</th>${cks.map(c => `<th class="num">${esc(c)}</th>`).join('')}<th class="num">${cd ? 'Total' : esc(measureLabel(m))}</th></tr></thead><tbody>`;
  for (const rk of rks){
    const cls = sel?.size ? (sel.has(rk) ? 'on' : 'dim') : '';
    h += `<tr class="${cls}" data-k="${esc(rk)}"><td>${esc(rk)}</td>${cks.map(ck => { const x = cell(rk, ck); return `<td class="num" style="${shade(x)}">${esc(fmtVal(x, m))}</td>`; }).join('')}<td class="num"><b>${esc(fmtVal(measureVal(m, byRow.get(rk)), m))}</b></td></tr>`;
  }
  h += `</tbody><tfoot><tr><td>Total</td>${cks.map(ck => `<td class="num">${esc(fmtVal(measureVal(m, byCol.get(ck)), m))}</td>`).join('')}<td class="num">${esc(fmtVal(measureVal(m, rows), m))}</td></tr></tfoot></table></div>`;
  body.innerHTML = h;
  $$('tbody tr', body).forEach(tr => {
    tr.onclick = e => { e.stopPropagation(); const multi = e.ctrlKey || e.metaKey || e.shiftKey;
      if (orig.drillMode && canDrill(orig) && level(orig) < orig.dims.length - 1) return drillDown(orig, tr.dataset.k);
      const tg = clickTarget(orig); if (tg && !multi) return goDetail(tg.id, [...(v._drill || []), [rd, tr.dataset.k]]);
      toggleSel(rd, tr.dataset.k, multi); };
    tr.oncontextmenu = e => { e.preventDefault(); e.stopPropagation(); openMenu(e.clientX, e.clientY, orig, v, [[rd, tr.dataset.k]]); };
    longPress(tr, (x, y) => openMenu(x, y, orig, v, [[rd, tr.dataset.k]]));
    tr.ondblclick = e => { e.stopPropagation(); drillDown(orig, tr.dataset.k); };
  });
}

function renderSlicer(v, body){
  const f = v.dims[0];
  const all = groupRows(ROWS, r => keyOf(r[f]));
  const avail = groupRows(rowsFor(v), r => keyOf(r[f]));
  const keys = [...all.keys()].sort(labelCmp);
