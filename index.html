  const q = (v._q || '').toLowerCase();
  body.innerHTML = `<div class="slicer">${keys.length > 8 ? `<input type="search" placeholder="Search ${esc(f)}" value="${esc(v._q || '')}" aria-label="Search values">` : ''}<ul>${
    keys.filter(k => !q || k.toLowerCase().includes(q)).map(k => `<li class="${sel?.has(k) ? 'on' : ''} ${avail.has(k) ? '' : 'excluded'}" data-k="${esc(k)}"><span class="box"></span><span>${esc(k)}</span><span class="n">${(avail.get(k)?.length || 0).toLocaleString()}</span></li>`).join('')
  }</ul></div>`;
  $$('li', body).forEach(li => li.onclick = e => { e.stopPropagation(); toggleSel(f, li.dataset.k, true); });
  const inp = $('input', body);
  if (inp){ inp.onclick = e => e.stopPropagation(); inp.oninput = () => { v._q = inp.value; renderSlicer(v, body); const n = $('input', body); n.focus(); n.setSelectionRange(n.value.length, n.value.length); }; }
}

/* ============================== rendering ============================== */
const page = () => S.pages[S.pageIdx];
const findVisual = id => page()?.visuals.find(v => v.id === id);

function missingFields(v){
  const used = [...(v.dims || []), v.legend, ...(v.measures || []).map(m => m.f), ...(v.vfilters || []).map(x => x[0])].filter(Boolean);
  return used.filter(f => !FMAP.has(f));
}
function renderVisual(v, card){
  const body = $('.card-b', card);
  const old = charts.get(v.id);
  const drop = () => { if (charts.has(v.id)){ charts.get(v.id).dispose(); charts.delete(v.id); } };
  if (!CHART_TYPES.includes(v.type)) drop();
  const ev = effective(v);
  $('.card-h .t', card).textContent = v.title || autoTitle(ev);
  renderDrillUi(v, card);
  const miss = missingFields(v);
  if (miss.length){ drop(); body.innerHTML = `<div class="empty-v">This visual uses ${miss.map(esc).join(', ')}, which ${miss.length > 1 ? 'are' : 'is'} not in “${esc(S.active)}”.</div>`; return; }
  if (v.type === 'text'){ body.innerHTML = `<div class="empty-v" style="place-items:start;text-align:left;color:var(--ink);font-size:13px;line-height:1.5;white-space:pre-wrap">${esc(v.text || 'Double-click to add a note.')}</div>`; return; }
  const t = TYPES[v.type];
  const need = [];
  if (t.wells.dims && v.type !== 'kpi' && !v.dims.length && v.type !== 'table') need.push(t.wells.dims[0]);
  if (t.wells.measures && !v.measures.length && v.type !== 'table') need.push(t.wells.measures[0]);
  if (v.type === 'table' && !v.dims.length && !v.measures.length) need.push('Columns or Values');
  if (need.length){ drop(); body.innerHTML = `<div class="empty-v">Add a field to ${need.map(n => `<b>${esc(n)}</b>`).join(' and ')}.<br>Drag one from Fields, or select this visual and click a field.</div>`; return; }
  if (v.type === 'kpi') return renderKpi(ev, body);
  if (v.type === 'multicard') return renderMulticard(ev, body);
  if (v.type === 'table') return renderTable(ev, body);
  if (v.type === 'matrix') return renderMatrix(ev, body, v);
  if (v.type === 'slicer') return renderSlicer(ev, body);
  const BUILD = {column:cartesian, stacked:cartesian, stacked100:cartesian, bar:cartesian, stackedbar:cartesian, line:cartesian, area:cartesian,
    waterfall, pie:categorical, donut:categorical, treemap:categorical, funnel:categorical, sunburst, scatter, heatmap, histogram, boxplot, radar, sankey, calendar, gauge};
  let res;
  try { res = BUILD[v.type](ev); }
  catch (e){ console.error(e); res = {msg: 'This visual could not be drawn: ' + e.message}; }
  if (!res){ drop(); body.innerHTML = `<div class="empty-v">No data for the current selections.</div>`; return; }
  if (res.msg){ drop(); body.innerHTML = `<div class="empty-v">${esc(res.msg)}</div>`; return; }
  let c = old && !old.isDisposed() && body.contains(old.getDom()) ? old : null;
  if (!c){ drop(); body.innerHTML = '<div class="chart"></div>'; c = echarts.init($('.chart', body), null, {renderer:'canvas'}); }
  else { ['click', 'dblclick', 'contextmenu', 'mousedown', 'mouseup', 'globalout'].forEach(n => c.off(n)); }
  c.setOption(res.opt, true);
  const deeper = () => canDrill(v) && level(v) < v.dims.length - 1;
  c.on('click', p => {
    if (lpFired){ lpFired = false; return; }
    const e = p.event?.event; p.multi = !!(e && (e.ctrlKey || e.metaKey || e.shiftKey));
    if (v.drillMode && deeper() && p.name != null && p.seriesName !== '__base'){ const nm = p.name; setTimeout(() => drillDown(v, nm), 0); return; }
    const tg = clickTarget(v), f = res.pick ? res.pick(p) : null;
    if (tg && !p.multi && f && f.length){ setTimeout(() => goDetail(tg.id, [...(ev._drill || []), ...f]), 0); return; }
    res.onClick && res.onClick(p);
  });
  c.on('contextmenu', p => {
    const e = p.event?.event; if (!e) return;
    e.preventDefault?.();
    const f = res.pick ? res.pick(p) : null;
    if (f && f.length) openMenu(e.clientX, e.clientY, v, ev, f);
  });
  let lpTimer = null, lpFired = false;
  c.on('mousedown', p => {
    const e = p.event?.event; const t = e?.touches?.[0] || e?.changedTouches?.[0];
    if (!t) return;                                   // touch only; mice use right-click
    clearTimeout(lpTimer); lpFired = false;
    const x = t.clientX, y = t.clientY;
    lpTimer = setTimeout(() => { const f = res.pick ? res.pick(p) : null; if (f && f.length){ lpFired = true; navigator.vibrate?.(12); openMenu(x, y, v, ev, f); } }, 550);
  });
  c.on('mouseup', () => clearTimeout(lpTimer));
  c.on('globalout', () => clearTimeout(lpTimer));
  c.on('dblclick', p => { if (deeper() && p.name != null){ const nm = p.name; setTimeout(() => drillDown(v, nm), 0); } });
  charts.set(v.id, c);
}
function renderDrillUi(v, card){
  const dr = $('.drill', card), cr = $('.crumbs', card);
  const tg = clickTarget(v), drill = canDrill(v);
  let crumbs = '';
  if (drill){
    const L = level(v), max = v.dims.length - 1;
    dr.hidden = false;
    dr.innerHTML = `<button class="ib" data-act="up" type="button" ${L ? '' : 'disabled'} title="Drill up" aria-label="Drill up"><svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M8 13V3M4 7l4-4 4 4"/></svg></button>
      <button class="ib ${v.drillMode ? 'on' : ''}" data-act="dmode" type="button" aria-pressed="${!!v.drillMode}" title="Drill mode: ${v.drillMode ? 'on' : 'off'}. When on, clicking a data point drills into it. Double-click always drills." aria-label="Toggle drill mode"><svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="8" cy="8" r="6"/><path d="M8 5v6M5.5 8.5L8 11l2.5-2.5"/></svg></button>
      <button class="ib" data-act="next" type="button" ${L < max ? '' : 'disabled'} title="Go to the next level for all values" aria-label="Next level"><svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M4 3l4 4 4-4M4 9l4 4 4-4"/></svg></button>`;
    crumbs = v.dims.slice(0, L + 1).map((d, i) => i < L ? `${esc(shortName(d))}: <b>${esc(v.path?.[i] ?? 'All')}</b>` : `<b>${esc(shortName(d))}</b>`).join(' › ')
      + (L < max ? ` <span>· next: ${esc(shortName(v.dims[L + 1]))}</span>` : '');
  } else { dr.hidden = true; dr.innerHTML = ''; }
  if (v.vfilters?.length) crumbs += `${crumbs ? ' · ' : ''}Filter: ${v.vfilters.map(([f, vals]) => `${esc(shortName(f))} = <b>${esc(vals.join(', '))}</b>`).join('; ')}`;
  if (tg) crumbs += `${crumbs ? ' · ' : ''}<span class="go">↗ Click a value to open ${esc(tg.name)}</span>`;
  cr.hidden = !crumbs; cr.innerHTML = crumbs;
}

/* ---- drill-through: open another page filtered to the clicked value ---- */
const CLICKABLE = ['column','stacked','stacked100','bar','stackedbar','line','area','waterfall','pie','donut','treemap','sunburst','funnel','scatter','heatmap','boxplot','radar','sankey','calendar','table','matrix'];
function clickTarget(v){ return v.clickAction ? S.pages.find(pg => pg.id === v.clickAction && pg.id !== S.pages[S.pageIdx]?.id) || null : null; }
function goDetail(pageId, filters){
  const i = S.pages.findIndex(pg => pg.id === pageId); if (i < 0) return;
  closeMenu();
  S.dt = {pageId, from: page().id, filters: filters.filter(f => f[0] && f[1] != null && f[1] !== 'Other' && f[1] !== 'Total').map(([f, val]) => [f, String(val)])};
  S.pageIdx = i; S.selected = null;
  renderAll(); $('#canvasWrap').scrollTop = 0;
}
function dtBanner(){
  if (!S.dt || page()?.id !== S.dt.pageId) return '';
  const from = S.pages.find(pg => pg.id === S.dt.from);
  const what = S.dt.filters.map(([f, val]) => `<b>${esc(shortName(f))}</b>: ${esc(val)}`).join(' · ') || 'all values';
  return `${from ? `<button class="btn sm" id="dtBack" type="button">← Back to ${esc(from.name)}</button>` : ''}<span class="chip dt"><span>Details for ${what}</span><button type="button" id="dtClear" aria-label="Clear detail filter" title="Show all rows on this page">×</button></span>`;
}
function closeMenu(){ $('.ctx')?.remove(); }
function hideTips(){ charts.forEach(c => { try { c.dispatchAction({type: 'hideTip'}); } catch {} }); }
function longPress(el, fn){
  let t, fired = false;
  el.addEventListener('touchstart', e => { const p = e.touches[0]; fired = false; clearTimeout(t); t = setTimeout(() => { fired = true; navigator.vibrate?.(12); fn(p.clientX, p.clientY); }, 550); }, {passive: true});
  ['touchend', 'touchmove', 'touchcancel'].forEach(n => el.addEventListener(n, () => clearTimeout(t), {passive: true}));

function openMenu(x, y, v, ev, filters){
  closeMenu(); hideTips();
  const label = filters.map(([, val]) => val).join(' · ');
  const L = level(v), deeper = canDrill(v) && L < v.dims.length - 1;
  const others = S.pages.filter(pg => pg.id !== page().id);
  const m = document.createElement('div');
  m.className = 'ctx'; m.setAttribute('role', 'menu');
  m.innerHTML = `<div class="h">${esc(label)}</div>
    <button type="button" role="menuitem" data-m="filter">Filter the report to this value</button>
    ${deeper ? `<button type="button" role="menuitem" data-m="down">Drill down to ${esc(shortName(v.dims[L + 1]))}</button>` : ''}
    ${canDrill(v) && L ? `<button type="button" role="menuitem" data-m="up">Drill up</button>` : ''}
    <button type="button" role="menuitem" data-m="rows">See the data rows</button>
    ${others.length ? `<hr><div class="h">Show details on</div>${others.map(pg => `<button type="button" role="menuitem" data-pg="${esc(pg.id)}">${esc(pg.name)}${pg.id === v.clickAction ? ' (default)' : ''}</button>`).join('')}` : ''}`;
  document.body.append(m);
  const r = m.getBoundingClientRect();
  m.style.left = clamp(x, 8, innerWidth - r.width - 8) + 'px'; m.style.top = clamp(y, 8, innerHeight - r.height - 8) + 'px';
  const all = [...(ev._drill || []), ...filters];
  m.addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    closeMenu();
    if (b.dataset.pg) return goDetail(b.dataset.pg, all);
    const k = b.dataset.m;
    if (k === 'filter'){ S.sel = {...S.sel}; for (const [f, val] of filters){ S.sel[f] = new Set([val]); } renderAll(); }
    if (k === 'down') drillDown(v, filters[0][1]);
    if (k === 'up') drillUp(v);
    if (k === 'rows') openData('table', all);
  });
  m.querySelector('button')?.focus();
}
document.addEventListener('pointerdown', e => { if (!e.target.closest('.ctx, #btnReports')) closeMenu(); });
window.addEventListener('blur', closeMenu);

function autoTitle(v){
  const t = TYPES[v.type];
  if (v.type === 'slicer') return v.dims[0] || 'Slicer';
  if (v.type === 'text') return 'Note';
  if (!v.measures.length && !v.dims.length) return t.label;
  const ms = v.measures.map(measureLabel).join(', ');
  const by = [v.dims[0], v.legend].filter(Boolean);
  if (['kpi','gauge','multicard','histogram'].includes(v.type)) return ms || t.label;
  if (v.type === 'scatter') return v.measures.slice(0, 2).map(measureLabel).join(' vs ') + (v.dims[0] ? ' by ' + v.dims[0] : '');
  return (ms || 'Rows') + (by.length ? ' by ' + by.join(' and ') : '');
}

function cardEl(v){
  const el = document.createElement('div');

function applyGrid(el, v){ el.style.setProperty('--span', clamp(v.w || 4, 2, 12)); el.style.gridColumn = `span ${clamp(v.w || 4, 2, 12)}`; el.style.gridRow = `span ${clamp(v.h || 4, 2, 12)}`; }

function renderCanvas(){
  const cv = $('#canvas');
  const p = page();
  const ids = new Set(p.visuals.map(v => v.id));
  for (const [id, c] of charts) if (!ids.has(id)){ c.dispose(); charts.delete(id); }
  $$('.card', cv).forEach(el => { if (!ids.has(el.dataset.id)) el.remove(); });
  $('.empty-canvas', cv)?.remove();
  let prev = null;
  for (const v of p.visuals){
    let el = $(`.card[data-id="${v.id}"]`, cv);
    if (!el){ el = cardEl(v); bindCard(el); }
    if (prev ? prev.nextElementSibling !== el : cv.firstElementChild !== el) prev ? prev.after(el) : cv.prepend(el);
    applyGrid(el, v);
    el.classList.toggle('sel', S.selected === v.id);
    renderVisual(v, el);
    prev = el;
  }
  if (!p.visuals.length){
    cv.insertAdjacentHTML('beforeend', `<div class="empty-canvas"><div><p style="font-family:var(--f-head);font-size:16px;color:var(--ink);margin:0 0 6px">This page is empty</p><p class="hint" style="margin:0">Drag a field here to start a visual, click <b>Visual</b> to add one, or use <b>Auto-build</b> for a starter layout.</p></div></div>`);

  const item = (f, cls = '') => {

/* ============================== visual ops ============================== */
function newVisual(type, extra = {}){
  const size = {kpi:[3,2], slicer:[3,4], table:[6,5], matrix:[6,5], text:[4,2], line:[8,4], area:[8,4], calendar:[12,4], gauge:[3,3], multicard:[6,2], sankey:[6,5], sunburst:[4,5], radar:[4,5], boxplot:[6,4], histogram:[6,4], waterfall:[6,4]}[type] || [4,4];
  return {id: uid(), type, title:'', dims:[], legend:null, measures:[], w:size[0], h:size[1], ...extra};
}
function addVisual(type, extra){
  const v = newVisual(type, extra);
  page().visuals.push(v);
  S.selected = v.id;
  changed();
  openDrawer('buildPane');
  requestAnimationFrame(() => $(`.card[data-id="${v.id}"]`)?.scrollIntoView({block:'nearest', behavior:'smooth'}));
  return v;
}
function addFieldTo(v, fname, wellHint){
  if (!canEdit()) return;
  const fd = FMAP.get(fname); if (!fd) return;
  const t = TYPES[v.type];
  let well = wellHint;
  if (!well){
    if (fd.role === 'measure' && t.wells.measures) well = 'measures';
    else if (fd.role === 'dim' && t.wells.dims) well = (v.dims.length >= (t.drill ? 1 : t.wells.dims[1]) && t.wells.legend && !v.legend) ? 'legend' : 'dims';
    else well = t.wells.measures ? 'measures' : t.wells.dims ? 'dims' : null;
  }
  if (!well || !t.wells[well]){ toast(`${t.label} has no place for that field.`); return; }
  const max = t.wells[well][1];
  if (well === 'dims' && t.drill && fd.type === 'date' && fd.src === 'col' && !v.dims.length){
    v.dims = DATE_HIER.map(p => `${fname} (${p})`); v.level = 0; v.path = [];
    changed(); toast('Added a Year › Quarter › Month › Day hierarchy. Double-click a point, or use the drill buttons on the card.');
    return;
  }
  if (well === 'measures'){
    const m = {f: fname, agg: defaultAgg(fname)};
    if (v.measures.length >= max) v.measures[max - 1] = m; else v.measures.push(m);
  } else if (well === 'legend') v.legend = fname;
  else {
    if (v.dims.includes(fname)) return;
    if (v.dims.length >= max) v.dims[max - 1] = fname; else v.dims.push(fname);
  }
  changed();
}
function quickVisual(f){
  if (!canEdit()) return;
  const fd = FMAP.get(f);
  if (fd.role === 'measure') return addVisual('kpi', {measures:[{f, agg: defaultAgg(f)}]});
  if (fd.type === 'date') return addVisual('column', {dims: DATE_HIER.map(p => `${f} (${p})`), measures:[{f: RECORDS, agg:'count'}], drillMode: true});
  addVisual(fd.src === 'part' ? 'line' : 'column', {dims:[f], measures:[{f: RECORDS, agg:'count'}]});
}
function deletePage(i){
  if (S.pages.length < 2 || !S.pages[i]) return;
  commit();
  const [pg] = S.pages.splice(i, 1);
  if (S.dt && (S.dt.pageId === pg.id || S.dt.from === pg.id)) S.dt = null;
  if (S.pageIdx >= i && S.pageIdx > 0) S.pageIdx--;
  S.pageIdx = clamp(S.pageIdx, 0, S.pages.length - 1); S.selected = null;
  renderAll();
  toast(`Deleted page “${pg.name}” and its ${pg.visuals.length} visual${pg.visuals.length === 1 ? '' : 's'}.`, 'Undo', undo);
}
function removeVisual(id){
  if (!canEdit()) return;
  const p = page(); const i = p.visuals.findIndex(v => v.id === id); if (i < 0) return;
  const [v] = p.visuals.splice(i, 1);
  if (S.selected === id) S.selected = null;
  changed();
  toast(`Removed “${v.title || autoTitle(v)}”.`, 'Undo', () => { p.visuals.splice(i, 0, v); changed(); });
}
function dupVisual(id){
  const p = page(); const i = p.visuals.findIndex(v => v.id === id); if (i < 0) return;
  const c = JSON.parse(JSON.stringify(p.visuals[i])); c.id = uid(); c.title = c.title ? c.title + ' (copy)' : '';
  p.visuals.splice(i + 1, 0, c); S.selected = c.id; changed();
}

/* ============================== events ============================== */
let dragCard = null;
function bindCard(el){
  const id = el.dataset.id;
  el.addEventListener('click', e => {
    const act = e.target.closest('[data-act]')?.dataset.act;
    if (act === 'del') return removeVisual(id);
    if (act === 'dup') return dupVisual(id);
    if (act === 'focus') return toggleFocus(el);
    const dv = findVisual(id);
    if (act === 'up') return drillUp(dv);
    if (act === 'next') return drillNext(dv);
    if (act === 'dmode'){ dv.drillMode = !dv.drillMode; return changed(); }
    if (S.selected !== id){ S.selected = id; $$('.card').forEach(c => c.classList.toggle('sel', c.dataset.id === id)); renderBuild(); }
  });
  el.addEventListener('dblclick', e => { const v = findVisual(id); if (v?.type === 'text'){ S.selected = id; renderBuild(); openDrawer('buildPane'); $('#o-text')?.focus(); } });
  const t = $('.card-h .t', el);
  t.addEventListener('dragstart', e => { dragCard = id; e.dataTransfer.setData('text/plain', 'card:' + id); e.dataTransfer.effectAllowed = 'move'; });
  t.addEventListener('dragend', () => { dragCard = null; $$('.card').forEach(c => c.classList.remove('drag-over')); });
  el.addEventListener('dragover', e => {
    e.preventDefault();
    if (dragCard && dragCard !== id) el.classList.add('drag-over');
    else if (!dragCard) el.classList.add('field-over');
  });
  el.addEventListener('dragleave', () => el.classList.remove('drag-over', 'field-over'));
  el.addEventListener('drop', e => {
    e.preventDefault(); e.stopPropagation();
    el.classList.remove('drag-over', 'field-over');
    const d = e.dataTransfer.getData('text/plain');
    const p = page();
    if (d.startsWith('card:')){
      const from = p.visuals.findIndex(v => v.id === d.slice(5)), to = p.visuals.findIndex(v => v.id === id);
      if (from < 0 || from === to) return;
      const [mv] = p.visuals.splice(from, 1); p.visuals.splice(p.visuals.findIndex(v => v.id === id), 0, mv); changed();
    } else if (d.startsWith('field:')){
      const v = findVisual(id); S.selected = id; addFieldTo(v, d.slice(6));
    }
  });
  // resize
  const rz = $('.resize', el);
  rz.addEventListener('pointerdown', e => {
    e.preventDefault(); e.stopPropagation();
    const v = findVisual(id); const cv = $('#canvas');
    const colW = (cv.clientWidth - 11 * 8) / 12 + 8, rowH = 72 + 8;
    const sx = e.clientX, sy = e.clientY, sw = v.w, sh = v.h;
    rz.setPointerCapture(e.pointerId);
    const move = ev => {
      const w = clamp(Math.round(sw + (ev.clientX - sx) / colW), 2, 12), h = clamp(Math.round(sh + (ev.clientY - sy) / rowH), 2, 12);
      if (w !== v.w || h !== v.h){ v.w = w; v.h = h; applyGrid(el, v); }
    };
    const up = () => { rz.removeEventListener('pointermove', move); rz.removeEventListener('pointerup', up); renderBuild(); save(); };
    rz.addEventListener('pointermove', move); rz.addEventListener('pointerup', up);
  });
}

const ro = new ResizeObserver(entries => { for (const en of entries){ const id = en.target.closest('.card')?.dataset.id; charts.get(id)?.resize(); } });
new MutationObserver(muts => { for (const m of muts) m.addedNodes.forEach(n => { if (n.classList?.contains('card')) ro.observe($('.card-b', n)); }); }).observe($('#canvas'), {childList:true});

/* ---- import readers: each returns a list of {name, get()} tables (sheets) ---- */
function uniqueNames(arr){ const seen = {}; return arr.map((h, i) => { h = String(h ?? '').replace(/\s+/g, ' ').trim() || 'Column ' + (i + 1); seen[h] = (seen[h] || 0) + 1; return seen[h] > 1 ? `${h} ${seen[h]}` : h; }); }
function cellOut(c){
  if (c instanceof Date) return isNaN(c) ? '' : `${c.getFullYear()}-${String(c.getMonth() + 1).padStart(2, '0')}-${String(c.getDate()).padStart(2, '0')}`;
  return c == null ? '' : c;
}
function aoaToTable(aoa){
  const rows = aoa.map(r => (r || []).map(cellOut));
  const filled = r => r.filter(c => c !== '' && c != null).length;
  const widest = Math.max(0, ...rows.map(filled));
  if (widest < 1) throw new Error('No table found.');
  const hi = rows.findIndex(r => filled(r) >= Math.max(1, Math.ceil(widest * 0.6)));
  const width = Math.max(...rows.slice(hi).map(r => r.length));
  let names = uniqueNames(Array.from({length: width}, (_, i) => rows[hi][i]));
  let records = rows.slice(hi + 1).filter(r => filled(r) > 0).map(r => Object.fromEntries(names.map((n, i) => [n, r[i] ?? ''])));
  const keep = names.filter((n, i) => String(rows[hi][i] ?? '').trim() !== '' || records.some(r => r[n] !== '' && r[n] != null));
  if (keep.length < names.length){ names = keep; records = records.map(r => Object.fromEntries(keep.map(n => [n, r[n]]))); }
  if (!records.length) throw new Error('The table has a header row but no data rows.');
  return {names, records};
}
async function readAnyFile(f){
  const ext = (f.name.split('.').pop() || '').toLowerCase();
  if (['xlsx','xls','xlsm','xlsb','ods'].includes(ext)){
    await loadLib('xlsx');
    const wb = XLSX.read(await f.arrayBuffer(), {cellDates: true});
    const sheets = wb.SheetNames.map(n => ({name: n, get: () => aoaToTable(XLSX.utils.sheet_to_json(wb.Sheets[n], {header: 1, defval: '', raw: true, blankrows: false}))}));
    const ok = sheets.filter(sh => { try { sh.get(); return true; } catch { return false; } });
    if (!ok.length) throw new Error('none of the sheets contain a table.');
    return ok;
  }
  if (ext === 'pdf'){ const t = await pdfToTable(await f.arrayBuffer()); return [{name: 'Table from PDF', get: () => t}]; }
  if (ext === 'html' || ext === 'htm') return htmlTables(await f.text());
  const text = await f.text();
  return [{name: f.name, get: () => parseAny(text, f.name)}];
}
function htmlTables(text){
  const doc = new DOMParser().parseFromString(text, 'text/html');
  const tables = [...doc.querySelectorAll('table')].map((t, i) => ({rows: [...t.rows].map(tr => [...tr.cells].map(td => td.textContent.trim())), i}))
    .filter(t => t.rows.length > 1).sort((a, b) => b.rows.length - a.rows.length);
  if (!tables.length) throw new Error('no tables were found in that page.');
  return tables.map(t => ({name: `Table ${t.i + 1} (${t.rows.length - 1} rows)`, get: () => aoaToTable(t.rows)}));
}
/* PDF: rebuild rows from text positions. Works on text-based PDFs with a table; scanned images have no text to read. */
async function pdfToTable(buf){
  await loadLib('pdfjs');
  const lib = window.pdfjsLib || window['pdfjs-dist/build/pdf'];
  lib.GlobalWorkerOptions.workerSrc = LIBS.pdfjs[1];
  const doc = await lib.getDocument({data: new Uint8Array(buf), isEvalSupported: false}).promise;
  // Each text run is split into words with positions estimated from character offsets, because PDF writers
  // often merge several table cells into one run. Words are then placed under the nearest header column.
  const lines = [];
  for (let pg = 1; pg <= Math.min(doc.numPages, 300); pg++){
    const page = await doc.getPage(pg);
    const tc = await page.getTextContent();
    const items = tc.items.filter(it => it.str && it.str.trim()).map(it => ({x: it.transform[4], y: it.transform[5], w: it.width, h: Math.abs(it.transform[3]) || 8, s: it.str}));
    items.sort((a, b) => b.y - a.y || a.x - b.x);
    const pageLines = [];
    for (const it of items){
      const ln = pageLines.find(l => Math.abs(l.y - it.y) <= Math.max(2, it.h * 0.35));
      ln ? ln.items.push(it) : pageLines.push({y: it.y, items: [it]});
    }
    for (const ln of pageLines){
      ln.items.sort((a, b) => a.x - b.x);
      const words = [], cells = [];
      for (const it of ln.items){
        const len = it.s.length || 1;
        for (const mt of it.s.matchAll(/\S+/g)) words.push({s: mt[0], x0: it.x + it.w * mt.index / len, x1: it.x + it.w * (mt.index + mt[0].length) / len});
        const last = cells[cells.length - 1];
        if (last && it.x - last.x1 < Math.max(3, it.h * 0.6)){ last.s += ' ' + it.s; last.x1 = it.x + it.w; }
        else cells.push({x0: it.x, x1: it.x + it.w, s: it.s});
      }
      cells.forEach(c => c.s = c.s.replace(/\s+/g, ' ').trim());
      lines.push({page: pg, words, cells: cells.filter(c => c.s)});
    }
  }
  if (!lines.some(l => l.words.length)) throw new Error('no text found in this PDF. Scanned PDFs need to be converted with OCR first.');
  // header: the line with the most separate cells near the top, preferring text over numbers
  const isNum = t => /^[-+($]*[\d.,]+%?\)?$/.test(t);
  let hIdx = -1, bestScore = 1;
  lines.slice(0, 60).forEach((l, i) => { const n = l.cells.length; const textual = l.cells.filter(c => !isNum(c.s)).length;
    const score = n + textual * 0.01; if (n >= 2 && textual >= n * 0.6 && score > bestScore){ bestScore = score; hIdx = i; } });
  if (hIdx < 0) throw new Error('no table header was found in this PDF.');
  const header = lines[hIdx].cells, ncol = header.length;
  const centers = header.map(c => (c.x0 + c.x1) / 2), headTxt = header.map(c => c.s).join(' ');
  const aoa = [header.map(c => c.s)];
  for (const l of lines.slice(hIdx + 1)){
    if (l.words.map(w => w.s).join(' ') === headTxt) continue;  // header repeated on a later page
    const row = new Array(ncol).fill('');
    for (const w of l.words){
      const mid = (w.x0 + w.x1) / 2; let k = 0, bd = Infinity;
      centers.forEach((x, i) => { const d = Math.abs(x - mid); if (d < bd){ bd = d; k = i; } });
      row[k] = row[k] ? row[k] + ' ' + w.s : w.s;
    }
    if (row.filter(Boolean).length >= Math.max(2, Math.ceil(ncol * 0.4))) aoa.push(row);
  }
  return aoaToTable(aoa);
}
function showPreview(box, sheets, baseName, source = null){
  let idx = 0;
  const draw = () => {
    let cur;
    try { cur = sheets[idx].get(); } catch (e){ box.innerHTML = `<p class="err">Could not read ${esc(sheets[idx].name)}: ${esc(e.message)}</p>`; return; }
    const cols = inferColumns(cur.names, cur.records);
    const tl = {string:'Text', number:'Number', date:'Date'};
    const dflt = sheets.length > 1 ? `${baseName} – ${sheets[idx].name}` : baseName;
    box.innerHTML = `<div class="prev-h">${sheets.length > 1 ? `<label>Sheet <select id="pSheet">${sheets.map((sh, i) => `<option value="${i}" ${i === idx ? 'selected' : ''}>${esc(sh.name)}</option>`).join('')}</select></label>` : ''}<span><b>${cur.records.length.toLocaleString()}</b> rows · <b>${cols.length}</b> columns · first 8 rows shown</span></div>
      <div class="preview"><table class="grid"><thead><tr>${cols.map(c => `<th>${esc(c.name)} <span class="tag">${tl[c.type]}</span></th>`).join('')}</tr></thead>
      <tbody>${cur.records.slice(0, 8).map(r => `<tr>${cols.map(c => `<td class="${c.type === 'number' ? 'num' : ''}">${esc(r[c.name])}</td>`).join('')}</tr>`).join('')}</tbody></table></div>
      <div class="form-row"><input type="text" id="pName" value="${esc(dflt)}" aria-label="Dataset name" style="flex:1 1 200px">
      <label style="display:flex;gap:6px;align-items:center"><input type="checkbox" id="pNew" checked> Open in a new report</label>
      <label style="display:flex;gap:6px;align-items:center"><input type="checkbox" id="pAuto" checked> Build a starter page</label>
      <button class="btn primary" id="pGo" type="button">Load ${cur.records.length.toLocaleString()} rows</button><button class="btn ghost" id="pCancel" type="button">Cancel</button></div>`;
    $('#pSheet')?.addEventListener('change', e => { idx = +e.target.value; draw(); });
    $('#pCancel').onclick = () => { box.innerHTML = ''; };
    $('#pGo').onclick = () => {
      const n = loadDataset($('#pName').value || dflt, cur.names, cur.records);
      if (source) S.datasets[n].source = {...source, refreshed: new Date().toISOString()};
      const auto = $('#pAuto').checked, fresh = $('#pNew').checked;
      const prevName = curReport()?.name;
      closeModal();
      if (fresh){
        newReport(n, n, []);
        if (auto){ autoBuild(); S.pages = S.pages.filter(pg => pg.visuals.length); S.pageIdx = 0; renderAll(); }
        else { S.pages = [{id: uid(), name: 'Page 1', visuals: []}]; S.pageIdx = 0; renderAll(); }
        HIST.stack = []; HIST.i = -1; commit();
      } else {
        S.active = n; S.sel = {}; buildModel();
        if (auto) autoBuild(); else renderAll();
      }
      const big = JSON.stringify(cur.records).length > 4e6;
      toast(fresh ? `Opened “${n}” as a new report. “${prevName}” is unchanged; switch back from the report menu next to the logo.`
        : `Loaded ${cur.records.length.toLocaleString()} rows into “${n}”.`, big ? null : null);
      if (big) setTimeout(() => toast('This file is large and may not be kept after you close this tab.'), 5200);
    };
  };
  draw();
}

async function gw(path, body){
  if (SRV.on) return body ? api('POST', 'gateway' + path, body) : api('GET', 'gateway' + path);
  if (!GW.url) throw new Error('Connect to your gateway first.');
  let r;
  try {
    r = await fetch(GW.url.replace(/\/+$/, '') + path, {method: body ? 'POST' : 'GET',
      headers: {Authorization: 'Bearer ' + GW.key, ...(body ? {'Content-Type': 'application/json'} : {})}, body: body ? JSON.stringify(body) : undefined});
  } catch { throw new Error(IN_CLAUDE ? 'Live connections only work in the self-hosted version of Basira.' : `Could not reach the gateway at ${GW.url}. Check it is running and that this site is in its ALLOWED_ORIGINS.`); }
  const j = await r.json().catch(() => ({error: `The gateway replied ${r.status}.`}));
  if (!r.ok || j.error) throw new Error(j.error || `The gateway replied ${r.status}.`);
  return j;
}
async function connectGateway(){
  SRC.state = 'busy'; SRC.msg = 'Connecting…'; drawGwState();
  try {
    if (!SRV.on) await gw('/health');
    const j = await gw('/connections');
    SRC.conns = j.connections || []; SRC.tables = {};
    SRC.state = 'ok'; SRC.msg = `Connected · ${SRC.conns.length} connection${SRC.conns.length === 1 ? '' : 's'} available`;
  } catch (e){ SRC.state = 'bad'; SRC.msg = e.message; SRC.conns = []; }
  drawGwState(); drawSrc();
}

async function runSource(m){
  if (m.kind === 'web'){
    let r;
    try { r = await fetch(m.url); } catch { throw new Error(IN_CLAUDE ? 'Inside Claude, pages cannot load data from other sites. Use the self-hosted version.' : 'The site did not allow Basira to read it (CORS), or it could not be reached.'); }
    if (!r.ok) throw new Error(`The site replied ${r.status} ${r.statusText}.`);
    return parseAny(await r.text(), new URL(m.url).pathname);
  }
  const j = await gw('/query', m.table ? {connection: m.connection, table: m.table, limit: m.limit} : {connection: m.connection, query: m.query, limit: m.limit});
  if (!j.rows.length) throw new Error('The query returned no rows.');
  const names = j.columns;
  return {names, records: j.rows.map(r => Object.fromEntries(names.map(n => [n, r[n] ?? '']))), truncated: j.truncated};
}
async function refreshDataset(name, btn){
  const d = S.datasets[name]; if (!d?.source) return;
  const label = btn?.textContent; if (btn){ btn.disabled = true; btn.textContent = 'Refreshing…'; }
  try {
    const {names, records} = await runSource(d.source);
    const prevType = new Map(d.columns.map(c => [c.name, c.type]));
    const cols = inferColumns(names, records).map(c => prevType.has(c.name) ? {...c, type: prevType.get(c.name)} : c);
    d.columns = cols; d.raw = records; d.rows = coerce(records, cols); d.source.refreshed = new Date().toISOString(); d.dirtyRows = true; d.justRefreshed = true;
    if (name === S.active){ buildModel(); renderAll(); } else save();
    toast(`Refreshed “${name}”: ${records.length.toLocaleString()} rows.`);
  } catch (e){ toast(`Could not refresh “${name}”: ${e.message}`); }
  if (btn){ btn.disabled = false; btn.textContent = label; }
}

const fileBase = () => (page().name + ' ' + new Date().toISOString().slice(0, 10)).replace(/[^\w\- ]+/g, '').replace(/\s+/g, ' ').trim() || 'report';

async function exportPDF(idxs, light, progress){
  await Promise.all([loadLib('jspdf'), loadLib('h2c')]);
  const {jsPDF} = window.jspdf;
  const pdf = new jsPDF({orientation:'landscape', unit:'pt', format:'a4', compress: true});
  const W = pdf.internal.pageSize.getWidth(), H = pdf.internal.pageSize.getHeight(), M = 28;
  const keep = {page: S.pageIdx, sel: S.selected, scroll: $('#canvasWrap').scrollTop};
  EXPORTING = true; S.selected = null; document.body.classList.add('exporting');
  if (light) document.documentElement.setAttribute('data-theme', 'light');
  let sheet = 0;
  try {
    for (const [n, i] of idxs.entries()){
      progress(`Rendering page ${n + 1} of ${idxs.length}…`);
      S.pageIdx = i; colorCache.clear(); renderTabs(); renderCanvas();
      $('#canvasWrap').scrollTop = 0;
      await frame(); await frame(); await sleep(120);
      charts.forEach(c => c.resize());
      const el = $('#canvas');
      const shot = await html2canvas(el, {backgroundColor: css('--bg'), scale: 2, logging: false, useCORS: true,
        height: el.scrollHeight, windowHeight: Math.max(window.innerHeight, el.scrollHeight + 200)});
      // header + paginate tall pages
      const top = M + 34, availH = H - top - M - 10, contentW = W - 2 * M, scale = contentW / shot.width;
      const sliceH = Math.floor(availH / scale);
      for (let y = 0; y < shot.height; y += sliceH){
        if (sheet++) pdf.addPage();
        const h = Math.min(sliceH, shot.height - y);
        const part = document.createElement('canvas'); part.width = shot.width; part.height = h;
        part.getContext('2d').drawImage(shot, 0, y, shot.width, h, 0, 0, shot.width, h);
        pdf.setFont('helvetica', 'bold'); pdf.setFontSize(14); pdf.setTextColor(22, 27, 38);
        pdf.text(S.pages[i].name + (y ? ' (continued)' : ''), M, M + 8);
        pdf.setFont('helvetica', 'normal'); pdf.setFontSize(8.5); pdf.setTextColor(95, 101, 115);
        pdf.text(pdf.splitTextToSize(`${S.active}  ·  Selections: ${selText()}  ·  Exported ${new Date().toLocaleString()}`, contentW)[0], M, M + 22);
        pdf.addImage(part.toDataURL('image/jpeg', 0.92), 'JPEG', M, top, contentW, h * scale, undefined, 'FAST');
        pdf.setFontSize(8); pdf.text(`Basira  ·  ${sheet}`, W - M, H - M / 2, {align: 'right'});
      }
    }
  } finally {
    EXPORTING = false; document.body.classList.remove('exporting');
    applyTheme();
    S.pageIdx = keep.page; S.selected = keep.sel; colorCache.clear(); renderAll();
    $('#canvasWrap').scrollTop = keep.scroll;
  }
  return {name: fileBase() + '.pdf', blob: pdf.output('blob')};
}

/* The numbers behind a visual, as a header row plus data rows. */
function visualTable(v){
  const t = v.type;
  if (t === 'text' || missingFields(v).length) return null;
  if (t === 'histogram'){ const h = histBins(v); if (!h || h.msg) return null;
    return {header: ['From', 'To', 'Rows'], rows: h.edges.map((e, i) => [e[0], e[1], h.counts[i]]), fmts: [fmtKind({f: h.f, agg:'sum'}), fmtKind({f: h.f, agg:'sum'}), 'number']}; }
  if (t === 'boxplot'){ const b = boxStats(v); if (!b || b.msg) return null; const k = fmtKind({f: b.f, agg:'sum'});
    return {header: [b.dim, 'Rows', 'Min', 'Q1', 'Median', 'Q3', 'Max'], rows: b.cats.map(c => { const x = b.st.get(c); return [c, x.n, x.min, x.q1, x.med, x.q3, x.max]; }), fmts: [null, 'number', k, k, k, k, k]}; }
  const ev = effective(v), rows = rowsFor(ev);
  const keys = t === 'table' || t === 'sunburst' ? ev.dims : [ev.dims?.[0], ev.legend].filter(Boolean);
  const ms = t === 'slicer' ? [{f: RECORDS, agg: 'count'}] : (ev.measures || []);
  if (!keys.length && !ms.length) return null;
  const g = keys.length ? groupRows(rows, r => keys.map(k => keyOf(r[k])).join('\u0001')) : new Map([['', rows]]);
  const out = [...g].map(([k, rs]) => [...(keys.length ? k.split('\u0001') : []), ...ms.map(m => measureVal(m, rs))]);
  out.sort((a, b) => { for (let i = 0; i < keys.length; i++){ const c = labelCmp(a[i], b[i]); if (c) return c; } return 0; });
  return {header: [...keys, ...ms.map(measureLabel)], rows: out, fmts: [...keys.map(() => null), ...ms.map(fmtKind)]};
}
async function exportXLSX(idxs, includeRows){
  await loadLib('xlsx');
  const wb = XLSX.utils.book_new(), used = new Set();
  const sheetName = n => { let b = String(n).replace(/[\[\]:*?\/\\]/g, ' ').replace(/\s+/g, ' ').trim().slice(0, 28) || 'Sheet', x = b, k = 2; while (used.has(x.toLowerCase())) x = `${b.slice(0, 26)} ${k++}`; used.add(x.toLowerCase()); return x; };
  const Z = {currency: '"$"#,##0.00', percent: '0.0%', decimal: '#,##0.00', number: '#,##0.##########'};
  const sheetFrom = (header, rows, fmts) => {
    const ws = XLSX.utils.aoa_to_sheet([header, ...rows]);
    rows.forEach((r, ri) => r.forEach((val, ci) => { const f = fmts[ci]; const cell = ws[XLSX.utils.encode_cell({r: ri + 1, c: ci})];
      if (cell && typeof val === 'number' && f){ cell.z = f === 'number' ? (Number.isInteger(val) ? '#,##0' : '#,##0.00') : Z[f]; } }));
    ws['!cols'] = header.map((h, ci) => ({wch: clamp(Math.max(String(h).length, ...rows.slice(0, 200).map(r => String(r[ci] ?? '').length)) + 2, 8, 48)}));
    ws['!autofilter'] = {ref: XLSX.utils.encode_range({s: {r: 0, c: 0}, e: {r: rows.length, c: header.length - 1}})};
    return ws;
  };
  const summary = [['Basira export'], [], ['Dataset', S.active], ['Rows in view', globalRows().length], ['Selections', selText()], ['Exported', new Date().toLocaleString()], [], ['Page', 'Visual', 'Type', 'Sheet']];
  const sheets = [];
  for (const i of idxs) for (const v of S.pages[i].visuals){
    const tb = visualTable(v); if (!tb || !tb.rows.length) continue;
    const title = v.title || autoTitle(effective(v));
    const nm = sheetName(title);
    summary.push([S.pages[i].name, title, TYPES[v.type].label, nm]);
    sheets.push([nm, sheetFrom(tb.header, tb.rows, tb.fmts)]);
  }
  const sws = XLSX.utils.aoa_to_sheet(summary); sws['!cols'] = [{wch: 22}, {wch: 44}, {wch: 20}, {wch: 30}];
  XLSX.utils.book_append_sheet(wb, sws, sheetName('Summary'));
  for (const [nm, ws] of sheets) XLSX.utils.book_append_sheet(wb, ws, nm);
  if (includeRows){
    const cols = FIELDS.filter(f => f.src === 'col' || (f.src === 'calc' && f.calcKind === 'row'));
    const rows = globalRows().slice(0, 1000000).map(r => cols.map(c => r[c.name] ?? ''));
    XLSX.utils.book_append_sheet(wb, sheetFrom(cols.map(c => c.name), rows, cols.map(c => c.type === 'number' ? fmtKind({f: c.name, agg: 'sum'}) : null)), sheetName('Data'));
  }
  const out = XLSX.write(wb, {bookType: 'xlsx', type: 'array', compression: true});
  return {name: fileBase() + '.xlsx', blob: new Blob([out], {type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'})};
}

/* ============================== auto-build ============================== */
function autoBuild(){
  const cols = ds().columns;
  const nums = cols.filter(c => c.type === 'number');
  const pri = c => /revenue|sales|amount|profit|total|value|cost|price|qty|quantity|units/i.test(c.name) ? 0 : 1;
  nums.sort((a, b) => pri(a) - pri(b));
  const card = new Map(cols.map(c => [c.name, new Set(ROWS.map(r => r[c.name])).size]));
  const dims = cols.filter(c => c.type === 'string' && card.get(c.name) >= 2 && card.get(c.name) <= 40).sort((a, b) => card.get(a.name) - card.get(b.name)).map(c => c.name);
  const date = cols.find(c => c.type === 'date');
  const m = nums[0] ? {f: nums[0].name, agg:'sum'} : {f: RECORDS, agg:'count'};
  const vis = [];
  const kpis = nums.slice(0, 3).map(c => ({f: c.name, agg: 'sum'}));
  kpis.push({f: RECORDS, agg: 'count'});
  const trend = date ? `${date.name} (Month)` : null;
  kpis.slice(0, 4).forEach(k => vis.push(newVisual('kpi', {measures:[k], dims: trend ? [trend] : [], w:3, h:2})));
  if (trend) vis.push(newVisual('area', {dims:[trend], measures:[m], w:8, h:4}));
  if (dims[0]) vis.push(newVisual(trend ? 'slicer' : 'column', {dims:[dims[0]], measures: trend ? [] : [m], w: trend ? 4 : 8, h:4}));
  if (dims[1]) vis.push(newVisual('bar', {dims:[dims[1]], measures:[m], w:4, h:4}));
  if (dims[2] || dims[0]) vis.push(newVisual('donut', {dims:[dims[2] || dims[0]], measures:[m], w:4, h:4}));
  if (dims[0] && (dims[1] || date)) vis.push(newVisual('matrix', {dims:[dims[1] || dims[0]], legend: date ? `${date.name} (Year)` : dims[0], measures:[m], heat:true, w:4, h:4}));
  const tdims = dims.slice(0, 2);
  if (tdims.length || nums.length) vis.push(newVisual('table', {dims: tdims, measures: nums.slice(0, 4).map(c => ({f: c.name, agg:'sum'})), bars:true, w:12, h:5}));
  S.pages.push({id: uid(), name: 'Overview · ' + S.active.slice(0, 24), visuals: vis});
  S.pageIdx = S.pages.length - 1; S.selected = null;
  renderAll();
}

/* --- the data context Claude reads (schema, not rows) --- */
function chatContext(){
  const lines = [`Dataset: "${S.active}" with ${ROWS.length.toLocaleString('en-US')} rows. Report: "${curReport()?.name || ''}".`, '', 'Fields:'];
  for (const f of FIELDS){
    if (f.src === 'part' || f.src === 'records') continue;
    if (f.src === 'calc'){ const c = calcs().find(x => x.name === f.name); lines.push(`- "${f.name}": calculated ${f.calcKind === 'measure' ? 'MEASURE (already aggregated; any agg gives the same result)' : f.type + ' per row'} = ${c?.expr}`); continue; }
    const vals = ROWS.map(r => r[f.name]).filter(x => x != null && x !== '');
    if (f.type === 'number'){
      let lo = Infinity, hi = -Infinity, sum = 0; for (const x of vals){ if (x < lo) lo = x; if (x > hi) hi = x; sum += x; }
      lines.push(`- "${f.name}": number (${fmtKind({f: f.name, agg: 'sum'})}), min ${+lo.toFixed(4)}, max ${+hi.toFixed(4)}, total ${+sum.toFixed(2)}`);
    } else if (f.type === 'date'){
      const sorted = vals.map(String).sort();
      lines.push(`- "${f.name}": date, ${sorted[0]} to ${sorted[sorted.length - 1]}. Group or filter with the derived text fields "${f.name} (Year)" e.g. 2025, "${f.name} (Quarter)" e.g. 2025 Q1, "${f.name} (Month)" e.g. 2025-03, "${f.name} (Month Name)" Jan..Dec, "${f.name} (Weekday)" Mon..Sun, "${f.name} (Day)" YYYY-MM-DD.`);
    } else {
      const cnt = new Map(); for (const x of vals) cnt.set(x, (cnt.get(x) || 0) + 1);
      const top = [...cnt].sort((a, b) => b[1] - a[1]).slice(0, 15).map(x => x[0]);
      if (cnt.size > vals.length * 0.9 && cnt.size > 50) lines.push(`- "${f.name}": text identifier, unique per row (${cnt.size} values), e.g. ${top.slice(0, 3).map(x => JSON.stringify(String(x).slice(0, 40))).join(', ')}`);
      else lines.push(`- "${f.name}": text, ${cnt.size} distinct values${cnt.size <= 15 ? ': ' : ', most common: '}${top.map(x => JSON.stringify(String(x).slice(0, 40))).join(', ')}`);
    }
  }
  lines.push(`- "${RECORDS}": count of rows (use agg "count").`);
  const sel = Object.entries(S.sel).filter(([, x]) => x.size);
  lines.push('', `Report filters the user currently has selected: ${sel.length ? sel.map(([f, x]) => `${f} in [${[...x].join(', ')}]`).join('; ') : 'none'}.`);
  lines.push(`Report pages: ${S.pages.map(pg => `"${pg.name}" (${pg.visuals.slice(0, 8).map(v => v.title || autoTitle(effective(v))).join('; ')})`).join(' | ').slice(0, 3000)}`);
  lines.push(`The user is looking at page "${page().name}".`);
  if (!CH.toolsOK) lines.push('', 'Pre-computed summaries (tools are unavailable, answer only from these):', chatDigest());
  return lines.join('\n');
}
function chatDigest(){
  const ms = FIELDS.filter(f => f.role === 'measure' && f.src !== 'records').slice(0, 4).map(f => ({f: f.name, agg: f.calcKind === 'measure' ? 'sum' : 'sum'}));
  const dims = FIELDS.filter(f => f.role === 'dim' && (f.src === 'col' || f.src === 'calc' || f.part === 'Year' || f.part === 'Month') && new Set(ROWS.slice(0, 3000).map(r => r[f.name])).size <= 40).slice(0, 8);
  const out = [];
  for (const d of dims){
    const g = groupRows(ROWS, r => keyOf(r[d.name]));
    out.push(`By ${d.name}: ` + [...g].map(([k, rs]) => `${k}: ${ms.map(m => `${measureLabel(m)}=${fmtVal(measureVal(m, rs), m)}`).join(', ')}, rows=${rs.length}`).join(' | '));
  }
  return out.join('\n').slice(0, 60000);
}
function chatInstructions(){
  return `You are the data analyst built into Basira, a business intelligence app. Answer the user's questions about their dataset.

${chatContext()}

Rules:
- Every number in your answer must come from a tool result. Never estimate or invent figures. Call query_data as often as needed; you may call several tools in one round.
- When the user names a value (possibly misspelled, plural, abbreviated, or in Arabic or another language), call distinct_values to find the exact value before filtering.
- Answer over the whole dataset unless the user asks about what is currently filtered or selected in the report; then set apply_report_filters to true.
- Reply in the language of the user's latest message. For Arabic, write clear Modern Standard Arabic; keep field names and data values as they appear in the data, adding an Arabic translation in parentheses the first time when helpful. Use Western digits (0-9) and the formatted values from tool results.
- Do not describe your tool calls or say what you are about to do. Write only the final answer: a direct answer with the key numbers first (1-2 sentences), then a short bullet list or a small pipe table only if it helps. Use **bold** for key figures. Keep it under about 180 words unless the user asks for detail.
- For growth or change, compute (new - old) / old and say which periods you compared.
- Call add_visual only when the user asks to see a chart, graph, plot or visual. Call apply_report_filter only when the user asks to filter the report. Mention what you added or changed in one short sentence.
- If the data cannot answer the question, say so plainly and suggest a related question it can answer.`;
}

/* --- tools that run in this page --- */
function fieldOrThrow(f){
  f = String(f ?? '');
  if (FMAP.has(f)) return f;
  const ci = FIELDS.find(x => x.name.toLowerCase() === f.toLowerCase()); if (ci) return ci.name;
  throw new Error(`Unknown field "${f}". Valid fields: ${FIELDS.filter(x => x.src !== 'records').map(x => x.name).join(', ')}, ${RECORDS}`);
}
function applyToolFilters(rows, filters){
  for (const flt of (Array.isArray(filters) ? filters : [])){
    const f = fieldOrThrow(flt.field), op = String(flt.op || 'in'), vals = (Array.isArray(flt.values) ? flt.values : [flt.values]).filter(x => x != null);
    const num = FMAP.get(f).type === 'number';
    const lower = new Set(vals.map(x => String(x).toLowerCase()));
    const cmp = r => { const x = r[f]; return num ? Number(x) : String(x ?? ''); };
    const a = num ? Number(vals[0]) : String(vals[0] ?? ''), b = num ? Number(vals[1]) : String(vals[1] ?? '');
    rows = rows.filter(r => {
      const x = cmp(r);
      switch (op){
        case 'not_in': return !lower.has(keyOf(r[f]).toLowerCase());
        case 'gt': return x > a; case 'gte': return x >= a; case 'lt': return x < a; case 'lte': return x <= a;
        case 'between': return x >= a && x <= b;
        case 'contains': return keyOf(r[f]).toLowerCase().includes(String(vals[0] ?? '').toLowerCase());
        default: return lower.has(keyOf(r[f]).toLowerCase());
      }
    });
  }
  return rows;
}
function toolMeasures(list){
  const ms = (Array.isArray(list) ? list : []).map(m => { const f = String(m?.field ?? m) === RECORDS ? RECORDS : fieldOrThrow(m?.field ?? m);
    const agg = AGGS[m?.agg] ? m.agg : defaultAgg(f); return {f, agg: f === RECORDS ? 'count' : agg}; });
  return ms.length ? ms : [{f: RECORDS, agg: 'count'}];
}
const round = x => x == null ? null : Math.abs(x) >= 100 ? Math.round(x * 100) / 100 : +x.toPrecision(6);
function chatTools(msg){
  const status = t => { msg.status = t; renderChatMsg(msg); };
  return [
    {name: 'query_data',
     description: 'Aggregate the dataset. Groups rows by up to 3 fields and computes measures (sum, avg, min, max, count, dcount, median). Returns columns, rows (raw value and formatted text), the number of matching rows and grand totals. Use this for every number you report.',
     inputSchema: {type: 'object', properties: {
       group_by: {type: 'array', items: {type: 'string'}, description: 'Field names to group by, e.g. ["Region"] or ["Order Date (Year)", "Category"]. Empty for grand totals.'},
       measures: {type: 'array', items: {type: 'object', properties: {field: {type: 'string'}, agg: {type: 'string', enum: Object.keys(AGGS)}}, required: ['field']}, description: 'What to compute, e.g. [{"field":"Revenue","agg":"sum"}]. Calculated measures ignore agg.'},
       filters: {type: 'array', items: {type: 'object', properties: {field: {type: 'string'}, op: {type: 'string', enum: ['in','not_in','gt','gte','lt','lte','between','contains']}, values: {type: 'array', items: {}}}, required: ['field', 'values']}},
       sort_by: {type: 'string', description: 'A group_by field or a measure field to sort on. Defaults to the first measure.'},
       sort_dir: {type: 'string', enum: ['desc', 'asc']},
       limit: {type: 'number', description: 'Max rows to return, default 30, max 200.'},
       apply_report_filters: {type: 'boolean', description: 'true to respect the selections the user has made in the report.'}}},
     execute(input){
       const gb = (Array.isArray(input.group_by) ? input.group_by : []).slice(0, 3).map(fieldOrThrow);
       const ms = toolMeasures(input.measures);
       status(T().q(ms.map(m => m.f === RECORDS ? 'rows' : m.f).join(', ') + (gb.length ? ' × ' + gb.map(shortName).join(', ') : '')));
       let rows = applyToolFilters(input.apply_report_filters ? globalRows() : ROWS, input.filters);
       const g = gb.length ? groupRows(rows, r => gb.map(f => keyOf(r[f])).join('\u0001')) : new Map([['', rows]]);
       let out = [...g].map(([k, rs]) => ({keys: gb.length ? k.split('\u0001') : [], vals: ms.map(m => measureVal(m, rs)), n: rs.length}));
       const sb = input.sort_by ? String(input.sort_by) : null, dir = input.sort_dir === 'asc' ? 1 : -1;
       const ki = sb ? gb.findIndex(f => f.toLowerCase() === sb.toLowerCase()) : -1;
       const mi = sb ? Math.max(0, ms.findIndex(m => m.f.toLowerCase() === sb.toLowerCase() || measureLabel(m).toLowerCase() === sb.toLowerCase())) : 0;
       if (ki >= 0) out.sort((a, b) => labelCmp(a.keys[ki], b.keys[ki]) * dir);
       else if (!sb && gb.length && isOrdinal(gb[0])) out.sort((a, b) => labelCmp(a.keys[0], b.keys[0]));
       else out.sort((a, b) => ((a.vals[mi] ?? -Infinity) - (b.vals[mi] ?? -Infinity)) * dir);
       const limit = clamp(Number(input.limit) || 30, 1, 200);
       return {matching_rows: rows.length, groups: out.length, returned: Math.min(limit, out.length),
         columns: [...gb, ...ms.map(measureLabel), 'rows'],
         rows: out.slice(0, limit).map(o => [...o.keys, ...o.vals.map((x, i) => ({value: round(x), text: fmtVal(x, ms[i])})), o.n]),
         grand_total: ms.map((m, i) => ({measure: measureLabel(m), value: round(measureVal(m, rows)), text: fmtVal(measureVal(m, rows), m)}))};
     }},
    {name: 'distinct_values',
     description: 'List the distinct values of a field with row counts, most common first. Use it to find the exact spelling of a value the user mentioned before filtering on it.',
     inputSchema: {type: 'object', properties: {field: {type: 'string'}, search: {type: 'string', description: 'Optional case-insensitive substring.'}, limit: {type: 'number'}}, required: ['field']},
     execute(input){
       const f = fieldOrThrow(input.field); status(T().v(shortName(f)));
       const q = String(input.search || '').toLowerCase();
       const cnt = new Map(); for (const r of ROWS){ const k = keyOf(r[f]); if (!q || k.toLowerCase().includes(q)) cnt.set(k, (cnt.get(k) || 0) + 1); }
       return {field: f, distinct: cnt.size, values: [...cnt].sort((a, b) => b[1] - a[1]).slice(0, clamp(Number(input.limit) || 50, 1, 200)).map(([value, rows]) => ({value, rows}))};
     }},
    {name: 'add_visual',
     description: 'Add a chart to the report page the user is looking at. Use only when the user asks to see a chart or visual. Returns the title of the chart added.',
     inputSchema: {type: 'object', properties: {
       type: {type: 'string', enum: ['column','bar','line','area','stacked','stacked100','pie','donut','treemap','waterfall','scatter','heatmap','table','matrix','kpi','multicard','gauge','funnel']},
       title: {type: 'string', description: 'Short title in the language of the conversation.'},
       axis: {type: 'array', items: {type: 'string'}, description: 'Category field(s). Use "<date> (Month)" or "(Year)" for time.'},
       legend: {type: 'string', description: 'Optional field to split series by.'},
       values: {type: 'array', items: {type: 'object', properties: {field: {type: 'string'}, agg: {type: 'string'}}, required: ['field']}},
       filters: {type: 'array', items: {type: 'object', properties: {field: {type: 'string'}, values: {type: 'array', items: {type: 'string'}}}, required: ['field', 'values']}, description: 'Keep only rows whose field equals one of the values (exact values).'}},
       required: ['type', 'values']},
     execute(input){
       const type = TYPES[input.type] ? String(input.type) : 'column';
       const dims = (Array.isArray(input.axis) ? input.axis : []).slice(0, 4).map(fieldOrThrow);
       const legend = input.legend ? fieldOrThrow(input.legend) : null;
       const measures = toolMeasures(input.values);
       const vfilters = (Array.isArray(input.filters) ? input.filters : []).map(x => [fieldOrThrow(x.field), (Array.isArray(x.values) ? x.values : [x.values]).map(String)]);
       const v = newVisual(type, {title: String(input.title || '').slice(0, 80), dims, legend: TYPES[type].wells.legend ? legend : null, measures, vfilters});
       if (['line','area','column','table','matrix'].includes(type) || dims.length > 1) v.w = Math.max(v.w, 6);
       page().visuals.push(v); S.selected = v.id; changed();
       requestAnimationFrame(() => $(`.card[data-id="${v.id}"]`)?.scrollIntoView({block: 'nearest', behavior: 'smooth'}));
       const title = v.title || autoTitle(v);
       (msg.did ||= []).push(T().added(title));
       return `Added "${title}" to page "${page().name}". The user can undo it.`;
     }},
    {name: 'apply_report_filter',
     description: 'Filter the whole report to the given values of a field (the same as clicking them). Pass an empty values list to clear that field\'s filter. Use only when the user asks to filter the report.',
     inputSchema: {type: 'object', properties: {field: {type: 'string'}, values: {type: 'array', items: {type: 'string'}}}, required: ['field', 'values']},
     execute(input){
       const f = fieldOrThrow(input.field), vals = (Array.isArray(input.values) ? input.values : []).map(String);
       if (vals.length) S.sel[f] = new Set(vals); else delete S.sel[f];
       renderAll();
       (msg.did ||= []).push(T().filt(vals.length ? `${f} = ${vals.join(', ')}` : `${f} cleared`));
       return `Report now filtered: ${selText()}. Rows in view: ${globalRows().length}.`;
     }},
  ];
}

/* --- light Markdown for answers (input is escaped first) --- */
function mdLite(src){
  const L = esc(src).split('\n'), out = [];
  const inl = t => t.replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/(^|[^*])\*([^*\s][^*]*?)\*(?!\*)/g, '$1<i>$2</i>').replace(/`([^`]+)`/g, '<code>$1</code>');
  let i = 0;
  while (i < L.length){
    const l = L[i];
    if (/^\s*\|.*\|\s*$/.test(l)){
      const rows = []; while (i < L.length && /^\s*\|.*\|\s*$/.test(L[i])) rows.push(L[i++]);
      const cells = r => r.trim().replace(/^\||\|$/g, '').split('|').map(c => c.trim());
      const body = rows.filter(r => !/^\s*\|?[\s:|-]+\|?\s*$/.test(r));
      const [h, ...rest] = body.map(cells);
      const isNum = c => /^[-+]?[$€£]?[\d.,]+[%KMB]?$/.test(c.replace(/\s/g, ''));
      out.push(`<div class="tw"><table class="grid"><thead><tr>${(h || []).map(c => `<th dir="auto">${inl(c)}</th>`).join('')}</tr></thead><tbody>${rest.map(r => `<tr>${r.map(c => `<td dir="auto" class="${isNum(c) ? 'num' : ''}">${inl(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`);
      continue;
    }
    if (/^\s*([-*•])\s+/.test(l)){ const it = []; while (i < L.length && /^\s*([-*•])\s+/.test(L[i])) it.push(L[i++].replace(/^\s*[-*•]\s+/, '')); out.push(`<ul>${it.map(x => `<li dir="auto">${inl(x)}</li>`).join('')}</ul>`); continue; }
    if (/^\s*\d+[.)]\s+/.test(l)){ const it = []; while (i < L.length && /^\s*\d+[.)]\s+/.test(L[i])) it.push(L[i++].replace(/^\s*\d+[.)]\s+/, '')); out.push(`<ol>${it.map(x => `<li dir="auto">${inl(x)}</li>`).join('')}</ol>`); continue; }
    if (/^#{1,6}\s/.test(l)){ out.push(`<h4 dir="auto">${inl(l.replace(/^#+\s*/, ''))}</h4>`); i++; continue; }
    if (!l.trim()){ i++; continue; }
    const para = []; while (i < L.length && L[i].trim() && !/^\s*(\||[-*•]\s|\d+[.)]\s|#)/.test(L[i])) para.push(L[i++]);
    if (!para.length){ para.push(L[i++]); }
    out.push(`<p dir="auto">${para.map(inl).join('<br>')}</p>`);
  }
  return out.join('');
}

/* --- panel --- */
function getSample(){
  return CH.sampleP ||= (async () => {
    if (!window.claude?.use) return null;
    const s = await window.claude.use('sample').catch(() => null);
    if (s){ const lim = await s.limits?.().catch(() => null); CH.toolsOK = !lim || !!lim.tools; }
    return s;
  })();
}
function openChat(){
  hideTips();
  const el = $('#chat'); el.hidden = false; renderChat(); closeDrawers();
  setTimeout(() => $('#chatIn')?.focus(), 30);
  getSample().then(s => { if (!s && !CH.off){ CH.off = 'unavailable'; renderChat(); } });
}
function closeChat(){ CH.ctl?.abort(); $('#chat').hidden = true; }
function renderChat(){
  const el = $('#chat'); if (el.hidden) return;
  const draft = $('#chatIn')?.value || '';
  const t = T(), chat = curChat(), sp = samplePrompts();
  el.setAttribute('dir', CH.lang === 'ar' ? 'rtl' : 'ltr'); el.setAttribute('lang', CH.lang);
  const sampleBtns = arr => arr.map(q => `<button type="button" data-q="${esc(q)}" dir="auto">${esc(q)}</button>`).join('');
  const first = CH.lang === 'ar' ? ['ar', t.tryAr, 'en', t.tryEn] : ['en', t.tryEn, 'ar', t.tryAr];
  el.innerHTML = `<div class="chat-h"><h3>${esc(t.title)}<small>${esc(t.sub(S.active))}</small></h3>
      <div class="lang" role="group" aria-label="Language"><button type="button" data-lang="en" class="${CH.lang === 'en' ? 'on' : ''}" lang="en">EN</button><button type="button" data-lang="ar" class="${CH.lang === 'ar' ? 'on' : ''}" lang="ar">عربي</button></div>
      ${chat.msgs.length ? `<button class="btn ghost sm" type="button" data-c="clear" title="${esc(t.clear)}">${esc(t.clear)}</button>` : ''}
      <button class="btn ghost sm" type="button" data-c="close" aria-label="${esc(t.close)}">✕</button></div>
    <div class="chat-b" id="chatB">${chat.msgs.length ? chat.msgs.map((m, i) => `<div class="msg ${m.role === 'user' ? 'user' : 'bot'}" data-i="${i}" dir="auto"></div>`).join('') :
      `<p class="chat-intro">${esc(t.intro)}</p>${CH.off ? `<p class="err">${esc(t[CH.off])}</p>` : ''}
       <div class="samples"><h5>${esc(first[1])}</h5>${sampleBtns(sp[first[0]])}<h5 style="margin-top:8px">${esc(first[3])}</h5>${sampleBtns(sp[first[2]])}</div>`}</div>
    <form class="chat-f" id="chatF">
      <textarea id="chatIn" rows="2" dir="auto" placeholder="${esc(t.ph)}" aria-label="${esc(t.ph)}" ${CH.off ? 'disabled' : ''}></textarea>
      <div class="row"><label><input type="checkbox" id="chatDeep" ${CH.deep ? 'checked' : ''}> ${esc(t.deep)}</label>
        <span style="display:flex;gap:6px;align-items:center"><span class="note">${esc(t.note)}</span>
        ${CH.busy ? `<button class="btn" type="button" data-c="stop">${esc(t.stop)}</button>` : `<button class="btn primary" type="submit" ${CH.off ? 'disabled' : ''}>${esc(t.send)}</button>`}</span></div>
    </form>`;
  chat.msgs.forEach(m => renderChatMsg(m));
  if (draft) $('#chatIn').value = draft;
  const b = $('#chatB'); b.scrollTop = b.scrollHeight;
}
function renderChatMsg(m){
  const chat = curChat(), i = chat.msgs.indexOf(m);
  const el = $(`#chatB .msg[data-i="${i}"]`); if (!el) return;
  if (m.role === 'user'){ el.textContent = m.text; return; }
  el.innerHTML = (m.text ? mdLite(m.text) : '') + (m.pending ? `<div class="st busy">${esc(m.status || T().thinking)}</div>` : '')
    + (m.did?.length ? `<div class="did">${m.did.map(d => `<span dir="auto">✓ ${esc(d)}</span>`).join('')}</div>` : '')
    + (m.error ? `<p class="err">${esc(m.error)}</p>` : '') + (m.note ? `<p class="hint" style="font-size:12px;margin:6px 0 0">${esc(m.note)}</p>` : '');
  const b = $('#chatB'); if (b && b.scrollHeight - b.scrollTop - b.clientHeight < 160) b.scrollTop = b.scrollHeight;
}
async function chatSend(q){
  q = String(q || '').trim(); if (!q || CH.busy) return;
  const chat = curChat();
  chat.msgs.push({role: 'user', text: q});
  const a = {role: 'assistant', text: '', pending: true, status: T().thinking};
  chat.msgs.push(a);
  CH.busy = true; renderChat();
  const sample = await getSample();
  if (!sample){ a.pending = false; a.error = T().unavailable; CH.busy = false; CH.off = 'unavailable'; renderChat(); return; }
  CH.ctl = new AbortController();
  const turns = [{role: 'user', content: chatInstructions()}, ...chat.turns.slice(-12), {role: 'user', content: q}];
  try {
    const opts = {signal: CH.ctl.signal, cache: false, modelTier: CH.deep ? 'default' : 'quick',
      onText: ({text}) => { a.text = text; a.status = ''; renderChatMsg(a); }};
    if (CH.toolsOK) opts.tools = chatTools(a);
    const res = await sample(turns, opts);
    a.text = res.text;
    if (res.truncated) a.note = T().cut;
    chat.turns.push({role: 'user', content: q}, {role: 'assistant', content: res.text});
  } catch (e){
    a.text = e?.text || '';
    const c = e?.code;
    if (c === 'not_granted' || c === 'sampling_disabled' || c === 'not_declared' || c === 'capability_disabled' || c === 'capability_removed'){ CH.off = 'denied'; a.error = T().denied; }
    else if (c === 'tools_unavailable'){ CH.toolsOK = false; a.error = T().error; }
    else if (c === 'rate_limited') a.error = T().limited;
    else if (c === 'refused'){ a.text = ''; a.error = T().refused; }
    else if (c !== 'cancelled') a.error = T().error;
  } finally {
    a.pending = false; a.status = ''; CH.busy = false; CH.ctl = null;
    renderChat();
  }
}
$('#chat').addEventListener('click', e => {
  const q = e.target.closest('[data-q]')?.dataset.q; if (q) return chatSend(q);
  const lg = e.target.closest('[data-lang]')?.dataset.lang;
  if (lg){ CH.lang = lg; try { localStorage.setItem('facet-chat-lang', lg); } catch {} return renderChat(); }
  const c = e.target.closest('[data-c]')?.dataset.c;
  if (c === 'close') closeChat();
  if (c === 'stop') CH.ctl?.abort();
  if (c === 'clear'){ CH.ctl?.abort(); CHATS[S.reportId] = {msgs: [], turns: []}; renderChat(); }
});
$('#chat').addEventListener('change', e => { if (e.target.id === 'chatDeep') CH.deep = e.target.checked; });
$('#chat').addEventListener('submit', e => { e.preventDefault(); const t = $('#chatIn'); const q = t.value; t.value = ''; chatSend(q); });
$('#chat').addEventListener('keydown', e => { if (e.target.id === 'chatIn' && e.key === 'Enter' && !e.shiftKey && !e.isComposing){ e.preventDefault(); $('#chatF').requestSubmit(); } });
$('#chat').addEventListener('input', e => { if (e.target.id === 'chatIn'){ e.target.style.height = 'auto'; e.target.style.height = Math.min(140, e.target.scrollHeight) + 'px'; } });
$('#btnAsk').onclick = () => $('#chat').hidden ? openChat() : closeChat();

/* ============================== reports ==============================
   Each report has its own dataset, pages, filters and undo history. Importing a file opens a new report,
   so the report you were working in stays exactly as it was. */
let REPORTS = [];   // [{id, name, active, pages, pageIdx, sel (arrays), dt, hist}]
S.reportId = null;
const curReport = () => REPORTS.find(r => r.id === S.reportId);
function stashReport(){
  const r = curReport(); if (!r) return;
  Object.assign(r, {active: S.active, pages: S.pages, pageIdx: S.pageIdx, dt: S.dt || null,
    sel: Object.fromEntries(Object.entries(S.sel).filter(([, x]) => x.size).map(([k, x]) => [k, [...x]])),
    hist: {stack: HIST.stack, i: HIST.i}});
}
function loadReport(r){
  const want = S.datasets[r.active] ? r.active : Object.keys(S.datasets)[0];
  if (S.datasets[want] && !S.datasets[want].rows){
    toast(`Loading “${want}”…`);
    fetchRows(want).then(() => { $('#toastRoot').innerHTML = ''; loadReport(r); }, e => toast(e.message));
    return;
  }
  S.reportId = r.id;
  try { if (SRV.on) localStorage.setItem('basira-last-report', r.id); } catch {}
  S.active = S.datasets[r.active] ? r.active : Object.keys(S.datasets)[0];
  S.pages = r.pages && r.pages.length ? r.pages : [{id: uid(), name: 'Page 1', visuals: []}];
  S.pageIdx = clamp(r.pageIdx || 0, 0, S.pages.length - 1);
  S.sel = Object.fromEntries(Object.entries(r.sel || {}).map(([k, a]) => [k, new Set(a)]));
  S.dt = r.dt || null; S.selected = null;
  HIST.stack = r.hist ? r.hist.stack : []; HIST.i = r.hist ? r.hist.i : -1;
  closeModal(); closeMenu(); buildModel(); renderAll();
  if (!HIST.stack.length) commit();
  histButtons(); $('#canvasWrap').scrollTop = 0;
}
function switchReport(id){
  if (id === S.reportId) return;
  const r = REPORTS.find(x => x.id === id); if (!r) return;
  commit(); stashReport(); loadReport(r);
  toast(`Switched to “${r.name}”.`);
}
function newReport(name, dataset, pages){
  commit(); stashReport();
  let nm = name, k = 2; while (REPORTS.some(r => r.name === nm)) nm = `${name} (${k++})`;
  const r = {id: uid(), name: nm, active: dataset, pages: pages || [], pageIdx: 0, sel: {}, dt: null};
  REPORTS.push(r); loadReport(r);
  return r;
}
function closeReport(id){
  if (REPORTS.length < 2) return;
  if (id === S.reportId){ commit(); stashReport(); }
  const i = REPORTS.findIndex(r => r.id === id), [gone] = REPORTS.splice(i, 1);
  if (id === S.reportId) loadReport(REPORTS[Math.max(0, i - 1)]); else renderReportBtn();
  save();
  toast(`Closed “${gone.name}”.`, 'Undo', () => { REPORTS.splice(i, 0, gone); renderReportBtn(); save(); toast(`Restored “${gone.name}”. Pick it from the report menu.`); });
}
function renderReportBtn(){ const r = curReport(); $('#repName').textContent = r ? r.name : 'Report'; }
function openReportsMenu(){
  closeMenu();
  const b = $('#btnReports').getBoundingClientRect();
  const m = document.createElement('div');
  m.className = 'ctx'; m.setAttribute('role', 'menu');
  m.innerHTML = `<div class="h">Your reports</div>${REPORTS.map(r => `<button type="button" role="menuitem" class="rep ${r.id === S.reportId ? 'on' : ''}" data-rep="${esc(r.id)}"><span style="overflow:hidden;text-overflow:ellipsis">${esc(r.name)}</span><small>${(r.id === S.reportId ? S.pages : r.pages || []).length} pg</small></button>`).join('')}
    <hr><button type="button" role="menuitem" data-r="import">Import a file into a new report…</button>
    <button type="button" role="menuitem" data-r="new">New blank report</button>
    <button type="button" role="menuitem" data-r="rename">Rename this report…</button>
    ${REPORTS.length > 1 ? `<button type="button" role="menuitem" class="danger" data-r="close">Close this report</button>` : ''}`;
  document.body.append(m);
  m.style.left = clamp(b.left, 8, innerWidth - m.offsetWidth - 8) + 'px'; m.style.top = (b.bottom + 6) + 'px';
  m.addEventListener('click', e => {
    const x = e.target.closest('button'); if (!x) return;
    closeMenu();
    if (x.dataset.rep) return switchReport(x.dataset.rep);

/* ============================== persistence ============================== */
let saveTimer, lastSaveOk = true;
/* History: every change is recorded as a snapshot of the report (pages, visuals, calculated fields, formats, filters). */
const HIST = {stack: [], i: -1};
function snapshot(){
  return JSON.stringify({active: S.active, pages: reportJSON().pages,
    calcs: Object.fromEntries(Object.entries(S.calcs).map(([k, a]) => [k, a.map(({name, expr, fmt}) => ({name, expr, fmt}))])),
    fmt: S.fmt, sel: Object.fromEntries(Object.entries(S.sel).filter(([, x]) => x.size).map(([k, x]) => [k, [...x]])), dt: S.dt || null});
}
function commit(){
  const snap = snapshot();
  if (HIST.stack[HIST.i] === snap) return;
  HIST.stack = HIST.stack.slice(0, HIST.i + 1); HIST.stack.push(snap);
  if (HIST.stack.length > 200) HIST.stack.splice(1, 1);   // keep the session's starting point for Reset
  HIST.i = HIST.stack.length - 1; histButtons();
}
function restore(snap){
  const o = JSON.parse(snap), before = S.pages.map(pg => JSON.stringify(pg));
  if (S.datasets[o.active]) S.active = o.active;
  S.pages = o.pages; S.calcs = o.calcs; S.fmt = o.fmt; S.dt = o.dt;
  S.sel = Object.fromEntries(Object.entries(o.sel).map(([k, a]) => [k, new Set(a)]));
  // show the page that changed
  const cur = page()?.id, changedIdx = S.pages.findIndex((pg, i) => JSON.stringify(pg) !== before[i]);
  const keep = S.pages.findIndex(pg => pg.id === cur);
  S.pageIdx = changedIdx >= 0 ? changedIdx : keep >= 0 ? keep : clamp(S.pageIdx, 0, S.pages.length - 1);
  if (S.selected && !S.pages.some(pg => pg.visuals.some(v => v.id === S.selected))) S.selected = null;
  closeModal(); buildModel(); renderAll(); histButtons();
}
function undo(){ commit(); if (HIST.i > 0){ HIST.i--; restore(HIST.stack[HIST.i]); } }
function redo(){ commit(); if (HIST.i < HIST.stack.length - 1){ HIST.i++; restore(HIST.stack[HIST.i]); } }
function histButtons(){
  const u = $('#btnUndo'), r = $('#btnRedo'), x = $('#btnReset'); if (!u) return;
  u.disabled = HIST.i <= 0; r.disabled = HIST.i >= HIST.stack.length - 1;
  const mu = $('#mUndo'); if (mu) mu.disabled = u.disabled;
  x.disabled = !HIST.stack.length || HIST.stack[HIST.i] === HIST.stack[0];
}
function save(){
  clearTimeout(saveTimer);
  if (SRV.on){ saveTimer = setTimeout(() => { stashReport(); commit(); srvSave(); }, 250); return true; }
  saveTimer = setTimeout(() => {
    const userDs = Object.values(S.datasets).filter(d => !d.sample).map(d => ({name: d.name, columns: d.columns, rows: d.rows, source: d.source}));
    stashReport();
    const reports = REPORTS.map(({hist, ...r}) => ({...r, pages: (r.pages || []).map(pg => ({...pg, visuals: pg.visuals.map(({_q, ...v}) => v)}))}));
    const state = {v:4, reports, current: S.reportId, dt: S.dt || null, active:S.active, calcs: Object.fromEntries(Object.entries(S.calcs).map(([k, a]) => [k, a.map(({name, expr, fmt}) => ({name, expr, fmt}))])), fmt:S.fmt,
      pages: reportJSON().pages, pageIdx:S.pageIdx, sel: Object.fromEntries(Object.entries(S.sel).map(([k, s]) => [k, [...s]]))};
    lastSaveOk = store.set({...state, datasets: userDs}) || store.set(state);
    commit();
  }, 250);
  return true;
}
function init(){
  const s = makeSample();
  S.datasets[s.name] = s;
  let saved = store.get(), migrated = false;
  if (!saved){ saved = store.old(); migrated = !!saved; }

/* ============================== Basira server ==============================
   When the app is served by Basira server (server/ in the repository), people sign in with their company
   account and reports and datasets are shared through the server. Anywhere else (a plain file, GitHub Pages,
   inside Claude) the app keeps everything in the browser as before. */
const SRV = {on: false, cfg: null, me: null, saved: {}, dsMeta: {}, dsIds: new Set(), repIds: new Set(), timer: null, busy: false, again: false, conflict: null};
const canEdit = () => !SRV.on || SRV.me?.role === 'admin' || SRV.me?.role === 'editor';
async function api(method, p, body, opt = {}){
  let r;
  try {
    r = await fetch('api/' + p, {method, credentials: 'same-origin',
      headers: {'X-Basira': '1', ...(body !== undefined ? {'Content-Type': 'application/json'} : {}), ...(opt.headers || {})},
      body: opt.raw !== undefined ? opt.raw : body !== undefined ? JSON.stringify(body) : undefined});
  } catch { const e = new Error('The Basira server could not be reached. Check your connection.'); e.status = 0; throw e; }
  let j = null; try { j = await r.json(); } catch {}
  if (!r.ok){ const e = new Error(j?.error || `The server replied ${r.status}.`); e.status = r.status; e.data = j; throw e; }
  return j;
}
async function apiBig(method, p, obj){   // large uploads are gzip-compressed in the browser when it can
  const text = JSON.stringify(obj);
  if (!window.CompressionStream || text.length < 256e3) return api(method, p, undefined, {raw: text, headers: {'Content-Type': 'application/json'}});
  const blob = await new Response(new Blob([text]).stream().pipeThrough(new CompressionStream('gzip'))).blob();
  return api(method, p, undefined, {raw: blob, headers: {'Content-Type': 'application/json', 'Content-Encoding': 'gzip'}});
}
async function fetchRows(name){
  const d = S.datasets[name]; if (!d || d.rows) return;
  d._loading ||= (async () => {
    const r = await fetch('api/datasets/' + encodeURIComponent(d.serverId) + '/rows', {credentials: 'same-origin'});
    if (r.status === 401){ showSignIn('expired'); throw new Error('Your session has ended. Sign in again.'); }
    if (!r.ok) throw new Error(`Could not load “${name}” from the server.`);
    d.rows = await r.json(); d.raw = d.rows;
  })().finally(() => { d._loading = null; });
  return d._loading;
}
const calcsOut = name => (S.calcs[name] || []).map(({name, expr, fmt}) => ({name, expr, fmt}));
const dsKey = d => JSON.stringify({c: calcsOut(d.name), f: S.fmt[d.name] || {}, k: d.columns});
const repContent = r => ({active: r.active, pages: (r.pages || []).map(pg => ({...pg, visuals: pg.visuals.map(({_q, ...v}) => v)}))});
const repKey = r => JSON.stringify({n: r.name, c: repContent(r)});

function setSync(state, msg){
  const el = $('#syncState'); if (!el) return;
  el.hidden = !SRV.on;
  el.className = 'sync';
  if (!canEdit()){ el.classList.add('ro'); el.textContent = 'View only'; el.title = 'You can explore and filter reports but not change them. Ask an administrator for editor access.'; return; }
  const T = {pending: ['Unsaved changes', ''], saving: ['Saving…', ''], saved: ['All changes saved', ''], error: ['Not saved · retry', 'err'], conflict: ['Changed by someone else', 'conflict']}[state] || ['', ''];
  el.textContent = T[0]; if (T[1]) el.classList.add(T[1]);
  el.title = msg || (state === 'saved' ? 'Saved to the Basira server' : '');
}
function srvSave(){
  if (!SRV.on || !canEdit()) return;
  clearTimeout(SRV.timer); setSync('pending');
  SRV.timer = setTimeout(srvFlush, 900);
}
async function srvFlush(){
  if (SRV.busy){ SRV.again = true; return; }
  SRV.busy = true; setSync('saving');
  try {
    stashReport();
    for (const d of Object.values(S.datasets)){
      if (d.sample || !d.rows) continue;
      if (!d.serverId){
        const m = await apiBig('POST', 'datasets', {name: d.name, columns: d.columns, rows: d.rows, source: d.source || null, calcs: calcsOut(d.name), fmt: S.fmt[d.name] || {}});
        Object.assign(d, {serverId: m.id, version: m.version, dirtyRows: false});
        SRV.dsIds.add(m.id); SRV.dsMeta[d.name] = dsKey(d);
        continue;
      }
      if (d.dirtyRows){
        d.dirtyRows = false;
        try { const m = await apiBig('PUT', `datasets/${d.serverId}/rows`, {columns: d.columns, rows: d.rows, source: d.source || null, refreshed: !!d.justRefreshed}); d.version = m.version; d.justRefreshed = false; }
        catch (e){ d.dirtyRows = true; throw e; }
      }
      const k = dsKey(d);
      if (SRV.dsMeta[d.name] !== k){ await api('PATCH', `datasets/${d.serverId}`, {calcs: calcsOut(d.name), fmt: S.fmt[d.name] || {}, columns: d.columns}); SRV.dsMeta[d.name] = k; }
    }
    const liveDs = new Set(Object.values(S.datasets).map(d => d.serverId).filter(Boolean));
    for (const id of [...SRV.dsIds]) if (!liveDs.has(id)){ await api('DELETE', `datasets/${id}`).catch(e => { if (e.status !== 404) throw e; }); SRV.dsIds.delete(id); }
    for (const r of REPORTS){
      if (SRV.conflict?.r === r) continue;
      const key = repKey(r);
      if (SRV.saved[r.id] === key) continue;
      try {
        const out = await api('PUT', `reports/${encodeURIComponent(r.id)}`, {name: r.name, content: repContent(r), version: r.version || 0});
        r.version = out.version; SRV.saved[r.id] = key; SRV.repIds.add(r.id);
      } catch (e){
        if (e.status === 409 && e.data?.report){ SRV.conflict = {r, latest: e.data.report, msg: e.message}; continue; }
        throw e;
      }
    }
    const live = new Set(REPORTS.map(r => r.id));
    for (const id of [...SRV.repIds]) if (!live.has(id)){ await api('DELETE', `reports/${encodeURIComponent(id)}`).catch(e => { if (e.status !== 404) throw e; }); SRV.repIds.delete(id); delete SRV.saved[id]; }
    setSync(SRV.conflict ? 'conflict' : 'saved', SRV.conflict?.msg);
    if (SRV.conflict) showConflict();

    setSync('error', e.message);
    if (e.status === 401) showSignIn('expired');
    else if (!SRV.errShown){ SRV.errShown = true; toast(`Changes not saved: ${e.message}`, 'Retry', () => { SRV.errShown = false; srvSave(); }); }
  } finally {
    SRV.busy = false;
    if (SRV.again){ SRV.again = false; srvSave(); }
  }
}
function showConflict(){
  const c = SRV.conflict; if (!c) return;
  const dlg = modal(`<div class="dlg-h"><h3>This report changed</h3></div>
    <div class="dlg-b"><p>${esc(c.msg)} Your recent changes to “${esc(c.r.name)}” have not been saved.</p>
    <div class="form-row"><button class="btn primary" id="cfTheirs" type="button">Load the newer version</button><button class="btn" id="cfMine" type="button">Keep my version and overwrite</button></div></div>`, 'small');

async function initServer(){

  REPORTS = rl.reports.map(r => ({id: r.id, name: r.name, active: r.content.active, pages: r.content.pages, version: r.version}));

  renderUser(); setSync('saved');

    resetToSample();
    if (canEdit()) toast('Welcome to Basira. This sample report is shared with your organisation; import your own data from Data → Import data.');
  } else {
    let last = null; try { last = localStorage.getItem('basira-last-report'); } catch {}
    loadReport(REPORTS.find(r => r.id === last) || REPORTS[0]);
  }

}

    await initServer();
  } catch (e){
    if (e.status === 401) return showSignIn();
    document.body.insertAdjacentHTML('beforeend', `<div class="signin"><div class="signin-card"><h1>Basira</h1><p class="err">${esc(e.message)}</p><a class="btn" href="./">Try again</a></div></div>`);
  }
}
window.addEventListener('beforeunload', e => { if (SRV.on && canEdit() && ($('#syncState')?.textContent || '').match(/Unsaved|Saving|Not saved/)){ e.preventDefault(); e.returnValue = ''; } });

applyTheme();
boot();
</script>

</body>
</html>
